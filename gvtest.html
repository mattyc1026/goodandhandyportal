<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Google Voice Link Test</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#16233a;--muted:#5d6b82;--line:#d6dce6;--accent:#e8791a;--navy:#0f2647;}
@media (prefers-color-scheme:dark){:root{--bg:#0f1622;--card:#182233;--ink:#e6ebf3;--muted:#9aa7bb;--line:#2b3850;--navy:#c9d6ee;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right));}
h1{font-size:1.35em;margin:4px 0 12px;color:var(--navy)}
label{font-weight:700;display:block;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}
.grp h2{font-size:1.05em;margin:0 0 10px}
a.t{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;color:var(--ink);text-decoration:none;font-weight:700}
a.t b{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:.9em}
a.t span{font-weight:500;color:var(--muted);font-size:.82em;display:block;word-break:break-all}
</style></head><body>
<h1>Google Voice link test</h1>
<label for="num">Phone number to test with</label>
<input id="num" type="tel" inputmode="tel" autocomplete="off">
<div class="grp"><h2>Call</h2><div id="calls"></div></div>
<div class="grp"><h2>Text</h2><div id="texts"></div></div>
<script>
const CALLS=[
 ['1','Google Voice website, call','https://voice.google.com/u/0/calls?a=nc,%2B{n}'],
 ['2','Google Voice app, call (A)','googlevoice://call?number=%2B{n}'],
 ['3','Google Voice app, call (B)','googlevoice://+{n}'],
 ['4','Google Voice app, open only','googlevoice://']
];
const TEXTS=[
 ['5','Google Voice website, text','https://voice.google.com/u/0/messages?itemId=t.%2B{n}'],
 ['6','Google Voice app, text (A)','googlevoice://sms?number=%2B{n}&body=Test'],
 ['7','Google Voice app, text (B)','googlevoice://text?number=%2B{n}&text=Test']
];
function draw(){
  let d=(document.getElementById('num').value||'').replace(/\D/g,'');
  if(d.length===10) d='1'+d;
  const row=([k,l,u])=>{ const h=u.replace('{n}',d||'1'); return `<a class="t" href="${h}"><b>${k}</b><div>${l}<span>${h}</span></div></a>`; };
  document.getElementById('calls').innerHTML=CALLS.map(row).join('');
  document.getElementById('texts').innerHTML=TEXTS.map(row).join('');
}
document.getElementById('num').addEventListener('input',draw);
try{ const v=localStorage.getItem('gvtest_num'); if(v) document.getElementById('num').value=v; }catch(e){}
document.getElementById('num').addEventListener('change',e=>{ try{localStorage.setItem('gvtest_num',e.target.value)}catch(_){} });
draw();
</script>
</body></html>
