<style>
:root{
  /* Brand navy + orange are fixed by the logo; everything else is tuned around them. */
  --navy:#0f2647; --navy2:#1b3f73; --orange:#e8791a; --orange2:#ff9436;
  /* Cool drafting-paper ground rather than warm cream: it pushes the navy
     structure forward and makes the orange accent read as a real signal.
     --cream keeps its name so every existing surface picks this up for free. */
  --cream:#e9edf3; --paper:#ffffff; --ink:#141f33; --muted:#5f6e87;
  --line:#dbe2ec; --line-soft:#eaeef4;
  /* Status tints, solid rather than translucent, so stacked colours never
     muddy each other. Pitched to actually carry across the card, a pale
     wash disappears against white and the stage stops being readable at a
     glance. High-contrast mode pushes these further still. */
  --red:#ffd9d9; --redb:#c0392b; --red-bold:#ffb3b3;
  --yellow:#fff1c4; --yellowb:#a5710a; --yellow-bold:#ffe08a;
  --green:#d2f2df; --greenb:#1f8a55; --green-bold:#a8ecc4;
  --blue:#d8e6ff; --blueb:#1f5aa8; --blue-bold:#aecdfa;
  --grey:#e9edf2; --greyb:#5f6e87;
  --radius:12px; --radius-sm:8px; --radius-lg:18px;
  /* Layered shadows read as real elevation instead of a single grey blur. */
  --sh-1:0 1px 2px rgba(15,38,71,.06), 0 1px 3px rgba(15,38,71,.04);
  --sh-2:0 2px 4px rgba(15,38,71,.06), 0 6px 16px rgba(15,38,71,.08);
  --sh-3:0 8px 20px rgba(15,38,71,.10), 0 20px 48px rgba(15,38,71,.14);
  --sh-4:0 24px 70px rgba(6,17,35,.42);
  --f-display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-data:'DM Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  /* Base font size for the adjustable text-size control on wide screens.
     The mobile stylesheet uses --mScale for the same job; both are driven
     from one setting by applyTextSize(), so the control covers the whole
     app rather than only phones. */
  --dScale:16px;

  /* ---- MOTION SYSTEM ----
     One place to tune the whole app's feel. The curves are the ones iOS
     uses: --e-spring is the sheet-presentation curve (fast off the mark,
     long soft settle), --e-out is the standard decelerate, and --e-bounce
     overshoots slightly for things that should feel physical when tapped.
     Durations are named by role, not by number, so a global retune is a
     three-line edit rather than a search across the stylesheet. */
  --e-spring:cubic-bezier(.32,.72,0,1);
  --e-out:cubic-bezier(.22,1,.36,1);
  --e-bounce:cubic-bezier(.34,1.56,.64,1);
  --e-in:cubic-bezier(.4,0,1,1);
  --t-press:.14s; --t-fast:.2s; --t-med:.32s; --t-sheet:.42s;

  /* Live-on-site neon. Deliberately outside the status palette: the job
     progression greens (--green / --greenb) mean "this stage of the
     lifecycle", while this means "a human is physically on the job right
     now", so it must not read as another shade of the same thing. */
  --neon:#00ff7a; --neon-rail:#00e36c; --neon-rgb:0,255,122;
}
/* ---- High Contrast mode ----
   Toggled by adding class "hc" to <html>. Overrides the same CSS
   variables everything else already reads, so the whole app (text,
   borders, status highlight colors) gets darker text and stronger
   borders/backgrounds without needing separate override rules per
   element. */
html.hc{
  --navy:#000000; --navy2:#000000; --orange:#a83e00; --orange2:#c74600;
  --cream:#ffffff; --paper:#ffffff; --ink:#000000; --muted:#2b2b2b;
  --line:#000000; --line-soft:#000000;
  --red:#ffbfbf; --redb:#a30000; --red-bold:#ff8f8f;
  --yellow:#ffe89a; --yellowb:#6b5400; --yellow-bold:#ffcf3d;
  --green:#b3ecc8; --greenb:#0b5c34; --green-bold:#79e0a2;
  --blue:#bcd7ff; --blueb:#0a3a86; --blue-bold:#87b6f7;
  --grey:#e0e0e0; --greyb:#222222;
  /* High contrast trades the glow for a heavy, unambiguous green rail. */
  --neon:#005c2a; --neon-rail:#005c2a; --neon-rgb:0,92,42;
  --sh-1:none; --sh-2:none; --sh-3:none; --sh-4:none;
}
html.hc body{background:#fff;}
/* High contrast keeps the status spine, it just makes it heavier, along with
   the surrounding border. Setting only the individual sides leaves the left
   rail intact; a `border-width` shorthand here would flatten it. */
html.hc .woRow{border-top-width:2px;border-right-width:2px;border-bottom-width:2px;border-left-width:8px;}
html.hc .woRow.st-red-bold,html.hc .woRow.st-yellow-bold,html.hc .woRow.st-green-bold,html.hc .woRow.st-blue-bold{
  border-top-width:3px;border-right-width:3px;border-bottom-width:3px;border-left-width:12px;
}
html.hc .woSub,html.hc .woMeta,html.hc .woLastNote,html.hc .woNoteDate,html.hc .listHeader p,html.hc .small,html.hc .field label{color:#000 !important;}
html.hc .tag{border:1px solid #000;}
html.hc .field input,html.hc select,html.hc textarea{border:1.5px solid #000;}
html.hc a,html.hc .editLink,html.hc .adminViewLink{color:#a83e00;}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--f-body);background:var(--cream);color:var(--ink);
  font-size:var(--dScale,16px);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em;}
h1,h2,h3{font-family:var(--f-display);margin:0 0 .3em;color:var(--navy);font-weight:400;letter-spacing:-.01em;}
button{cursor:pointer;font-family:inherit;font-size:inherit;}
/* Form controls don't inherit font-size from the page by default, so without
   this the text-size control would leave every input and button behind on
   desktop. Class-level em sizes still win over this, so relative sizing is
   preserved, this only supplies the scalable baseline. */
input,select,textarea{font-family:inherit;font-size:inherit;}
.hidden{display:none !important;}

/* ---- LOGIN ----
   Deep navy ground with a faint drafting-grid overlay and a warm glow behind
   the card, the workshop-blueprint idea the rest of the app is built on,
   stated once, at full strength, where there's room for it. */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:28px 16px;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(232,121,26,.20), transparent 60%),
    linear-gradient(165deg,#122c52 0%,var(--navy) 45%,#0a1b33 100%);
}
#loginScreen::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(85% 70% at 50% 40%, #000 30%, transparent 100%);
  mask-image:radial-gradient(85% 70% at 50% 40%, #000 30%, transparent 100%);
}
html.hc #loginScreen{background:#fff;}
html.hc #loginScreen::before{display:none;}
.loginCard{
  background:var(--paper);width:392px;max-width:100%;border-radius:var(--radius-lg);
  padding:38px 34px 32px;box-shadow:var(--sh-4);position:relative;z-index:1;
  border:1px solid rgba(255,255,255,.6);
}
html.hc .loginCard{border:2px solid #000;}
.loginCard h1{font-size:1.7em;text-align:center;}
.loginCard .tag{
  text-align:center;color:var(--orange);font-weight:700;letter-spacing:.18em;
  font-size:.68em;text-transform:uppercase;margin-bottom:24px;
}
.field{margin-bottom:15px;}
.field label{
  display:block;font-size:.7em;color:var(--muted);margin-bottom:6px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
}
.field input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  font-size:1em;font-family:inherit;background:var(--paper);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{
  outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(232,121,26,.16);
}
.btn{
  background:var(--orange);color:#fff;border:none;padding:13px 22px;
  border-radius:var(--radius-sm);font-weight:700;font-size:1em;min-height:44px;
  font-family:inherit;letter-spacing:.01em;
  box-shadow:0 1px 2px rgba(15,38,71,.12);
  transition:background .15s,transform .1s,box-shadow .15s;
}
.btn:hover{background:var(--orange2);box-shadow:0 4px 12px rgba(232,121,26,.32);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:transparent;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;}
.btn.secondary:hover{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:var(--sh-1);}
.btn.danger{background:var(--redb);}
.btn.danger:hover{background:#a52f22;box-shadow:0 4px 12px rgba(192,57,43,.3);}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
.btnRow{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;}
.switchLine{text-align:center;margin-top:18px;font-size:.85em;color:var(--muted);}
.switchLine a{color:var(--orange);cursor:pointer;font-weight:600;text-decoration:none;}
.switchLine a:hover{text-decoration:underline;}
.errMsg{color:var(--redb);font-size:.82em;margin-top:-6px;margin-bottom:10px;min-height:1em;font-weight:500;}

/* ---- APP SHELL ---- */
#appScreen{min-height:100vh;}
header.top{
  background:linear-gradient(180deg,#14315b,var(--navy));
  color:#fff;padding:13px 26px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, var(--sh-2);
  position:sticky;top:0;z-index:50;
}
html.hc header.top{background:#000;}
.globalSearchBar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:11px 26px;display:flex;gap:10px;align-items:center;
}
.globalSearchBar input{
  flex:1;max-width:480px;padding:10px 14px;border-radius:var(--radius-sm);
  border:1.5px solid var(--line);font-size:.92em;font-family:inherit;
  box-sizing:border-box;background:var(--cream);color:var(--ink);
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.globalSearchBar input:focus{
  outline:none;background:var(--paper);border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(232,121,26,.14);
}
.globalSearchBar button{white-space:nowrap;flex:0 0 auto;}
header.top .brand{font-family:var(--f-display);font-size:1.35em;}
header.top .brand span{color:var(--orange);}
.userBadge{display:flex;align-items:center;gap:12px;font-size:.85em;}
.adminPill{
  background:var(--orange);color:#fff;font-size:.66em;padding:3px 9px;border-radius:20px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.logoutBtn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:#fff;

/* Inline SVG gear instead of the U+2699 character. The character has both a

.gearIcon{

.tabsBarWrap{position:sticky;top:0;z-index:49;}
.tabsToggleBtn{display:none;}
nav.tabs{display:flex;background:var(--navy2);padding:0 20px;gap:2px;overflow-x:auto;}
nav.tabs button{

main{padding:26px 30px;max-width:1300px;margin:0 auto;}

.sortWrap select{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;
  font-size:.85em;font-family:inherit;background:var(--paper);color:var(--navy);font-weight:600;
}
.sortWrap select:hover{border-color:var(--navy);}

/* ---- WORK ORDER ROW: the status spine ----
   The colour system is a PROGRESSION through the job lifecycle, not a severity
   scale. Jobs advance red > yellow > green > blue, and within each colour the
   BOLD state means "this stage still needs doing" while the TRANSPARENT state
   means "it's been actioned and is now in flight":

     red-bold     pre-site inspection needed      red     pre-site scheduled
     yellow-bold  estimate needs building         yellow  estimate pending approval
     green-bold   job needs scheduling            green   scheduled / in progress
     blue-bold    invoice needs building          blue    invoiced, survey pending
     grey         closed, in job history

   Each row is a white card with a solid rail down its left edge carrying the
   stage colour, and a tint that fades out over a fixed distance from the rail.
   Bold states get a thicker rail, a deeper tint and a full coloured border, so
   "waiting on me" reads at a glance against "waiting on someone else", without
   washing the whole card in colour and drowning the text. */
.woRow{
  background:var(--paper);border:1px solid var(--line);
  border-left:5px solid var(--line);border-radius:var(--radius);
  padding:15px 18px;margin-bottom:10px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}
.woRow:hover{box-shadow:var(--sh-2);transform:translateY(-2px);}
.woRow.st-red{border-left-color:var(--redb);background:linear-gradient(90deg,var(--red),var(--paper) 300px);}
.woRow.st-red-bold{border-color:var(--redb);border-left-color:var(--redb);border-left-width:8px;background:linear-gradient(90deg,var(--red-bold),var(--paper) 400px);}
.woRow.st-yellow{border-left-color:var(--yellowb);background:linear-gradient(90deg,var(--yellow),var(--paper) 300px);}
.woRow.st-yellow-bold{border-color:var(--yellowb);border-left-color:var(--yellowb);border-left-width:8px;background:linear-gradient(90deg,var(--yellow-bold),var(--paper) 400px);}
.woRow.st-green{border-left-color:var(--greenb);background:linear-gradient(90deg,var(--green),var(--paper) 300px);}
.woRow.st-green-bold{border-color:var(--greenb);border-left-color:var(--greenb);border-left-width:8px;background:linear-gradient(90deg,var(--green-bold),var(--paper) 400px);}
.woRow.st-blue{border-left-color:var(--blueb);background:linear-gradient(90deg,var(--blue),var(--paper) 300px);}
.woRow.st-blue-bold{border-color:var(--blueb);border-left-color:var(--blueb);border-left-width:8px;background:linear-gradient(90deg,var(--blue-bold),var(--paper) 400px);}
.woRow.st-grey{border-left-color:var(--greyb);background:linear-gradient(90deg,var(--grey),var(--paper) 300px);}
/* The bold tints are saturated enough that the default muted grey loses
   contrast against them, darken the supporting text on those rows so a
   job that still needs action stays the most readable one on the board. */
.woRow.st-red-bold .woSub, .woRow.st-red-bold .woMeta, .woRow.st-red-bold .woLastNote, .woRow.st-red-bold .woNoteDate,
.woRow.st-yellow-bold .woSub, .woRow.st-yellow-bold .woMeta, .woRow.st-yellow-bold .woLastNote, .woRow.st-yellow-bold .woNoteDate,
.woRow.st-green-bold .woSub, .woRow.st-green-bold .woMeta, .woRow.st-green-bold .woLastNote, .woRow.st-green-bold .woNoteDate,
.woRow.st-blue-bold .woSub, .woRow.st-blue-bold .woMeta, .woRow.st-blue-bold .woLastNote, .woRow.st-blue-bold .woNoteDate{
  color:var(--ink);
}
/* The follow-up badge needs a solid ground so it stays legible on the tint. */
.woRow.st-red-bold .followupBadge, .woRow.st-yellow-bold .followupBadge,
.woRow.st-green-bold .followupBadge, .woRow.st-blue-bold .followupBadge{
  background:rgba(255,255,255,.85);
}
.woRow .woMain{display:flex;flex-direction:column;gap:3px;}
.woRow .woName{font-weight:700;color:var(--navy);font-size:1.02em;letter-spacing:-.01em;}
.woRow .woSub{font-size:.8em;color:var(--muted);}
.woRow .woMeta{display:flex;align-items:center;gap:16px;font-size:.78em;color:var(--muted);row-gap:10px;flex-wrap:wrap;}
/* Status pills follow the same bold/transparent logic as the row spine:
   a SOLID pill is a stage still waiting on you, an OUTLINED pill is a stage
   already actioned and now in flight. Same hue, so the pill and the rail
   always agree about where the job sits. */
.tag{
  padding:3px 11px;border-radius:20px;font-size:.7em;font-weight:700;
  letter-spacing:.07em;white-space:nowrap;text-transform:uppercase;
  border:1.5px solid transparent;
}
/* needs doing, solid */
.tag.pending{background:var(--redb);color:#fff;}
.tag.build-est{background:var(--yellowb);color:#fff;}
.tag.go{background:var(--greenb);color:#fff;}
.tag.build-inv{background:var(--blueb);color:#fff;}
/* in flight, outlined */
.tag.sched{background:var(--red);color:var(--redb);border-color:var(--redb);}
.tag.awaiting-approval{background:var(--yellow);color:var(--yellowb);border-color:var(--yellowb);}
.tag.in-prog{background:var(--green);color:var(--greenb);border-color:var(--greenb);}
.tag.survey{background:var(--blue);color:var(--blueb);border-color:var(--blueb);}
/* closed */
.tag.hist{background:var(--grey);color:var(--greyb);border-color:var(--line);}
html.hc .tag.pending,html.hc .tag.build-est,html.hc .tag.go,html.hc .tag.build-inv{color:#fff;}
.emptyState{

}
.subListHeader{
  margin:26px 2px 12px;font-size:.76em;color:var(--navy);display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding-bottom:8px;
  text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-family:var(--f-body);
}

  font-family:var(--f-data);font-weight:500;letter-spacing:0;
}
input[type="checkbox"]{width:19px;height:19px;cursor:pointer;accent-color:var(--orange);}

.jcCheck:hover{border-color:var(--line);background:var(--paper);}
.estDecisionRow{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap;}
.docsTab{background:var(--paper);}
.docsTab h4{margin-top:0;}
/* The upload control was a raw, unstyled browser file input. Given it as a
   drop target and a real button it reads as part of the app and gives a much
   larger tap area on a phone. */
.docsTab input[type="file"]{
  display:block;width:100%;padding:14px;border:1.5px dashed var(--orange);
  border-radius:var(--radius);background:rgba(232,121,26,.04);

}

}

.docsTab input[type="file"]:disabled{opacity:.55;cursor:progress;border-style:solid;}

html.hc .docsTab input[type="file"]::file-selector-button{background:#000;}
.docRow{

  transition:background .15s,border-color .15s;
}
.newWoBtn:hover{background:rgba(232,121,26,.07);border-color:var(--orange2);}

/* ---- MODAL ---- */
.overlay{
  position:fixed;inset:0;background:rgba(10,24,45,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;z-index:100;
}
.modal{
  background:var(--paper);border-radius:var(--radius-lg);width:100%;max-width:1100px;
  box-shadow:var(--sh-4);animation:pop .16s cubic-bezier(.2,.8,.3,1);overflow-x:hidden;
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
.modalHead{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:20px 24px;border-bottom:1px solid var(--line);gap:14px;
}
.modalHead h2{margin:0;font-size:1.3em;}
.modalHeadCust{display:grid;grid-template-columns:auto auto;column-gap:34px;row-gap:3px;align-content:start;cursor:pointer;}
.modalHeadCust.editing{display:flex;flex-direction:column;gap:6px;width:360px;max-width:100%;cursor:default;}
.modalHeadCust.editing .kv{margin-bottom:0;}
.modalHeadCust .mhName{font-family:var(--f-display);font-size:1.45em;color:var(--navy);font-weight:400;letter-spacing:-.01em;}
.modalHeadCust .mhAddr1,.modalHeadCust .mhAddr2{font-size:.88em;color:var(--muted);align-self:end;}
/* Tap-to-call numbers. Marked with the accent and a dotted underline so it's
   discoverable that they're actionable, without turning every phone number
   into a loud button. The negative margin keeps the enlarged tap target from
   shifting the surrounding layout. */
.telLink{
  color:var(--orange);text-decoration:none;font-weight:500;
  border-bottom:1px dotted rgba(232,121,26,.55);
  padding:2px 1px;margin:-2px -1px;border-radius:3px;
  transition:color .12s,background .12s;
}
.telLink:hover{color:var(--orange2);background:rgba(232,121,26,.09);border-bottom-color:var(--orange2);}
.telLink:active{background:rgba(232,121,26,.18);}
html.hc .telLink{color:var(--orange);border-bottom:2px solid var(--orange);font-weight:700;}
@media (max-width:900px){
  /* Bigger, easier target on the device where calling actually happens. */
  .telLink{display:inline-block;padding:6px 4px;margin:-6px -4px;}
}
.modalHeadCust .mhPrimary,.modalHeadCust .mhAlt{font-size:.92em;color:var(--ink);font-family:var(--f-data);font-size:.86em;}
.modalHeadCust .mhEmail{font-size:.88em;color:var(--muted);}
.headerActionsWrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.headerTabs{display:flex;gap:3px;}
.headerTabs button{
  background:var(--cream);border:1px solid var(--line);border-bottom:none;color:var(--muted);
  font-weight:700;font-size:.74em;padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;
  position:relative;top:1px;min-height:36px;font-family:inherit;
  text-transform:uppercase;letter-spacing:.07em;transition:background .15s,color .15s;
}
.headerTabs button:hover{background:var(--line-soft);color:var(--navy);}
.headerTabs button.active{background:var(--paper);color:var(--orange);border-color:var(--line);}
.closeX{background:transparent;border:none;font-size:1.5em;color:var(--muted);min-width:40px;min-height:40px;border-radius:var(--radius-sm);transition:background .15s,color .15s;}
.closeX:hover{background:var(--cream);color:var(--navy);}
.modalBody{padding:22px 24px;overflow-x:hidden;}
.woGrid{display:flex;gap:20px;flex-wrap:wrap;}
.custPanel{flex:1 1 30%;min-width:min(240px,100%);background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-sizing:border-box;}
.jobPanel{flex:2 1 60%;min-width:min(300px,100%);background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-sizing:border-box;}
/* Section titles get a short orange rule beneath them, the same accent the
   status spine uses, so labelling and status read as one system. */
.panelTitle{
  font-size:.7em;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);
  font-weight:700;margin-bottom:12px;padding-bottom:7px;position:relative;
}
.panelTitle::after{content:'';position:absolute;left:0;bottom:0;width:26px;height:2px;background:var(--orange);border-radius:2px;}
.kv{margin-bottom:9px;font-size:.9em;}
.addrSuggest{
  position:absolute;left:0;right:0;top:100%;z-index:80;
  background:#fff;border:1.5px solid var(--line);border-top:none;
  border-radius:0 0 6px 6px;box-shadow:0 8px 20px rgba(0,0,0,.15);
  max-height:220px;overflow-y:auto;
}
.addrSuggestItem{padding:9px 10px;font-size:.85em;line-height:1.3;cursor:pointer;border-bottom:1px solid #f0eee6;color:var(--navy);}
.addrSuggestItem:last-child{border-bottom:none;}
.addrSuggestItem:hover,.addrSuggestItem:active{background:var(--cream);}
.kv b{color:var(--navy);display:block;font-size:.68em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:1px;}
.schedSection{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
/* The divider exists to separate this section from what sits above it. Now
   that Schedule Date(s) leads the panel, the first one has nothing to divide
   from and would just float a stray rule at the top of the card. */
.custPanel > .schedSection:first-child{margin-top:0;border-top:none;padding-top:0;}
.schedSubHeader{font-size:.68em;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:12px 0 6px;}
.schedRow{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:7px;font-size:.88em;
  box-shadow:var(--sh-1);
}
.schedRow b{color:var(--navy);}
.tinyDel{background:none;border:none;color:var(--redb);font-size:1.1em;font-weight:700;cursor:pointer;padding:2px 6px;line-height:1;min-height:28px;border-radius:5px;}
.tinyDel:hover{background:var(--red);}
.schedWidgetWrap{display:flex;gap:20px;flex-wrap:wrap;max-width:100%;}
.schedCalCol{flex:1 1 320px;min-width:min(280px,100%);max-width:100%;}
.schedFormCol{flex:1 1 280px;min-width:min(260px,100%);max-width:100%;box-sizing:border-box;}
.schedCalNav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.schedCalNav button{background:var(--cream);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:7px 13px;font-weight:700;color:var(--navy);font-family:inherit;transition:border-color .15s,background .15s;}
.schedCalNav button:hover{border-color:var(--navy);background:var(--paper);}
.schedCalGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.schedCalGrid .dow{font-size:.66em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;padding-bottom:6px;letter-spacing:.08em;}
.schedCalDay{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--paper);
  font-size:.85em;font-family:var(--f-data);cursor:pointer;min-height:36px;
  transition:border-color .12s,background .12s,transform .12s;
}
.schedCalDay:not(.empty):not(.past):hover{border-color:var(--navy);transform:translateY(-1px);}
.schedCalDay.empty{visibility:hidden;cursor:default;}
.schedCalDay.past{color:#aab3c2;cursor:not-allowed;background:var(--cream);}
.schedCalDay.hasJob{background:var(--yellow);border-color:var(--yellowb);cursor:pointer;}
.schedCalDay.hasJob::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--yellowb);}
.schedCalDay.selStart,.schedCalDay.selEnd{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:500;}
.schedCalDay.inRange{background:rgba(15,38,71,.12);border-color:rgba(15,38,71,.2);}
.schedCalDay.skipDay{background:repeating-linear-gradient(45deg,rgba(15,38,71,.06),rgba(15,38,71,.06) 4px,transparent 4px,transparent 8px);color:#9aa4b2;}
.field select#schedRepeat{width:100%;padding:10px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--paper);font:inherit;color:var(--ink);}
.schedRepeatNote{font-size:.8em;color:var(--muted);margin-top:-4px;margin-bottom:8px;line-height:1.5;}
.schedDayPopup{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 11px;border-radius:var(--radius-sm);font-size:.72em;line-height:1.45;white-space:normal;width:max-content;max-width:200px;z-index:60;box-shadow:var(--sh-3);display:none;text-align:left;cursor:default;font-family:var(--f-body);}
.schedDayPopup b{color:#fff;display:block;font-size:1em;}
.schedDayPopup .schedDayPopupRow{margin-top:3px;}
.schedDayPopup .schedDayPopupRow:first-child{margin-top:0;}
.schedCalDay.hasJob.showInfo .schedDayPopup{display:block;}
@media (hover:hover) and (pointer:fine){
  .schedCalDay.hasJob:hover .schedDayPopup{display:block;}
}
.schedTypeToggle{display:flex;gap:8px;margin-bottom:14px;}
.schedTypeToggle button{flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:.82em;color:var(--muted);font-family:inherit;transition:all .15s;}
.schedTypeToggle button:hover{border-color:var(--navy);color:var(--navy);}
.schedTypeToggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.schedPendingList{margin-top:16px;}
.schedPendingItem{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:7px;font-size:.85em;}
.jobList{margin:10px 0;}
.jobList h4{font-size:.7em;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-family:var(--f-body);font-weight:700;}
.jobList ul{margin:0;padding-left:18px;font-size:.85em;line-height:1.6;}
.notesSection{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;}
.noteEntryRow{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.noteEntryTop{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
.noteFieldGroup{display:flex;flex-direction:column;gap:5px;}

.noteEntryTop select{padding:10px 11px;border-radius:var(--radius-sm);border:1.5px solid var(--line);min-height:40px;font-size:.92em;font-family:inherit;background:var(--paper);color:var(--ink);}
.noteEntryRow textarea{

.adminLogRow{font-size:.78em;color:#6b5320;margin-bottom:6px;line-height:1.5;}

.laborPick{background:var(--cream);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}

.copyBox{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px;font-size:.78em;white-space:pre-wrap;max-height:140px;overflow-y:auto;margin-top:8px;font-family:var(--f-data);line-height:1.5;}

.aiPanel h4{margin:0 0 10px;color:var(--orange2);font-size:.7em;text-transform:uppercase;letter-spacing:.12em;font-family:var(--f-body);}
.chatLog{max-height:220px;overflow-y:auto;background:rgba(255,255,255,.07);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;font-size:.85em;line-height:1.55;}
.chatMsg{margin-bottom:8px;}
.chatMsg.user{color:var(--orange2);}
.chatMsg.ai{color:#e6ecf5;}
.aiInputRow{display:flex;gap:8px;}
.aiInputRow input{flex:1;padding:10px;border-radius:var(--radius-sm);border:none;font-family:inherit;}
.listEditor{background:var(--paper);color:var(--ink);border-radius:var(--radius-sm);padding:14px;margin-top:10px;}
.listEditor h5{margin:0 0 10px;color:var(--navy);font-size:.72em;text-transform:uppercase;letter-spacing:.09em;}
.editRow{display:flex;gap:6px;margin-bottom:6px;}
.editRow input{flex:1;padding:8px 10px;border-radius:6px;border:1.5px solid var(--line);font-family:inherit;}
.editRow button{background:var(--redb);color:#fff;border:none;border-radius:6px;padding:0 12px;font-family:inherit;font-weight:700;}
.small{font-size:.8em;color:var(--muted);line-height:1.5;}
.confirmBox{position:fixed;inset:0;background:rgba(10,24,45,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;box-sizing:border-box;overflow-y:auto;}
.confirmCard{background:var(--paper);border-radius:var(--radius-lg);padding:30px 30px;max-width:380px;width:100%;text-align:center;box-shadow:var(--sh-4);box-sizing:border-box;overflow-x:hidden;animation:pop .16s cubic-bezier(.2,.8,.3,1);}

.confirmCard .btnRow{justify-content:center;}
.syncPill{

  font-family:inherit;text-transform:uppercase;transition:background .15s;
}
.syncPill.on{background:var(--greenb);border-color:var(--greenb);}
.syncPill.off{background:rgba(255,255,255,.07);}
#syncModal textarea{width:100%;min-height:110px;padding:10px;border-radius:var(--radius-sm);border:1.5px solid var(--line);font-family:var(--f-data);font-size:.82em;}
.priceTag{color:var(--orange);font-weight:700;white-space:nowrap;margin-left:8px;font-size:.85em;font-family:var(--f-data);}

.lineRow:last-child{border-bottom:none;}
.lineText{flex:1;}
.copyIcon{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:.95em;flex-shrink:0;border-radius:4px;}
.copyIcon:hover{color:var(--orange);background:var(--cream);}
.sideBySide{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.sideBySide>div{flex:1;min-width:220px;}
.descParagraph{background:var(--paper);border-radius:var(--radius-sm);padding:13px 15px;font-size:.88em;line-height:1.6;margin-bottom:6px;border:1px solid var(--line);}
.expandLinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.expandLinks details{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;flex:1;min-width:180px;}
.expandLinks summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:.78em;text-transform:uppercase;letter-spacing:.06em;}
.expandLinks .lineRow{font-size:.82em;}
.custDisplay .kv{display:flex;justify-content:space-between;align-items:baseline;}
.editLink{background:none;border:none;color:var(--orange);font-weight:700;font-size:.78em;cursor:pointer;padding:8px 4px;min-height:36px;font-family:inherit;text-transform:uppercase;letter-spacing:.06em;}
.editLink:hover{color:var(--orange2);text-decoration:underline;}
.adminViewLink{background:none;border:none;color:var(--muted);font-size:.85em;font-weight:600;cursor:pointer;text-decoration:underline;margin-right:20px;padding:8px 4px;min-height:36px;display:inline-flex;align-items:center;font-family:inherit;}
.woLastNote{font-size:.78em;color:var(--muted);margin-top:3px;line-height:1.5;}
.woLastNote b{color:var(--navy);}
.woNoteDate{color:#93a0b3;font-family:var(--f-data);font-size:.94em;}
.followupBadge{display:inline-flex;align-items:center;gap:4px;font-size:.7em;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--cream);color:var(--navy);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;}
.followupBadge.due{background:var(--red);color:var(--redb);animation:pulseFollowup 1.9s infinite;}
@keyframes pulseFollowup{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.4);}50%{box-shadow:0 0 0 5px rgba(192,57,43,0);}}
.dateFieldWrap{display:flex;align-items:stretch;gap:0;width:190px;max-width:100%;}
.dateFieldWrap input[type="text"]{

  border:1.5px solid var(--line);border-right:none;background:var(--paper);color:var(--ink);

}
.dateFieldWrap input[type="text"].dateInvalid{border-color:var(--redb);}
.dateFieldWrap .calWrap{position:relative;flex:0 0 auto;display:flex;}
.dateFieldWrap .calBtn{
  flex:0 0 auto;min-width:42px;min-height:40px;padding:0 10px;
  border:1.5px solid var(--line);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--cream);
  color:var(--navy);font-size:1.05em;display:inline-flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.dateFieldWrap .calWrap:hover .calBtn{background:var(--line-soft);}
.calNativeOverlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer;}
.noteFollowTag{display:inline-block;font-size:.7em;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--cream);color:var(--navy);margin-left:6px;text-transform:uppercase;letter-spacing:.05em;}
.noteFollowTag.due{background:var(--red);color:var(--redb);}

/* ---- Check-In / Check-Out (In Progress NAV tab) ----
   A crew currently on site is the single most time-sensitive thing on the
   board, so it keeps a live pulse, retuned from raw neon to a saturated
   emerald that still reads instantly but sits inside the palette. */
.woRow.checkedInGlow{
  border-color:var(--neon-rail);border-left-color:var(--neon-rail);
  box-shadow:0 0 0 2px rgba(var(--neon-rgb),.55), 0 0 20px 3px rgba(var(--neon-rgb),.45), var(--sh-2);
  animation:checkedInPulse 2.2s ease-in-out infinite;
}
@keyframes checkedInPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(var(--neon-rgb),.5), 0 0 16px 2px rgba(var(--neon-rgb),.34), var(--sh-2);}
  50%{box-shadow:0 0 0 3px rgba(var(--neon-rgb),.95), 0 0 34px 9px rgba(var(--neon-rgb),.7), var(--sh-2);}
}
/* High contrast: keep the meaning, drop the glow. */
html.hc .woRow.checkedInGlow{
  border-color:var(--neon-rail);border-left-color:var(--neon-rail);
  border-left-width:10px;box-shadow:none;animation:none;
}
.checkInOutRow{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;}
.checkInOutRow .jcCheck{white-space:nowrap;}
.checkInOutRow .jcCheck input:disabled{opacity:.6;}
.checkStampBox{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 14px;margin:10px 0;font-size:.85em;
}
.checkStampBox .kv{display:flex;justify-content:space-between;gap:10px;}
.dayLogsList{display:flex;flex-direction:column;gap:8px;}
.dayLogRow{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--cream);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;
}
.dayLogRow .jcCheck{background:var(--paper);padding:6px 11px;min-height:34px;font-size:.92em;}
.dayLogRow .editLink{padding:4px 2px;min-height:28px;font-size:.7em;}
.dayLogDate{flex:1 0 100%;font-weight:700;color:var(--navy);font-size:.94em;margin-bottom:1px;}
.woRow.jumpHighlight{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,121,26,.28), var(--sh-2);}

/* =========================================================================
   RESPONSIVE, TABLET / PHONE (<=900px)
   Redesigned for large touch targets, a fixed thumb-reach bottom nav,
   no hidden/"guess where it is" menus, no pinch-zoom dependence, and
   visible tap feedback so the app feels solid and predictable.
========================================================================= */
@media (max-width:900px){
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;--mScale:18px;}
  body{font-size:var(--mScale,18px);line-height:1.55;}

  /* Visible, gentle tap feedback everywhere so every tap feels confirmed */
  button,.woRow,.btn,a{-webkit-tap-highlight-color:rgba(232,121,26,.25);}
  button,.btn,.woRow,.tag,.docRow{transition:transform .08s ease,box-shadow .08s ease;}
  button:active,.btn:active,.woRow:active{transform:scale(.97);}

  /* Inputs at 16px minimum stop iOS from auto-zooming when a field is
     tapped, combined with the locked viewport above, the page never
     jumps or zooms unexpectedly. Buttons follow the adjustable scale. */
  input,select,textarea{font-size:max(16px,var(--mScale));}
  button{font-size:var(--mScale);}

  /* ---- accessibility settings menu ----
     The gear-icon button and its dropdown (text size + high contrast)
     stay a comfortable tap size on mobile too. */
  .settingsBtn{min-width:40px;min-height:40px;}
  .gearIcon{width:22px;height:22px;}
  .settingsMenu{min-width:210px;}

  /* ---- header ---- */
  header.top{padding:12px 16px;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:60;}
  .globalSearchBar{padding:8px 12px;}
  .globalSearchBar input{max-width:none;}
  header.top .brand img{width:30px;height:30px;}
  .userBadge{font-size:.85em;gap:10px;flex-wrap:wrap;}
  .logoutBtn{padding:9px 14px;min-height:40px;font-size:.85em;}
  .syncPill{padding:6px 12px;font-size:.78em;min-height:32px;display:inline-flex;align-items:center;}

  /* ---- bottom app-style tab bar ----
     Always visible (nothing hidden behind a hamburger), fixed to the
     thumb zone, clearly distinct in color from the navy header, with
     a soft "peek" of the next tab plus edge fades so scrolling for
     more tabs is obvious rather than a hidden gesture. */
  .tabsToggleBtn{display:none !important;}
  .tabsBarWrap{
    position:fixed !important;top:auto !important;bottom:0;left:0;right:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    box-shadow:0 -4px 24px rgba(15,38,71,.14);
    padding-bottom:env(safe-area-inset-bottom,0);
    z-index:60;
  }
  nav.tabs#tabsNav{
    display:flex !important;position:static;
    background:var(--paper);
    padding:6px 6px;gap:4px;
    overflow-x:hidden;flex-wrap:nowrap;
    max-height:none;
  }
  nav.tabs#tabsNav.open{display:flex;}
  nav.tabs#tabsNav button{
    /* Buttons share the available width equally and shrink together so the
       bar itself never exceeds the viewport width. min-width:0 lets flex
       items shrink below their content size; the small min-width floor
       below is the point at which further shrinking would start causing
       buttons to visually crowd/overlap, so it's the last thing to give. */
    flex:1 1 0;width:auto;min-width:0;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);background:transparent;
    border:none;border-bottom:none;border-radius:12px;
    padding:12px 4px;min-height:64px;
    font-size:clamp(.68em,2.6vw,.88em);font-weight:700;
    white-space:normal;line-height:1.2;
    overflow:hidden;
  }
  nav.tabs#tabsNav button.active{
    color:var(--orange);background:rgba(232,121,26,.12);
  }
  nav.tabs#tabsNav button .count{
    background:var(--navy);color:#fff;
  }
  nav.tabs#tabsNav button.active .count{background:var(--orange);}
  /* room so the fixed bottom bar never covers content, and top offset
     handled purely in CSS (no JS-computed inline "top" needed on mobile) */
  main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));}

  /* ---- main content ---- */
  main{padding-left:14px;padding-right:14px;padding-top:16px;}
  .listHeader{flex-direction:column;align-items:flex-start;gap:8px;}
  .listHeader h2{font-size:1.15em;}
  .listHeader p{font-size:.88em;}
  .sortWrap{width:100%;}
  .sortWrap select{flex:1;min-height:44px;}
  .subListHeader{margin:20px 2px 10px;font-size:1.05em;}

  /* ---- work order cards: bigger, clearer, obviously tappable ---- */
  .woRow{
    flex-direction:column;align-items:stretch;gap:10px;
    padding:16px 34px 16px 18px;margin-bottom:14px;
    font-size:1.02em;position:relative;
    border-left-width:6px;
  }
  .woRow::after{
    content:'\2039';display:inline-block;transform:rotate(180deg);
    position:absolute;right:14px;top:50%;margin-top:-14px;
    font-size:1.6em;color:var(--muted);opacity:.4;
  }
  .woRow .woName{font-size:1.2em;line-height:1.3;}
  .woRow .woSub{font-size:.95em;line-height:1.4;}
  .woRow .woMeta{flex-wrap:wrap;gap:12px;row-gap:12px;font-size:.92em;line-height:1.4;}
  .woRow .woLastNote{font-size:.92em;line-height:1.45;}
  .tag{padding:6px 13px;font-size:.88em;}
  .newWoBtn{padding:20px;font-size:1.05em;min-height:56px;}

  /* ---- modals: sticky head/footer so key actions are always reachable
     without hunting through a scrolling page ---- */
  .overlay{padding:0;align-items:stretch;}
  .modal{max-width:100% !important;width:100%;min-height:100vh;border-radius:0;display:flex;flex-direction:column;}
  .modalHead{
    padding:16px 18px;position:sticky;top:0;background:var(--paper);
    z-index:5;min-height:56px;flex-wrap:wrap;
  }
  .modalHead h2{font-size:1.2em;}
  .modalHeadCust{grid-template-columns:1fr;column-gap:0;}
  .modalHeadCust.editing{width:100%;}
  .modalHeadCust .mhAddr1,.modalHeadCust .mhAddr2{align-self:auto;}
  /* Reflow order for single-column mobile/tablet stacking: name, primary phone,
     alt phone, address line 1, address line 2, then email. The desktop 2-column
     grid relies on DOM order (name/addr1, phone/addr2, alt/email) to line up
     side-by-side, so we override with explicit order here instead of reordering
     the markup itself. */
  .modalHeadCust .mhName{order:1;}
  .modalHeadCust .mhPrimary{order:2;}
  .modalHeadCust .mhAlt{order:3;}
  .modalHeadCust .mhAddr1{order:4;}
  .modalHeadCust .mhAddr2{order:5;}
  .modalHeadCust .mhEmail{order:6;}
  .headerTabs button{padding:10px 12px;font-size:.78em;}
  .closeX{font-size:1.7em;min-width:44px;min-height:44px;}
  .modalBody{padding:16px;font-size:1em;flex:1;}
  .footerActions{
    padding:14px 16px;flex-wrap:wrap;position:sticky;bottom:0;
    background:var(--paper);border-top:1px solid var(--line);border-radius:0;
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0));
  }
  .footerActions .btn{flex:1 1 auto;min-width:120px;min-height:52px;}
  .woGrid{flex-direction:column;gap:16px;}
  .custPanel,.jobPanel{flex:1 1 100%;min-width:0;}
  .formGrid{grid-template-columns:1fr;gap:14px;}
  .field input,.field label{font-size:1em;}
  .field input{padding:13px 14px;min-height:48px;}

  /* ---- buttons everywhere: comfortable thumb-sized targets ---- */
  .btn{padding:15px 20px;min-height:52px;font-size:1.02em;}
  .btnRow{gap:16px;}
  .editLink,.adminViewLink{min-height:48px;display:inline-flex;align-items:center;font-size:.9em;margin-right:22px;padding:10px 6px;}

  /* ---- estimate / invoice split builder: stack vertically ---- */
  .splitWrap{flex-direction:column;height:auto;gap:14px;}
  .splitLeft{flex:none;max-height:46vh;padding-right:0;order:1;}
  .splitRight{flex:none;height:56vh;order:2;}

  /* ---- misc form rows ---- */
  .noteEntryTop{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .noteEntryTop select{min-height:48px;font-size:.9em;}
  .noteFieldGroup{flex:1 1 130px;min-width:130px;}
  .dateFieldWrap{width:100%;flex:none;}
  .dateFieldWrap input[type="text"]{min-height:48px;min-width:0;}
  .dateFieldWrap .calBtn{min-height:48px;min-width:44px;}
  .noteEntryRow textarea{min-height:48px;}
  .jcCheck{min-height:48px;padding:10px 16px;gap:12px;}
  .noteItem .noteActions{gap:20px;}
  .noteItem .noteActions button{min-height:40px;font-size:.88em;padding:8px 4px;white-space:nowrap;}
  .docRow{flex-direction:column;align-items:stretch;gap:12px;padding:16px;}
  .docActions{width:100%;gap:12px;}
  .docActions .btn{flex:1 1 auto;min-width:100px;min-height:48px;}
  .btnRow{flex-wrap:wrap;}
  .estDecisionRow{flex-direction:column;align-items:stretch;gap:12px;}
  .estDecisionRow .btn{width:100%;min-height:52px;}
}

@media (max-width:480px){
  header.top .brand img{width:26px;height:26px;}
  .userBadge span#whoami{display:none;}
  main{padding-left:10px;padding-right:10px;}
  .loginCard{padding:30px 22px;}
  .loginCard h1{font-size:1.5em;}
  .field input{font-size:16px;}
  .splitLeft{max-height:40vh;}
  .splitRight{height:50vh;}
  nav.tabs#tabsNav button{padding:10px 2px;}
  #toastStack{bottom:calc(96px + env(safe-area-inset-bottom,0px));}
}

/* Edit/remove controls on a scheduled date row. */
.schedRowBtns{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.tinyEdit{
  background:none;border:1.5px solid var(--line);color:var(--navy);
  font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:5px 10px;border-radius:6px;cursor:pointer;line-height:1;font-family:inherit;
  transition:all .15s;
}
.tinyEdit:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.schedLoggedTag{
  display:inline-block;margin-left:8px;padding:3px 8px;border-radius:20px;
  background:var(--green);color:var(--greenb);font-size:.64em;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;vertical-align:middle;
}
/* Deliberate double-booking, flagged in amber so it reads as "on purpose"
   rather than "mistake", it sits next to the logged-time tag on the row. */
.schedDblTag{
  display:inline-block;margin-left:8px;padding:3px 8px;border-radius:20px;
  background:var(--yellow);color:var(--yellowb);border:1px solid rgba(165,113,10,.35);font-size:.64em;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;vertical-align:middle;
}
html.hc .tinyEdit{border-color:#000;color:#000;}
html.hc .schedLoggedTag{background:#fff;color:#000;border:1px solid #000;}
html.hc .schedDblTag{background:#fff;color:#000;border:1px solid #000;}
/* Per-date hours tag (schedRowHTML) and the section-wide running total
   (scheduleDatesSectionHTML), both built from completed check-in/check-out
   pairs, so they only ever count time that's actually been logged. Set in the
   mono face so figures line up column-wise down a list of dates. */
.schedHoursTag{
  display:inline-block;margin-left:8px;padding:3px 8px;border-radius:20px;
  background:var(--blue);color:var(--blueb);font-size:.66em;font-weight:500;
  letter-spacing:.02em;vertical-align:middle;font-family:var(--f-data);
}
.schedHoursTotal{
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  font-size:.85em;color:var(--navy);font-weight:700;
}
.schedHoursTotal .small{font-weight:400;}
html.hc .schedHoursTag{background:#fff;color:#000;border:1px solid #000;}
html.hc .schedHoursTotal{border-top:1px solid #000;}
/* Tap-to-act contact details. The address opens the device's default maps app
   and the email opens a new message, same treatment as .telLink so all three
   actionable customer fields read alike. Address and email are secondary to
   the phone number, so they inherit the surrounding muted colour and only
   pick up the accent on hover, keeping the header calm. */
.mapLink,.mailLink{
  color:inherit;text-decoration:none;
  border-bottom:1px dotted rgba(232,121,26,.5);
  padding:2px 1px;margin:-2px -1px;border-radius:3px;
  transition:color .12s,background .12s,border-color .12s;
}
.mapLink:hover,.mailLink:hover{
  color:var(--orange);background:rgba(232,121,26,.09);border-bottom-color:var(--orange);
}
.mapLink:active,.mailLink:active{background:rgba(232,121,26,.18);}
html.hc .mapLink,html.hc .mailLink{border-bottom:2px solid var(--orange);font-weight:700;}
@media (max-width:900px){
  /* Bigger targets on the device where these actually get tapped. */
  .mapLink,.mailLink{display:inline-block;padding:6px 4px;margin:-6px -4px;}
}

/* The override prompt lists each clashing appointment on its own line, so the
   confirm dialog has to honour newlines instead of collapsing them. It's also
   widened and left-aligned, since a list reads badly centred. */
.confirmCard h3{white-space:pre-line;}
.confirmCard.wide{max-width:440px;}
.confirmCard.wide h3{text-align:left;font-size:1em;line-height:1.5;}

/* ---- Toast stack ----
   Toasts share one fixed container and stack upward, so two messages in
   quick succession are both readable instead of overlapping exactly. */
#toastStack{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;width:max-content;max-width:min(92vw,460px);
}
.toastItem{
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:var(--radius-sm);
  box-shadow:var(--sh-3);font-size:.88em;line-height:1.45;
  text-align:center;opacity:1;transform:translateY(0);
  border:1px solid rgba(255,255,255,.12);
  transition:opacity .2s ease,transform .2s ease;
  animation:toastIn .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
html.hc .toastItem{background:#000;border:2px solid #fff;}

/* ---- Visible keyboard focus ----
   Nothing in the app had a focus style, so tabbing through it was invisible.
   :focus-visible keeps mouse clicks clean while making keyboard use followable. */
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px;}
html.hc :focus-visible{outline:3px solid #000;}

/* Long customer names/addresses used to push the row layout wide instead of
   wrapping, squeezing the status tag off the edge on narrow screens. */
.woRow .woMain{min-width:0;overflow-wrap:anywhere;}
.woRow .woName,.woRow .woSub{overflow-wrap:anywhere;}
.docActions .btn{white-space:nowrap;}

/* Respect a reduced-motion preference: the pulsing follow-up badge and the
   glowing checked-in row are attention-getters, not information. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
/* ---- Data figures ----
   Times, counts and totals are set in the mono face with tabular figures so
   columns of numbers line up down a list instead of shifting per glyph. */
.dayLogRow .jcCheck,.schedRow .small,.woNoteDate,.subListHeader .count,
nav.tabs button .count,.schedHoursTag,.priceTag{font-variant-numeric:tabular-nums;}
.dayLogRow .jcCheck{font-family:var(--f-body);}
.schedHoursTotal{font-variant-numeric:tabular-nums;}

/* ---- Scroll surfaces ----
   The app scrolls a lot on desktop (note lists, day logs, the split builder),
   so the bars are toned to the palette rather than left as OS chrome. */
*{scrollbar-width:thin;scrollbar-color:#c3cddb transparent;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c3cddb;border-radius:8px;border:3px solid var(--paper);}
::-webkit-scrollbar-thumb:hover{background:#a9b6c8;}

::selection{background:rgba(232,121,26,.24);color:var(--ink);}

/* Text inside a status-tinted card sits on a pale wash rather than a solid
   colour now, so it keeps its normal weight, but the name still anchors. */
.woRow .woName{text-wrap:balance;}

/* =========================================================================
   MOTION LAYER
   Everything below is feel, not information. It is deliberately kept in one
   block at the end of the stylesheet so it overrides the flat transitions
   declared earlier without having to edit them one by one, and so the whole
   thing can be lifted out again in a single cut if it ever gets in the way.

   The rule the whole layer follows: motion tracks the user's finger and
   settles, it never plays a little movie at them. Presses respond within a
   frame or two (--t-press), surfaces arrive on the spring curve, and
   anything looping is a status signal rather than decoration.

   The prefers-reduced-motion block further up already neutralises every
   animation and transition globally with !important, so this whole layer is
   automatically switched off for anyone who has asked for that.
========================================================================= */

/* Smooth programmatic scrolling (anchor jumps, scrollIntoView on the tab
   bar) without touching the explicit behavior:'auto' calls in the script. */
html{scroll-behavior:smooth;}

/* ---- Universal press feedback ----
   Previously only phones got a tap response. A pointer press should feel the
   same on every device: the surface takes the press, then springs back. */
button,.btn,.woRow,.jcCheck,.docRow,.newWoBtn,.tag,.textSizeBtn,.hcToggleBtn,
.syncPill,.editLink,.copyIcon,.closeX,.schedTypeToggle button,.headerTabs button{
  transition:
    transform var(--t-press) var(--e-out),
    box-shadow var(--t-fast) var(--e-out),
    background var(--t-fast) var(--e-out),
    border-color var(--t-fast) var(--e-out),
    color var(--t-fast) var(--e-out),
    opacity var(--t-fast) var(--e-out);
  -webkit-tap-highlight-color:transparent;
}
button:active,.btn:active,.newWoBtn:active,.textSizeBtn:active,
.hcToggleBtn:active,.syncPill:active,.schedTypeToggle button:active,
.headerTabs button:active{transform:scale(.955);}
.jcCheck:active,.docRow:active{transform:scale(.975);}
.closeX:active,.copyIcon:active,.editLink:active{transform:scale(.88);}
/* Row press is gentler than a button's: it's a big surface, so the same
   scale factor would read as the whole list lurching. */
.woRow:active{transform:scale(.988);box-shadow:var(--sh-1);}
.woRow:hover{transform:translateY(-2px);box-shadow:var(--sh-2);}
/* A pressed row that is also hovered must not fight itself. */
.woRow:hover:active{transform:translateY(-1px) scale(.99);}

/* Checkboxes get a physical dip on press so tapping "Job Complete" or a
   check-in box confirms itself before the re-render lands. */
input[type="checkbox"]{transition:transform var(--t-press) var(--e-bounce);}
input[type="checkbox"]:active{transform:scale(.84);}

/* ---- Inputs ----
   Focus rings ease in rather than snapping, which is most of the difference
   between a form that feels native and one that feels like a web page. */
.field input,.field select,.field textarea,input,select,textarea{
  transition:border-color var(--t-fast) var(--e-out),
             box-shadow var(--t-fast) var(--e-out),
             background var(--t-fast) var(--e-out);
}

/* ---- Modals: iOS sheet presentation ----
   Card rises and scales up on the spring curve while the scrim blurs in
   behind it, then reverses on dismissal. closeModal() hands the outgoing
   node to #modalGhost so the exit can play while modalRoot is already free
   for whatever opens next. */
.overlay,.confirmBox{
  animation:scrimIn var(--t-med) var(--e-out) both;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.modal{animation:sheetIn var(--t-sheet) var(--e-spring) both;transform-origin:50% 0;}
.confirmCard{animation:cardIn var(--t-med) var(--e-spring) both;}
@keyframes scrimIn{
  from{opacity:0;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);}
  to{opacity:1;}
}
@keyframes sheetIn{
  from{opacity:0;transform:translateY(26px) scale(.965);}
  to{opacity:1;transform:none;}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.94);}
  to{opacity:1;transform:none;}
}
/* An open modal that re-renders itself in place must not replay its
   entrance. .noAnim is stamped on by the observer below whenever content is
   swapped into a modalRoot that was already showing something. */
.overlay.noAnim,.overlay.noAnim .modal{animation:none;}

/* Dismissal. Shorter than the entrance: getting out of the way should never
   feel like it is being performed at you. */
#modalGhost:empty{display:none;}
#modalGhost>*{pointer-events:none !important;z-index:98 !important;}
.overlay.closing,.confirmBox.closing{animation:scrimOut .2s var(--e-in) both;}
.overlay.closing .modal{animation:sheetOut .22s var(--e-in) both;}
.confirmBox.closing .confirmCard{animation:cardOut .18s var(--e-in) both;}
@keyframes scrimOut{from{opacity:1;}to{opacity:0;}}
@keyframes sheetOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(18px) scale(.975);}}
@keyframes cardOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(8px) scale(.95);}}
@media (max-width:900px){
  /* Full-height modals are sheets on a phone, so they come up from the
     bottom edge the way a native sheet does. */
  .modal{animation:sheetUpMobile var(--t-sheet) var(--e-spring) both;transform-origin:50% 100%;}
  .overlay.closing .modal{animation:sheetDownMobile .24s var(--e-in) both;}
  @keyframes sheetUpMobile{from{transform:translateY(100%);}to{transform:none;}}
  @keyframes sheetDownMobile{from{transform:none;}to{transform:translateY(100%);}}
}

/* ---- List entrance ----
   Rows cascade in when the board changes underneath you (a tab switch, a
   login), so the eye is led down the new list instead of having a wall of
   cards replaced in one frame. The stagger class is applied by renderMain()
   only on those transitions, never on the incidental re-render after a
   checkbox, which would otherwise make the list twitch on every tap.

   fill-mode is `backwards`, not `both`: `both` would pin the end-state
   transform permanently and kill the hover lift on every row. */
@keyframes rowIn{
  from{opacity:0;transform:translateY(16px) scale(.985);}
  to{opacity:1;transform:none;}
}
#mainArea.stagger .listHeader,
#mainArea.stagger .newWoBtn{animation:rowIn var(--t-med) var(--e-out) backwards;}
#mainArea.stagger .subListHeader,
#mainArea.stagger .emptyState{animation:rowIn .38s var(--e-out) backwards;}
#mainArea.stagger .woRow{
  animation:rowIn .44s var(--e-out) backwards;
  animation-delay:calc(var(--i,0) * 26ms);
}
/* A checked-in row still has to keep pulsing while it arrives, so it runs
   both animations rather than letting the entrance replace the status one. */
#mainArea.stagger .woRow.checkedInGlow{
  animation:rowIn .44s var(--e-out) backwards, checkedInPulse 2.2s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * 26ms), 0s;
}

/* ---- Tab bar ----
   Desktop gets a sliding underline that grows from the centre instead of a
   border colour flicking on; mobile gets the pill scaling in behind the
   active item. */
nav.tabs button{position:relative;transition:color var(--t-fast) var(--e-out),background var(--t-fast) var(--e-out);}
nav.tabs button.active{border-bottom-color:transparent;}
nav.tabs button::after{
  content:'';position:absolute;left:14px;right:14px;bottom:0;height:3px;
  background:var(--orange);border-radius:3px 3px 0 0;
  transform:scaleX(0);transform-origin:50% 50%;
  transition:transform var(--t-med) var(--e-spring);
}
nav.tabs button.active::after{transform:scaleX(1);}
nav.tabs button .count{transition:background var(--t-fast) var(--e-out),transform var(--t-fast) var(--e-bounce);}
/* Count badges bump when the number actually changes, so work moving between
   tabs is noticeable without a notification. */
.count.bump{animation:countBump .42s var(--e-bounce);}
@keyframes countBump{
  0%{transform:scale(1);}
  35%{transform:scale(1.32);}
  100%{transform:scale(1);}
}
@media (max-width:900px){
  nav.tabs#tabsNav button::after{display:none;}
  nav.tabs#tabsNav button{transition:color var(--t-fast) var(--e-out),background var(--t-med) var(--e-spring);}
  nav.tabs#tabsNav button:active{transform:scale(.93);}
  nav.tabs#tabsNav button.active{animation:tabPop .34s var(--e-bounce);}
  @keyframes tabPop{0%{transform:scale(.9);}60%{transform:scale(1.04);}100%{transform:scale(1);}}
}

/* ---- Settings menu ----
   Was display:none/block, which pops. Now it scales out of the gear it came
   from. visibility is transitioned with a delay so the hidden menu is still
   removed from the tab order once it has faded. */
.settingsMenu{
  display:block;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(-8px) scale(.96);transform-origin:top right;
  transition:opacity var(--t-fast) var(--e-out),
             transform var(--t-med) var(--e-spring),
             visibility 0s linear var(--t-med);
}
.settingsMenu.open{
  opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity var(--t-fast) var(--e-out),
             transform var(--t-med) var(--e-spring),
             visibility 0s;
}

/* ---- Toasts ----
   Spring up from the bottom edge, fall away on the way out. The script sets
   the exit transform inline, so the transition below is what carries it. */
.toastItem{
  animation:toastIn var(--t-med) var(--e-spring);
  transition:opacity var(--t-fast) var(--e-in),transform var(--t-fast) var(--e-in);
}
@keyframes toastIn{
  from{opacity:0;transform:translateY(20px) scale(.94);}
  to{opacity:1;transform:none;}
}

/* ---- Disclosure and small surfaces ---- */
.expandLinks details[open] > *:not(summary){animation:rowIn .28s var(--e-out) backwards;}
.addrSuggest{animation:rowIn .2s var(--e-out) backwards;}
.followupBadge,.woRow .tag{transition:transform var(--t-fast) var(--e-bounce);}

@media (max-width:900px){
  /* Touch wants a slightly deeper press than a mouse does, since there is no
     cursor or hover state to confirm the target was hit. */
  button:active,.btn:active,.newWoBtn:active{transform:scale(.965);}
  .woRow:active{transform:scale(.975);}
}
/* High contrast keeps its flat, glow-free checked-in row even mid-cascade. */
html.hc #mainArea.stagger .woRow.checkedInGlow{
  animation:rowIn .44s var(--e-out) backwards;
  animation-delay:calc(var(--i,0) * 26ms);
}

/* Composited hints. Only on the surfaces that actually move, since a
   blanket will-change costs memory on a long board. */
.modal,.confirmCard,.toastItem,.settingsMenu{will-change:transform,opacity;}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>

<!-- ============ LOGIN / SIGNUP ============ -->
<div id="loginScreen">
  <div class="loginCard">
    <img id="loginLogo" alt="Good & Handy" style="display:block;margin:0 auto 10px;width:120px;height:120px;object-fit:contain;">
    <div class="tag">Job Portal</div>
    <div style="text-align:center;margin-bottom:18px;">
      <button class="syncPill off" id="loginSyncPill" onclick="openSyncModal()" style="border-color:var(--navy);color:var(--navy);">Sync: Off</button>
      <div class="settingsWrap" style="display:inline-block;margin-left:6px;">
        <button class="settingsBtn" id="loginSettingsBtn" onclick="toggleSettingsMenu('loginSettingsMenu')" title="Accessibility settings" aria-label="Accessibility settings" aria-haspopup="true" aria-expanded="false" style="border-color:var(--navy);color:var(--navy);"><svg class="gearIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.50 4.96 L10.05 2.81 A9.40 9.40 0 0 1 13.95 2.81 L13.50 4.96 A7.20 7.20 0 0 1 15.92 5.96 L17.12 4.12 A9.40 9.40 0 0 1 19.88 6.88 L18.04 8.08 A7.20 7.20 0 0 1 19.04 10.50 L21.19 10.05 A9.40 9.40 0 0 1 21.19 13.95 L19.04 13.50 A7.20 7.20 0 0 1 18.04 15.92 L19.88 17.12 A9.40 9.40 0 0 1 17.12 19.88 L15.92 18.04 A7.20 7.20 0 0 1 13.50 19.04 L13.95 21.19 A9.40 9.40 0 0 1 10.05 21.19 L10.50 19.04 A7.20 7.20 0 0 1 8.08 18.04 L6.88 19.88 A9.40 9.40 0 0 1 4.12 17.12 L5.96 15.92 A7.20 7.20 0 0 1 4.96 13.50 L2.81 13.95 A9.40 9.40 0 0 1 2.81 10.05 L4.96 10.50 A7.20 7.20 0 0 1 5.96 8.08 L4.12 6.88 A9.40 9.40 0 0 1 6.88 4.12 L8.08 5.96 A7.20 7.20 0 0 1 10.50 4.96 Z"/><circle cx="12" cy="12" r="3.3"/></svg></button>
        <div class="settingsMenu" id="loginSettingsMenu">
          <div class="settingsRow">
            <span>Text Size</span>
            <button class="textSizeBtn" id="loginTextSizeBtn" onclick="cycleTextSize()" title="Adjust text size">Aa</button>
          </div>
          <div class="settingsRow">
            <span>High Contrast</span>
            <button class="hcToggleBtn" id="loginContrastBtn" onclick="toggleHighContrast()" title="Toggle high contrast" aria-pressed="false">
              <svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true">
                <circle cx="10" cy="10" r="8.5" fill="#fff" stroke="#000" stroke-width="1.4"/>
                <path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="#000"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="signInForm">
      <div class="field"><label>Username</label><input id="siUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('siPin').focus();}"></div>
      <div class="field"><label>4-Digit PIN</label><input id="siPin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" oninput="this.value=this.value.replace(/\D/g,'')" onkeydown="if(event.key==='Enter'){event.preventDefault();doSignIn();}"></div>
      <div class="errMsg" id="siErr"></div>
      <div class="btnRow"><button class="btn" style="flex:1" onclick="doSignIn()">Sign In</button></div>
      <div class="switchLine">New here? <a onclick="toggleForms(false)">Create a login</a></div>
    </div>

    <div id="signUpForm" class="hidden">
      <div class="formGrid">
        <div class="field"><label>First Name</label><input id="suFirst" autocomplete="given-name"></div>
        <div class="field"><label>Last Initial</label><input id="suLast" maxlength="1" autocapitalize="characters"></div>
      </div>
      <div class="field"><label>Create a 4-Digit PIN</label><input id="suPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" oninput="this.value=this.value.replace(/\D/g,'')"></div>
      <div class="field"><label>Confirm PIN</label><input id="suPin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" oninput="this.value=this.value.replace(/\D/g,'')" onkeydown="if(event.key==='Enter'){event.preventDefault();doSignUp();}"></div>
      <div class="small" id="suPreview" style="margin-bottom:8px;"></div>
      <div class="errMsg" id="suErr"></div>
      <div class="btnRow"><button class="btn" style="flex:1" onclick="doSignUp()">Create Login</button></div>
      <div class="switchLine">Already registered? <a onclick="toggleForms(true)">Sign in</a></div>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="appScreen" class="hidden">
  <header class="top">
    <div class="brand" style="display:flex;align-items:center;gap:10px;">
      <img id="headerLogo" alt="Good & Handy" style="width:34px;height:34px;object-fit:contain;">
    </div>
    <div class="userBadge">
      <span id="whoami"></span>

const DB_KEY='gh_portal_db_v1';
/* Single escaper used everywhere user-entered text is injected into innerHTML.
   Previously most render paths interpolated raw values, so a customer name,
   address, or note containing & < > " ' would corrupt the surrounding markup
   (and in the worst case inject arbitrary HTML). */
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* For values placed inside a JS string literal in an inline handler. */
function escAttrJs(str){ return esc(String(str==null?'':str)).replace(/\\/g,'&#92;'); }
const SYNC_CFG_KEY='gh_portal_sync_cfg';
let syncDb=null, syncStorage=null, syncStorageErr='', syncUnsub=null, applyingRemote=false, syncSaveTimer=null;
function loadDB(){
  let raw=localStorage.getItem(DB_KEY);
  if(raw) return JSON.parse(raw);
  const db={users:{}, workOrders:[], nextId:1};
  saveDB(db);
  return db;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); if(!applyingRemote) pushToCloud(); }
let DB = loadDB();
{
  const normalized = normalizeDB(DB);
  const purged = purgeOldHistory(DB);

}
let CURRENT_USER = null; // {username, displayName, isAdmin}
let ACTIVE_TAB='workorders';
const WO_SORT_KEY='gh_wo_sort';
let WO_SORT = localStorage.getItem(WO_SORT_KEY) || 'progression';
function setWoSort(val){
  WO_SORT = val;
  localStorage.setItem(WO_SORT_KEY, val);
  renderMain();
}
/* Progression order matches stage: bold red -> red -> bold yellow -> yellow
   -> bold green -> green -> bold blue -> blue (earliest to latest stage) */
const PROGRESSION_ORDER=['st-red-bold','st-red','st-yellow-bold','st-yellow','st-green-bold','st-green','st-blue-bold','st-blue','st-grey'];
function woFirstName(wo){
  const n=(wo.customer.name||'').trim();
  if(!n) return '';
  return n.split(/\s+/)[0];
}
function woLastName(wo){
  const n=(wo.customer.name||'').trim();
  if(!n) return '';
  const parts=n.split(/\s+/);
  return parts.length>1 ? parts[parts.length-1] : parts[0];
}
function sortWorkOrders(list){
  const arr=list.slice();
  switch(WO_SORT){
    case 'dateNew':
      arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      break;
    case 'dateOld':
      arr.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      break;
    case 'firstName':
      arr.sort((a,b)=>woFirstName(a).localeCompare(woFirstName(b), undefined, {sensitivity:'base'}));
      break;
    case 'lastName':
      arr.sort((a,b)=>woLastName(a).localeCompare(woLastName(b), undefined, {sensitivity:'base'}));
      break;
    case 'progression':
    default:
      arr.sort((a,b)=>{
        const pa=PROGRESSION_ORDER.indexOf(statusClass(a));
        const pb=PROGRESSION_ORDER.indexOf(statusClass(b));
        if(pa!==pb) return pa-pb;
        return (a.createdAt||0)-(b.createdAt||0);
      });
      break;
  }
  return arr;
}
function sortDropdownHTML(){
  const opts=[
    ['progression','Progression'],
    ['dateNew','Input date new'],
    ['dateOld','Input date old'],
    ['firstName','Alphabetical first name'],
    ['lastName','Alphabetical last name']
  ];
  return `<div class="sortWrap"><label for="woSortSelect">Sort by</label>
    <select id="woSortSelect" onchange="setWoSort(this.value)">
      ${opts.map(([val,label])=>`<option value="${val}" ${WO_SORT===val?'selected':''}>${label}</option>`).join('')}
    </select></div>`;
}
/* Follow-up Due filter: shows only work orders whose most recent note has
   a follow-up date that is today or in the past. Clicking one of these
   doesn't open the work order directly, it jumps to whichever NAV tab
   the job currently lives in (its place in the workflow). */
function followUpDueList(){
  return DB.workOrders.filter(inWorkOrdersList).filter(woIsFollowUpDue).sort((a,b)=>{
    const na=mostRecentNote(a), nb=mostRecentNote(b);
    const da=(na&&na.followUpDate)||'';
    const db=(nb&&nb.followUpDate)||'';
    return da.localeCompare(db);
  });
}
/* Determines which NAV tab a work order currently belongs to, based on
   the same stage logic used by statusClass()/statusTag(). */
function workOrderCurrentTab(wo){
  if(inJobHistoryList(wo)) return 'jobhistory';
  if(inSurveysList(wo)) return 'surveys';
  if(inBuildInvoiceList(wo)) return 'invoices';
  if(inInvoiceInProgressList(wo)) return 'inprogress';
  if(inScheduleJobList(wo)) return 'inprogress';
  if(inEstimatePendingApprovalList(wo)) return 'estimates';
  if(inBuildEstimateList(wo)) return 'estimates';
  if(inPresiteScheduledList(wo)) return 'presite';
  if(inPresiteIncompleteList(wo)) return 'presite';
  return 'workorders';
}
/* Navigates to the NAV tab where the work order currently sits in the
   workflow, then briefly highlights/scrolls to its row. */
function goToWorkOrderInWorkflow(id){
  const wo=getWO(id);
  if(!wo) return;
  switchTab(workOrderCurrentTab(wo));
  setTimeout(()=>{
    const el=document.querySelector('.woRow[data-wo-id="'+id+'"]');
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('jumpHighlight');
      setTimeout(()=>el.classList.remove('jumpHighlight'), 2200);
    }
  }, 60);
}

/* =========================================================================
   MULTI-DEVICE SYNC (Firebase Firestore)
   Enter your Firebase project's config once per device to keep every
   device's Work Orders, users, and notes in sync in real time.
========================================================================= */

function getSyncConfig(){
  try{ return JSON.parse(localStorage.getItem(SYNC_CFG_KEY)||'null'); }catch(e){ return null; }
}

function setSyncPill(state){ // 'on' | 'off' | 'connecting'
  const label='Sync: '+(state==='on'?'On':state==='connecting'?'Connecting…':'Off');
  ['syncPill','loginSyncPill'].forEach(id=>{
    const p=document.getElementById(id);
    if(!p) return;
    p.className='syncPill '+(state==='on'?'on':'off');
    if(id==='loginSyncPill' && state!=='on'){ p.style.borderColor='var(--navy)'; p.style.color='var(--navy)'; }
    else { p.style.borderColor=''; p.style.color=''; }
    p.textContent=label;
  });
}
function initSync(){
  const cfg=getSyncConfig();
  if(!cfg){ setSyncPill('off'); return; }
  try{
    setSyncPill('connecting');
    // firebase.storage() throws "No default bucket found" when the pasted
    // config has no storageBucket, a very easy line to leave out, and the
    // symptom (uploads unavailable while sync itself works fine) points
    // nowhere near the cause. Fill in Firebase's own default naming so the
    // common case just works; docsTabHTML reports the bucket actually in use
    // so a project on the newer .firebasestorage.app naming can be corrected.
    if(!cfg.storageBucket && cfg.projectId){
      cfg.storageBucket = cfg.projectId + '.appspot.com';
      cfg.__derivedBucket = true;
    }
    if(!firebase.apps.length){ firebase.initializeApp(cfg); }
    syncDb=firebase.firestore();
    try{
      syncStorage=firebase.storage();
      syncStorageErr='';
    }catch(e){
      syncStorage=null;
      syncStorageErr=(e && (e.message||e.code)) ? String(e.message||e.code) : 'Firebase Storage could not be initialised.';
      console.warn('Storage unavailable. Enable it in the Firebase console to allow doc uploads.', e);
    }
    const ref=syncDb.collection('gh_portal').doc('main');
    if(syncUnsub) syncUnsub();
    syncUnsub=ref.onSnapshot(snap=>{
      if(snap.exists){
        const remote=snap.data().db;
        if(remote){
          applyingRemote=true;
          try{ DB=JSON.parse(remote); }catch(err){ applyingRemote=false; console.error('Bad remote payload', err); return; }
          normalizeDB(DB);
          localStorage.setItem(DB_KEY, JSON.stringify(DB));
          applyingRemote=false;
          setSyncPill('on');
          if(CURRENT_USER){ renderTabCounts(); renderMain(); }
        }
      } else {
        // nothing in the cloud yet, seed it with whatever's on this device
        ref.set({db:JSON.stringify(DB), updatedAt:Date.now()});
        setSyncPill('on');
      }
    }, err=>{
      console.error('Sync error', err);
      setSyncPill('off');
      toast('Sync connection failed. Check your Firebase config.');
    });
  }catch(e){
    console.error(e);
    setSyncPill('off');
    toast('Could not connect sync. Check your Firebase config.');
  }
}
function pushToCloud(){
  if(!syncDb || applyingRemote) return;
  clearTimeout(syncSaveTimer);
  syncSaveTimer=setTimeout(()=>{
    syncDb.collection('gh_portal').doc('main').set({db:JSON.stringify(DB), updatedAt:Date.now()}).catch(e=>{
      console.error(e); toast('Could not sync latest change to the cloud.');
    });
  }, 250);
}
