/* Ensure work orders created before this feature set have the newer fields. */
function normalizeWO(wo){
  if(!wo.customer || typeof wo.customer!=='object') wo.customer={name:'',phone:'',altPhone:'',email:'',address:''};
  if(!wo.jobDetails || typeof wo.jobDetails!=='object') wo.jobDetails={description:'', labor:[], materials:[], tools:[], issues:[], disclaimers:[]};
  ['labor','materials','tools','issues','disclaimers'].forEach(k=>{ if(!Array.isArray(wo.jobDetails[k])) wo.jobDetails[k]=[]; });
  if(typeof wo.jobDetails.description!=='string') wo.jobDetails.description='';
  (wo.scheduleDates||[]).forEach(d=>{ if(d.overridden===undefined) d.overridden=false; });
  if(!Array.isArray(wo.notes)) wo.notes=[];
  if(!Array.isArray(wo.adminLog)) wo.adminLog=[];
  if(wo.presiteScheduled===undefined) wo.presiteScheduled=false;
  if(wo.estimateApproved===undefined) wo.estimateApproved=false;
  if(wo.estimateDeclined===undefined) wo.estimateDeclined=false;
  if(wo.jobScheduled===undefined) wo.jobScheduled=!!wo.invoiceApproved; // migrate from prior workflow version
  if(wo.jobComplete===undefined) wo.jobComplete=false;
  if(wo.movedToHistoryAt===undefined) wo.movedToHistoryAt=null;
  if(wo.checkIn===undefined) wo.checkIn=null;
  if(wo.checkOut===undefined) wo.checkOut=null;
  if(!Array.isArray(wo.docs)) wo.docs=[];
  wo.docs.forEach(d=>{ if(d.uploadedAt===undefined) d.uploadedAt=0; });
  if(!Array.isArray(wo.scheduleDates)) wo.scheduleDates=[];
  wo.scheduleDates.forEach(sd=>{
    // Older saved dates predate the repeat field. A prior version of this
    // field briefly used 'weekdays', which no longer exists as an option,
    // 'daily' is the closest fallback so no previously-booked day is lost.
    // Entries that were single-day already (start === end) are 'none'.
    if(!sd.repeat) sd.repeat = (sd.endDate && sd.endDate!==sd.startDate) ? 'daily' : 'none';
    if(sd.repeat==='weekdays') sd.repeat='daily';
    if(!Array.isArray(sd.dayLogs) || sd.dayLogs.length===0){
      sd.dayLogs=expandRepeatDates(sd.startDate, sd.endDate||sd.startDate, sd.repeat).map(date=>({date, checkIn:null, checkOut:null}));
    }
  });
  return wo;
}
function datesInRange(startIso, endIso){
  const out=[];
  if(!startIso) return out;
  let cur=new Date(startIso+'T00:00:00');
  const end=new Date((endIso||startIso)+'T00:00:00');
  while(cur<=end){
    out.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
/* Expands a start/repeat-until date range into just the days a job
   actually occurs on, per its repeat pattern, so a job's scheduled
   start/end TIME (not the whole 24 hours) is all that's ever booked on
   each of those days, and days outside the pattern are skipped entirely
   rather than being blocked off.
   'none'   -> a single occurrence, on startIso only.
   'daily'  -> every day from startIso through endIso.
   'weekly' -> the same day-of-week as startIso, every 7 days through endIso. */
function expandRepeatDates(startIso, endIso, repeat){
  if(!startIso) return [];
  if(repeat==='daily'){
    return datesInRange(startIso, endIso||startIso);
  }
  if(repeat==='weekly'){
    const out=[];
    let cur=new Date(startIso+'T00:00:00');
    const end=new Date((endIso||startIso)+'T00:00:00');
    while(cur<=end){
      out.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));
      cur.setDate(cur.getDate()+7);
    }
    return out;
  }
  return [startIso]; // 'none' (or unset), a single occurrence
}
/* Human-readable note describing how an entry repeats, shown next to its
   scheduled time so it's clear only that window is booked each occurrence. */
function repeatLabel(d){
  if(!d.repeat || d.repeat==='none') return '';
  return d.repeat==='weekly' ? ' (repeats weekly)' : ' (repeats daily)';
}
function normalizeDB(db){
  let changed=false;
  if(!db.users || typeof db.users!=='object'){ db.users={}; changed=true; }
  if(!Array.isArray(db.workOrders)){ db.workOrders=[]; changed=true; }
  if(typeof db.nextId!=='number'){ db.nextId=1; changed=true; }
  (db.workOrders||[]).forEach(normalizeWO);
  if(db.storageUsedBytes===undefined){
    // Back-fill from whatever's already on file (only counts files uploaded to Storage, i.e. have .url + .size)
    let total=0;
    (db.workOrders||[]).forEach(wo=>(wo.docs||[]).forEach(d=>{ if(d.url) total+=(d.size||0); }));
    db.storageUsedBytes=total;
    changed=true;
  }
  // Previously the return value was discarded and nothing was saved, so this
  // repair silently re-ran on every single load without ever sticking.
  if(fixLegacyUserDisplayNames(db)) changed=true;
  // nextId must always be ahead of every existing work order, otherwise a
  // restored/merged database can hand out an id that already exists.
  const maxId=(db.workOrders||[]).reduce((m,w)=>Math.max(m, w.id||0), 0);
  if(db.nextId<=maxId){ db.nextId=maxId+1; changed=true; }
  return changed;
}
/* Older records (created before usernames were shown everywhere) may still
   have a name stored as "Firstname L." instead of the "firstnamel" username
   format. This rewrites every such reference, notes, admin log entries,
   check-in/out stamps, document uploads, to the correct username, by
   matching the stored first name + last initial against DB.users. Runs
   automatically every time the app loads. */
function fixLegacyUserDisplayNames(db){
  const users=Object.values(db.users||{});
  if(!users.length) return;
  function resolve(str){
    if(!str || typeof str!=='string') return str;
    const m=str.trim().match(/^([A-Za-z][A-Za-z'-]*)\s+([A-Za-z])\.?$/);
    if(!m) return str;
    const [ , first, lastInit ] = m;
    const match=users.find(u=>u.firstName && u.lastInitial &&
      u.firstName.toLowerCase()===first.toLowerCase() &&
      u.lastInitial.toLowerCase()===lastInit.toLowerCase());
    return match ? match.username : str;
  }
  let changed=false;
  (db.workOrders||[]).forEach(wo=>{
    (wo.notes||[]).forEach(n=>{ const fixed=resolve(n.by); if(fixed!==n.by){ n.by=fixed; changed=true; } });
    (wo.adminLog||[]).forEach(l=>{ const fixed=resolve(l.by); if(fixed!==l.by){ l.by=fixed; changed=true; } });
    (wo.docs||[]).forEach(d=>{ const fixed=resolve(d.uploadedBy); if(fixed!==d.uploadedBy){ d.uploadedBy=fixed; changed=true; } });
    if(wo.checkIn){ const fixed=resolve(wo.checkIn.by); if(fixed!==wo.checkIn.by){ wo.checkIn.by=fixed; changed=true; } }
    if(wo.checkOut){ const fixed=resolve(wo.checkOut.by); if(fixed!==wo.checkOut.by){ wo.checkOut.by=fixed; changed=true; } }
    (wo.scheduleDates||[]).forEach(sd=>{
      (sd.dayLogs||[]).forEach(dl=>{
        if(dl.checkIn){ const fixed=resolve(dl.checkIn.by); if(fixed!==dl.checkIn.by){ dl.checkIn.by=fixed; changed=true; } }
        if(dl.checkOut){ const fixed=resolve(dl.checkOut.by); if(fixed!==dl.checkOut.by){ dl.checkOut.by=fixed; changed=true; } }
      });
    });
  });
  return changed;
}
/* Job History records purge automatically 2 years after they arrive. */
function purgeOldHistory(db){
  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-2);
  const cutoffMs=cutoff.getTime();
  const before=db.workOrders.length;
  db.workOrders=db.workOrders.filter(wo=>!(wo.movedToHistoryAt && wo.movedToHistoryAt<cutoffMs));
  return db.workOrders.length!==before;
}

/* ---- Flexible follow-up date entry ----
   Lets someone type a date in whatever style is natural to them,
   7-30-26, 07/30/2026, 7.30.26, etc., instead of forcing one exact
   format, while a calendar-icon button still opens a native date
   picker for anyone who'd rather tap than type. Both paths converge
   on the same ISO (YYYY-MM-DD) string the rest of the app already
   stores and compares follow-up dates with. */
function parseFlexibleDate(str){
  if(!str) return null;
  const m = str.trim().match(/^(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2}|\d{4})$/);
  if(!m) return null;
  const month = parseInt(m[1], 10);
  const day = parseInt(m[2], 10);
  let year = parseInt(m[3], 10);
  if(m[3].length === 2) year += 2000;
  if(month < 1 || month > 12 || day < 1 || day > 31) return null;
  const d = new Date(year, month - 1, day);
  // Catches rollovers like 02/30 -> March 2nd, which Date() would
  // otherwise silently "correct" instead of rejecting.
  if(d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
  return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}
function formatDateDisplay(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-');
  return m + '/' + d + '/' + y;
}
function clearDateInvalid(el){ el.classList.remove('dateInvalid'); }
function normalizeFollowUpDisplay(){
  const el=document.getElementById('noteFollowUp');
  if(!el || !el.value.trim()) return;
  const iso=parseFlexibleDate(el.value.trim());
  if(iso){
    el.value=formatDateDisplay(iso);
    el.classList.remove('dateInvalid');
    const nativeEl=document.getElementById('noteFollowUpNative');
    if(nativeEl) nativeEl.value=iso;
  } else {
    el.classList.add('dateInvalid');
  }
}
function syncNativeFromText(){
  // The real native date input sits invisibly on top of the calendar
  // icon, so the user's actual click lands on it directly (the most
  // reliable way to open a native date picker across browsers). Before
  // it opens, seed it with whatever valid date is already typed.
  const nativeEl=document.getElementById('noteFollowUpNative');
  const textEl=document.getElementById('noteFollowUp');
  if(!nativeEl || !textEl) return;
  const current = parseFlexibleDate(textEl.value.trim());
  nativeEl.value = current || '';
}

}

========================================================================= */
/* Set for exactly one render, by the things that genuinely replace the whole
   board (a tab switch, a login). renderMain() consumes and clears it. Without
   this gate the cascade would replay after every checkbox tap, since those
   re-render the full list too. */
var STAGGER_NEXT_RENDER=false;
function switchTab(tab){
  if(tab!==ACTIVE_TAB) STAGGER_NEXT_RENDER=true;
  ACTIVE_TAB=tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const activeBtn = document.querySelector('nav.tabs button[data-tab="'+tab+'"]');
  const label = document.getElementById('currentTabLabel');
  if(activeBtn && label){
    label.textContent = activeBtn.textContent.replace(/\s*\d+\s*$/,'').trim();
  }
  if(activeBtn && activeBtn.scrollIntoView){
    // Keep the tapped tab fully in view inside the scrollable bottom bar
    // (mobile) instead of leaving it clipped at an edge.
    activeBtn.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }
  closeTabsMenu();
  renderTabCounts();
  renderMain();
  window.scrollTo({top:0, behavior:'auto'});
}
function toggleTabsMenu(){
  const nav = document.getElementById('tabsNav');

}
function closeTabsMenu(){
  const nav = document.getElementById('tabsNav');
  if(nav) nav.classList.remove('open');
}
/* Declared with var, not let: renderTabCounts() runs during session restore
   near the top of this script, long before execution reaches this line. A
   function declaration is hoisted and callable early, but a `let` binding is
   not, it sits in the temporal dead zone until its line executes, so touching
   it from that early call threw and aborted every render. `var` hoists with
   the function, so the early call reads 0 and behaves correctly. */
var LAST_HISTORY_PURGE=0;
function renderTabCounts(){
  // This used to purge + saveDB() (and therefore push to Firestore) on every
  // single re-render, several writes per tab switch. Once an hour is plenty
  // for a 6-month retention window.
  if(Date.now()-LAST_HISTORY_PURGE > 3600000){
    LAST_HISTORY_PURGE=Date.now();
    if(purgeOldHistory(DB)) saveDB(DB);
  }
  setCount('cnt-workorders', DB.workOrders.filter(inWorkOrdersList).length);
  setCount('cnt-presite', DB.workOrders.filter(inPresiteList).length);
  setCount('cnt-estimates', DB.workOrders.filter(wo=>inEstimatesList(wo) && !inScheduleJobList(wo)).length);
  setCount('cnt-inprogress', DB.workOrders.filter(wo=>inScheduleJobList(wo) || inInvoiceInProgressList(wo)).length);
  setCount('cnt-invoices', DB.workOrders.filter(wo=>inInvoicesList(wo) && !inInvoiceInProgressList(wo)).length);
  setCount('cnt-surveys', DB.workOrders.filter(inSurveysList).length);
}
/* Writes a tab count and bumps the badge only when the number actually moved,
   so a job arriving in Estimates announces itself while a routine re-render
   stays still. The first paint is silent: the badge starts empty, and every
   count changing at once on load would be noise, not signal. */
function setCount(id, n){
  const el=document.getElementById(id);
  if(!el) return;
  const prev=el.textContent;
  const next=String(n);
  if(prev===next) return;
  el.textContent=next;
  if(prev==='' || reducedMotion()) return;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'), 460);
}
function subGroupHTML(label, list, opts){
  opts=opts||{};
  let inner;
  if(list.length===0){
    inner=`<div class="emptyState" style="margin:0 0 18px;">${opts.emptyText||'Nothing here right now.'}</div>`;
  } else {
    inner='<div>'+list.map(wo=>rowHTML(wo, opts)).join('')+'</div>';
  }
  return `<h3 class="subListHeader">${label} <span class="count">${list.length}</span></h3>${inner}`;
}

/* Runs the entrance cascade on a freshly rendered board. Each row carries its
   own index as --i, which the stylesheet turns into a delay; the index is
   capped so a hundred-row history doesn't end with rows arriving three
   seconds late. The class is removed once the longest delay has elapsed so it
   is never left sitting on the element for the next render to inherit. */
var LIST_MOTION_TIMER=null;
function applyListMotion(main){
  if(!STAGGER_NEXT_RENDER) return;
  STAGGER_NEXT_RENDER=false;
  if(reducedMotion()) return;
  const rows=main.querySelectorAll('.woRow');
  rows.forEach((el,i)=>el.style.setProperty('--i', Math.min(i,12)));
  main.classList.remove('stagger');
  void main.offsetWidth;            // restart the animations on a re-render
  main.classList.add('stagger');
  clearTimeout(LIST_MOTION_TIMER);
  LIST_MOTION_TIMER=setTimeout(()=>main.classList.remove('stagger'), 900);
}
function mostRecentNote(wo){
  return (wo.notes && wo.notes.length) ? wo.notes[0] : null;
}
function woIsFollowUpDue(wo){
  const n=mostRecentNote(wo);
  return !!(n && n.followUpDate && isFollowUpDue(n.followUpDate));
}
function rowHTML(wo, opts){
  opts=opts||{};
  const cls=statusClass(wo);
  const todayLog = todaysDayLog(wo);
  const anyOpenCheckIn = allDayLogsSorted(wo).some(({log})=>log.checkIn && !log.checkOut);
  const glowCls = anyOpenCheckIn ? ' checkedInGlow' : '';
  const openFn = opts.followUpNav ? `goToWorkOrderInWorkflow(${wo.id})`
    : (opts.openMode==='estimate') ? `openEstimateSplit(${wo.id})`
    : (opts.openMode==='invoice') ? `openInvoiceSplit(${wo.id})`
    : `openWorkOrder(${wo.id})`;
  const n=mostRecentNote(wo);
  const lastNoteHTML = n
    ? `<div class="woLastNote"><b>${esc(n.type)}:</b> ${esc((n.text||'').slice(0,90))}${(n.text||'').length>90?'…':''} <span class="woNoteDate">(${esc(n.date)})</span></div>`
    : '';
  const followUpBadge = (n && n.followUpDate)
    ? `<span class="followupBadge ${isFollowUpDue(n.followUpDate)?'due':''}">${isFollowUpDue(n.followUpDate)?'Follow-up due':'Follow-up'} ${formatFollowUp(n.followUpDate)}</span>`
    : '';
  const jobCompleteCheckbox = opts.showJobComplete
    ? `<label class="jcCheck" onclick="event.stopPropagation()">
         <input type="checkbox" ${wo.jobComplete?'checked':''} onchange="confirmJobComplete(${wo.id}, this)"> Job Complete
       </label>`
    : '';
  const estimateDecisionRow = opts.showEstimateDecision
    ? `<div class="estDecisionRow" onclick="event.stopPropagation()">
         <label class="jcCheck"><input type="checkbox" onchange="approveEstimate(${wo.id}, this)"> Approved</label>
         <label class="jcCheck"><input type="checkbox" onchange="modifyEstimate(${wo.id}, this)"> Modified</label>
         <label class="jcCheck"><input type="checkbox" onchange="declineEstimate(${wo.id}, this)"> Declined</label>
       </div>`
    : '';
  const checkInOutRow = (opts.showCheckInOut && todayLog)
    ? `<div class="checkInOutRow" onclick="event.stopPropagation()">
         <label class="jcCheck"><input type="checkbox" ${todayLog.log.checkIn?'checked disabled':''} onchange="checkInDay(${wo.id}, '${todayLog.log.date}', this)"> In${todayLog.log.checkIn?` (${todayLog.log.checkIn.time})`:''}</label>
         <label class="jcCheck"><input type="checkbox" ${!todayLog.log.checkIn||todayLog.log.checkOut?'disabled':''} ${todayLog.log.checkOut?'checked':''} onchange="checkOutDay(${wo.id}, '${todayLog.log.date}', this)"> Out${todayLog.log.checkOut?` (${todayLog.log.checkOut.time})`:''}</label>
       </div>`
    : (opts.showCheckInOut ? '<div class="small" onclick="event.stopPropagation()">No visit scheduled today. See Job Details for other days.</div>' : '');
  return `<div class="woRow ${cls}${glowCls}" data-wo-id="${wo.id}" onclick="${openFn}">
    <div class="woMain">
      <div class="woName">${esc(wo.customer.name) || '(No name yet)'}</div>
      <div class="woSub">${wo.jobDetails.description ? esc(wo.jobDetails.description.slice(0,80)) : 'No job description yet'}</div>
      ${lastNoteHTML}
      ${estimateDecisionRow}
      ${checkInOutRow}
    </div>
    <div class="woMeta">
      ${statusTag(wo)}
      ${followUpBadge}
      ${jobCompleteCheckbox}
      <span>${esc(wo.customer.address)}</span>
    </div>
  </div>`;
}

  const wo=getWO(id);
  if(!wo || wo.jobComplete){ return; }
  checkboxEl.checked=false; // don't visually check until confirmed

/* =========================================================================
   PER-DAY CHECK IN / CHECK OUT
   Every individual day a work order is scheduled for (each date produced by
   the Schedule Date(s) feature) gets its own independent check-in and
   check-out stamp, stored on that day's entry in scheduleDates[].dayLogs.
========================================================================= */
function findDayLog(wo, date){
  for(const entry of (wo.scheduleDates||[])){
    const log=(entry.dayLogs||[]).find(l=>l.date===date);
    if(log) return {entry, log};
  }
  return null;
}
function allDayLogsSorted(wo){
  const out=[];
  (wo.scheduleDates||[]).forEach(entry=>{
    (entry.dayLogs||[]).forEach(log=>out.push({entry, log}));
  });
  out.sort((a,b)=>a.log.date.localeCompare(b.log.date));
  return out;
}
/* Parses a "h:mm AM/PM" clock string, the format nowStamp() produces for
   check-in/check-out stamps, into minutes since midnight. Returns null for
   anything that doesn't look like a time (so a hand-edited/blank value never
   gets silently treated as midnight). */
function parseClockTime(str){
  if(!str) return null;
  const m=String(str).match(/(\d{1,2}):(\d{2})\s*([AP]M)/i);
  if(!m) return null;
  let h=parseInt(m[1],10)%12;
  if(/PM/i.test(m[3])) h+=12;
  return h*60+parseInt(m[2],10);
}
/* Hours worked for one day's log, null unless it has BOTH a check-in and a
   check-out, so a day that's only half-logged never counts toward a total.
   A check-out clock time earlier than check-in is treated as crossing
   midnight (added shift) rather than negative hours. */
function dayLogHours(log){
  if(!log || !log.checkIn || !log.checkOut) return null;
  const inMin=parseClockTime(log.checkIn.time), outMin=parseClockTime(log.checkOut.time);
  if(inMin==null || outMin==null) return null;
  let diff=outMin-inMin;
  if(diff<0) diff+=24*60;
  return diff/60;
}
/* Formats fractional hours as "Xh Ym" for display, dropping whichever unit
   is zero so a whole-hour day reads "8h" instead of "8h 0m". */
function formatHoursMinutes(hours){
  const totalMin=Math.round(hours*60);
  const h=Math.floor(totalMin/60), m=totalMin%60;
  if(h && m) return `${h}h ${m}m`;
  if(h) return `${h}h`;
  return `${m}m`;
}
/* Sums every completed (checked in AND out) day log in a list into a running
   total: total hours worked plus how many days contributed to it. Grows on
   its own as more days get checked in/out, nothing to recompute by hand. */
function sumDayLogHours(logs){
  let total=0, count=0;
  (logs||[]).forEach(log=>{
    const h=dayLogHours(log);
    if(h!=null){ total+=h; count++; }
  });
  return {total, count};
}
function todaysDayLog(wo){
  return findDayLog(wo, isoToday());
}
function checkInDay(woId, date, checkboxEl){
  const wo=getWO(woId);
  if(!wo) return;
  const found=findDayLog(wo, date);
  if(!found || found.log.checkIn){ return; }
  if(checkboxEl) checkboxEl.checked=false; // don't visually check until confirmed
  askYesNo('Confirm you are checking in on site for '+date+'?', (yes)=>{
    if(yes){
      const ts=nowStamp();
      found.log.checkIn={date:ts.date, time:ts.time, by:CURRENT_USER.displayName};
      addAdminLog(wo, 'Checked in on site for '+date+' at '+ts.time+' on '+ts.date+'.');
      saveDB(DB);
      renderTabCounts();
      renderMain();
      if(document.getElementById('modalRoot').innerHTML) renderWorkOrderModal(woId);
      toast('Checked in. Time logged for '+date+'.');
    }
  });
}
function checkOutDay(woId, date, checkboxEl){
  const wo=getWO(woId);
  if(!wo) return;
  const found=findDayLog(wo, date);
  if(!found || !found.log.checkIn || found.log.checkOut){ return; }
  if(checkboxEl) checkboxEl.checked=false;
  askYesNo('Confirm you are checking out, leaving the job site for '+date+'?', (yes)=>{
    if(yes){
      const ts=nowStamp();
      found.log.checkOut={date:ts.date, time:ts.time, by:CURRENT_USER.displayName};
      addAdminLog(wo, 'Checked out from site for '+date+' at '+ts.time+' on '+ts.date+'.');
      saveDB(DB);
      renderTabCounts();
      renderMain();
      if(document.getElementById('modalRoot').innerHTML) renderWorkOrderModal(woId);
      toast('Checked out. Time logged for '+date+'.');
    }
  });
}

function dayLogsSectionHTML(wo){
  const rows=allDayLogsSorted(wo);
  const isAdmin = !!(CURRENT_USER && CURRENT_USER.isAdmin);
  if(!rows.length) return '<div class="small">No scheduled days yet. Use Schedule Date(s) to add visit dates.</div>';
  return `<div class="dayLogsList">` + rows.map(({log})=>{
    const inDone = !!log.checkIn;
    const outDone = !!log.checkOut;
    const hrs = dayLogHours(log);
    const hrsNote = hrs!=null ? `<span class="schedHoursTag" title="Hours for ${formatDateDisplay(log.date)}">${formatHoursMinutes(hrs)}</span>` : '';
    return `<div class="dayLogRow">
      <div class="dayLogDate">${formatDateDisplay(log.date)}</div>
      <label class="jcCheck"><input type="checkbox" ${inDone?'checked disabled':''} onchange="checkInDay(${wo.id}, '${log.date}', this)"> In${inDone?` (${log.checkIn.time})`:''}</label>
      ${(isAdmin && inDone) ? `<button class="editLink" onclick="editCheckInDayTime(${wo.id}, '${log.date}')">Edit</button>` : ''}
      <label class="jcCheck"><input type="checkbox" ${!inDone||outDone?'disabled':''} ${outDone?'checked':''} onchange="checkOutDay(${wo.id}, '${log.date}', this)"> Out${outDone?` (${log.checkOut.time})`:''}</label>
      ${(isAdmin && outDone) ? `<button class="editLink" onclick="editCheckOutDayTime(${wo.id}, '${log.date}')">Edit</button>` : ''}
      ${hrsNote}
    </div>`;
  }).join('') + `</div>`;
}
function approveEstimate(id, checkboxEl){
  if(checkboxEl) checkboxEl.checked=false; // one-time trigger, not a persisted state
  askYesNo('Confirm this estimate is approved? It will move to Schedule Job.', (yes)=>{
    if(yes){
      const wo=getWO(id);

/* =========================================================================
   SCHEDULE DATE(S) + APPLE CALENDAR (.ics) INTEGRATION
========================================================================= */
let SCHED_WO_ID=null, SCHED_CAL_MONTH=null, SCHED_TYPE='full', SCHED_START=null, SCHED_END=null, SCHED_PENDING=[];
/* Start/end times are now held in state too. The time inputs used to be
   re-emitted with a hard-coded value="", so switching Pre-Site/Whole Job or
   adding a second date silently erased whatever times had been typed. */
let SCHED_STIME='', SCHED_ETIME='';
/* How a scheduled date repeats. 'none' is a single occurrence on the start
   date; 'daily' repeats the same start/end time every day through the
   Repeat Until date; 'weekly' repeats on the same day of the week through
   Repeat Until. Either way, only the scheduled time window is booked on
   each occurrence day, never the full 24 hours. */
let SCHED_REPEAT='none';
/* When set, the schedule widget is editing that existing saved date instead of
   building a list of new ones. */
let SCHED_EDIT_ID=null;
function captureSchedFields(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:null; };
  const sd=g('schedStartDate'), st=g('schedStartTime'), ed=g('schedEndDate'), et=g('schedEndTime'), rp=g('schedRepeat');
  if(sd!==null) SCHED_START=sd||null;
  if(ed!==null) SCHED_END=ed||null;
  if(st!==null) SCHED_STIME=st||'';
  if(et!==null) SCHED_ETIME=et||'';
  if(rp!==null) SCHED_REPEAT=rp||'none';
}
let SCHED_LONGPRESS_TIMER=null, SCHED_LONGPRESS_FIRED=false;

/* Picks a maps link based on the device: Apple Maps for iPhone/iPad/Mac
   (maps.apple.com hands off to the Maps app there), Google Maps for
   everything else (its own app on Android via the same https:// link, or
   Google Maps in the browser anywhere the app isn't installed). */
function directionsUrl(address){
  const encoded = encodeURIComponent(address || '');
  const ua = navigator.userAgent || navigator.vendor || window.opera || '';
  const isApple = /iPad|iPhone|iPod|Macintosh/.test(ua);
  return isApple
    ? `https://maps.apple.com/?daddr=${encoded}`
    : `https://www.google.com/maps/dir/?api=1&destination=${encoded}`;
}
function scheduleDatesSectionHTML(wo, id){
  const all=(wo.scheduleDates||[]).slice().sort((a,b)=>(a.startDate+a.startTime).localeCompare(b.startDate+b.startTime));
  const presite=all.filter(d=>d.type==='presite');
  const full=all.filter(d=>d.type==='full');
  // Running total across every scheduled date's day logs, grows on its own
  // as each day gets checked in and out, right under the date list itself.
  const {total:grandHours, count:grandDays}=sumDayLogHours(all.flatMap(d=>d.dayLogs||[]));
  const totalHTML = grandDays
    ? `<div class="schedHoursTotal">Hours logged: ${formatHoursMinutes(grandHours)} <span class="small">(from ${grandDays} checked-in/out day${grandDays>1?'s':''})</span></div>`
    : '';
  return `
    <div class="schedSection">
      <div class="panelTitle" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Schedule Date(s)</span>
        <button class="editLink" onclick="openScheduleWidget(${id})">+ Add</button>
      </div>
      ${(!presite.length && !full.length) ? '<div class="small">No dates scheduled yet.</div>' : ''}
      ${presite.length ? `<div class="schedSubHeader">Pre-Site Inspection</div>${presite.map(d=>schedRowHTML(id,d)).join('')}` : ''}
      ${full.length ? `<div class="schedSubHeader">Whole Job</div>${full.map(d=>schedRowHTML(id,d)).join('')}` : ''}
      ${totalHTML}
    </div>`;
}
function schedRowHTML(woId, d){
  const range = d.multiDay ? `${formatDateDisplay(d.startDate)} – ${formatDateDisplay(d.endDate)}` : formatDateDisplay(d.startDate);
  // Days that already have a check-in are called out, so it's obvious before
  // editing that changing the dates could affect logged time.
  const logged=(d.dayLogs||[]).filter(l=>l.checkIn).length;
  const loggedNote = logged ? `<span class="schedLoggedTag" title="This date has logged time">${logged} day${logged>1?'s':''} logged</span>` : '';
  // Running total of hours actually worked on this date range, built from
  // whichever of its days already have both a check-in and a check-out.
  const {total:hoursTotal, count:hoursCount}=sumDayLogHours(d.dayLogs||[]);
  const hoursNote = hoursCount ? `<span class="schedHoursTag" title="Hours logged from check-in/check-out times">${formatHoursMinutes(hoursTotal)}</span>` : '';
  // An intentional double-booking is flagged so it never looks like an oversight.
  const dblNote = d.overridden ? `<span class="schedDblTag" title="Double-booked over another appointment">double-booked</span>` : '';
  return `<div class="schedRow">
    <div><b>${range}</b>${loggedNote}${hoursNote}${dblNote}<br><span class="small">${formatArrivalWindow(d.startTime)}${repeatLabel(d)}</span></div>
    <div class="schedRowBtns">
      <button class="tinyEdit" title="Edit this date" aria-label="Edit this scheduled date" onclick="openScheduleEdit(${woId},'${d.id}')">Edit</button>
      <button class="tinyDel" title="Remove" aria-label="Remove this scheduled date" onclick="deleteScheduleDate(${woId},'${d.id}')">&times;</button>
    </div>
  </div>`;
}

/* ---- Editing an existing scheduled date ----
   Reuses the same calendar/form as adding, switched into a single-entry mode
   by SCHED_EDIT_ID rather than the pending-list mode used for new dates. */
function openScheduleEdit(woId, dateId){
  const wo=getWO(woId);
  const d=wo && (wo.scheduleDates||[]).find(x=>x.id===dateId);
  if(!d){ toast('That scheduled date no longer exists.'); return; }
  SCHED_WO_ID=woId;
  SCHED_EDIT_ID=dateId;
  SCHED_PENDING=[];
  SCHED_TYPE=d.type||'full';
  SCHED_START=d.startDate;
  SCHED_END=d.endDate||d.startDate;
  SCHED_STIME=d.startTime||'';
  SCHED_ETIME=d.endTime||'';
  SCHED_REPEAT=d.repeat||'none';
  const anchor=new Date(d.startDate+'T00:00:00');
  SCHED_CAL_MONTH=new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  renderScheduleWidget();
}

/* Rebuilds the per-day check in/out list for a new date range, carrying over
   any stamps for days that are still in range. Days dropped from the range
   lose their stamps, which is why saveScheduleEdit() confirms first. */
function remapDayLogs(existing, startDate, endDate, repeat){
  const old={};
  (existing||[]).forEach(l=>{ old[l.date]=l; });
  return expandRepeatDates(startDate, endDate||startDate, repeat).map(date=>
    old[date] ? {date, checkIn:old[date].checkIn||null, checkOut:old[date].checkOut||null}
              : {date, checkIn:null, checkOut:null}
  );
}

function saveScheduleEdit(){
  captureSchedFields();
  const wo=getWO(SCHED_WO_ID);
  const d=wo && (wo.scheduleDates||[]).find(x=>x.id===SCHED_EDIT_ID);
  if(!d){ toast('That scheduled date no longer exists.'); return; }

  const startDate=(document.getElementById('schedStartDate')||{}).value || SCHED_START;
  const startTime=(document.getElementById('schedStartTime')||{}).value || SCHED_STIME;
  const endTime=(document.getElementById('schedEndTime')||{}).value || SCHED_ETIME;
  const repeat=((document.getElementById('schedRepeat')||{}).value || SCHED_REPEAT || 'none');
  let endDate;
  if(repeat==='none'){
    endDate=startDate;
  } else {
    endDate=(document.getElementById('schedEndDate')||{}).value || SCHED_END;
    if(!endDate){ toast('Pick a date to end the repeat.'); return; }
  }

  if(!startDate || !startTime || !endTime){ toast('Start date, start time, and end time are all required.'); return; }
  if(endDate<startDate){ toast('The repeat must end on or after the start date.'); return; }
  if(endTime<=startTime){ toast('End time must be after the start time.'); return; }
  const unchanged = d.startDate===startDate && d.startTime===startTime &&
                    (d.endDate||d.startDate)===endDate && d.endTime===endTime && d.type===SCHED_TYPE &&
                    (d.repeat||'none')===repeat;
  if(unchanged){ SCHED_EDIT_ID=null; renderWorkOrderModal(SCHED_WO_ID); return; }

  withConflictOverride(startDate, startTime, endDate, endTime, SCHED_EDIT_ID, (overridden)=>{
    // Warn before silently discarding logged time on days leaving the range
    // (or, for a weekly repeat, days that are no longer in the pattern).
    const kept=expandRepeatDates(startDate, endDate, repeat);
    const losing=(d.dayLogs||[]).filter(l=>l.checkIn && kept.indexOf(l.date)===-1);
    const commit=()=>applyScheduleEdit(d, startDate, startTime, endDate, endTime, repeat, overridden);
    if(losing.length){
      askYesNo(`This removes ${losing.length} day${losing.length>1?'s':''} that already ${losing.length>1?'have':'has'} logged time (${losing.map(l=>formatDateDisplay(l.date)).join(', ')}). That time log will be deleted. Continue?`,
        (yes)=>{ if(yes) commit(); });
    } else {
      commit();
    }
  }, repeat);
}

function applyScheduleEdit(d, startDate, startTime, endDate, endTime, repeat, overridden){
  const wo=getWO(SCHED_WO_ID);
  const before=`${formatDateDisplay(d.startDate)}${d.multiDay?' – '+formatDateDisplay(d.endDate):''} @ ${formatTime12(d.startTime)}-${formatTime12(d.endTime)}`;
  d.type=SCHED_TYPE;
  d.startDate=startDate;
  d.startTime=startTime;
  d.endDate=endDate;
  d.endTime=endTime;
  d.multiDay=endDate!==startDate;
  d.repeat=repeat||'daily';
  d.overridden=!!overridden;
  d.dayLogs=remapDayLogs(d.dayLogs, startDate, endDate, d.repeat);
  const after=`${formatDateDisplay(startDate)}${d.multiDay?' – '+formatDateDisplay(endDate):''} @ ${formatTime12(startTime)}-${formatTime12(endTime)}`;
  addAdminLog(wo, `Changed a scheduled date from ${before} to ${after}.${overridden?' Double-booked over an existing appointment (override).':''}`);
  saveDB(DB);
  const woId=SCHED_WO_ID, editedId=d.id;
  SCHED_EDIT_ID=null;
  renderWorkOrderModal(woId);
  renderMain();
  // The .ics already sent to a calendar can't be edited in place, so offer a
  // corrected one rather than leaving the calendar silently out of date.
  askYesNo('Schedule updated. Download an updated calendar (.ics) file for this date?', (yes)=>{
    if(yes){
      const w=getWO(woId);
      const entry=w && (w.scheduleDates||[]).find(x=>x.id===editedId);
      if(entry){
        downloadICS(w, [entry]);
        toast('Updated .ics downloaded. Opening it will update the existing calendar entry.');
      }
    } else {
      toast('Schedule updated.');
    }
  });
}
function deleteScheduleDate(woId, dateId){
  const wo=getWO(woId);
  if(!wo) return;
  askYesNo('Remove this scheduled date? This does not remove it from any calendar it was already added to.', (yes)=>{
    if(yes){
      wo.scheduleDates=(wo.scheduleDates||[]).filter(d=>d.id!==dateId);
      saveDB(DB);
      renderWorkOrderModal(woId);
    }
  });
}

/* Converts a 24hr "HH:MM" start time into a 1-hour arrival window string,
   e.g. "10:00" -> "10-11AM". */
function formatArrivalWindow(hhmm){
  if(!hhmm) return '';
  const [h,m]=hhmm.split(':').map(Number);
  const start=new Date(2000,0,1,h,m);
  const end=new Date(2000,0,1,h+1,m);
  const startHr = start.getHours()%12===0 ? 12 : start.getHours()%12;
  const endHr = end.getHours()%12===0 ? 12 : end.getHours()%12;
  const startAmPm = start.getHours()<12 ? 'AM' : 'PM';
  const endAmPm = end.getHours()<12 ? 'AM' : 'PM';
  // An 11:00 PM start rolls the end hour past midnight, which used to render
  // as a nonsensical "11-12PM", show both meridiems when they differ.
  return startAmPm===endAmPm
    ? `${startHr}-${endHr}${startAmPm} Arrival`
    : `${startHr}${startAmPm}-${endHr}${endAmPm} Arrival`;
}
function formatTime12(hhmm){
  if(!hhmm) return '';
  const [h,m]=hhmm.split(':').map(Number);
  const d=new Date(2000,0,1,h,m);
  return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
function isoToday(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Earliest date the widget will allow. Today for new dates; for an edit, the
   earlier of today and the date's existing start, so a past booking can still
   be corrected. */
function minSchedDate(){
  if(!SCHED_EDIT_ID) return isoToday();
  const wo=getWO(SCHED_WO_ID);
  const d=wo && (wo.scheduleDates||[]).find(x=>x.id===SCHED_EDIT_ID);
  return (d && d.startDate < isoToday()) ? d.startDate : isoToday();
}

function setSchedType(t){ captureSchedFields(); SCHED_TYPE=t; renderScheduleWidget(); }
/* Switching the repeat option changes which fields are shown (Repeat Until
   only appears once a repeat is chosen), so this re-renders the whole
   widget rather than just the calendar column. */
function onSchedRepeatChange(val){
  captureSchedFields();

  renderScheduleWidget();

/* Collects every scheduled date (across all work orders), keyed by ISO date,
   with the job details needed for the hover/tap info popup and for
   start/end-time overlap checks. */
function buildJobDaysMap(excludeDateId){
  const map={};
  (DB.workOrders||[]).forEach(w=>{
    (w.scheduleDates||[]).forEach(d=>{
      // When editing an existing date, that date must not be treated as a
      // conflict with itself, otherwise nudging the time by five minutes
      // would always report a double-booking.
      if(excludeDateId && d.id===excludeDateId) return;
      const info={
        customer: (w.customer && w.customer.name) ? w.customer.name : 'Unnamed customer',
        type: d.type==='presite' ? 'Pre-Site' : 'Whole Job',
        startTime: d.startTime, endTime: d.endTime
      };
      // Only the days this entry's repeat pattern actually covers are
      // booked, e.g. a weekly job only occupies one day out of each week.
      expandRepeatDates(d.startDate, d.endDate||d.startDate, d.repeat).forEach(iso=>{
        (map[iso]=map[iso]||[]).push(info);
      });
    });
  });
  return map;
}
/* Whether two start/end time-of-day strings ("HH:MM") overlap. Missing
   times are treated conservatively as a conflict, since we can't confirm
   there's no overlap without both times. */
function timesOverlap(aStart,aEnd,bStart,bEnd){
  if(!aStart || !aEnd || !bStart || !bEnd) return true;
  return aStart<bEnd && bStart<aEnd;
}
/* Expands the not-yet-saved SCHED_PENDING list (this session, for the work
   order currently being scheduled) into per-day time bookings, so a second
   pending date being added in the same session is also checked for
   overlap, not just dates already saved to the database. */
function pendingDayBookings(iso){
  const out=[];
  (SCHED_PENDING||[]).forEach(d=>{
    const endDate=d.endDate||d.startDate;
    if(expandRepeatDates(d.startDate, endDate, d.repeat).indexOf(iso)!==-1){
      out.push({startTime:d.startTime, endTime:d.endTime});
    }
  });
  return out;
}
/* Multiple jobs are allowed on the same day, a day is only a real
   double-booking if the new start/end time overlaps an existing
   appointment's start/end time on one of the days in range. */
/* Returns the list of clashing bookings (empty when there are none) so the
   override prompt can say exactly what is being double-booked, rather than
   just refusing with a generic message. */
function findScheduleConflicts(startDate, startTime, endDate, endTime, excludeDateId, repeat){
  const out=[];
  if(!startDate || !startTime || !endDate || !endTime) return out;
  const map=buildJobDaysMap(excludeDateId);
  // Only the days this entry's own repeat cycle books are checked, e.g. a
  // weekly job never conflicts over the days between its occurrences.
  expandRepeatDates(startDate, endDate, repeat).forEach(iso=>{
    // In edit mode there is no pending list to check against.
    const bookings=(map[iso]||[]).concat(SCHED_EDIT_ID ? [] : pendingDayBookings(iso).map(b=>
      Object.assign({customer:'another date you just added', type:'Pending'}, b)));
    bookings.forEach(b=>{
      if(timesOverlap(startTime, endTime, b.startTime, b.endTime)){
        out.push({date:iso, customer:b.customer||'Unnamed customer', type:b.type||'', startTime:b.startTime, endTime:b.endTime});
      }
    });
  });
  return out;
}
function isDateTimeRangeConflict(startDate, startTime, endDate, endTime, excludeDateId, repeat){
  return findScheduleConflicts(startDate, startTime, endDate, endTime, excludeDateId, repeat).length>0;
}
/* Plain-language summary of a clash, used in the override prompt. */
function describeConflicts(list){
  const seen=[], lines=[];
  list.forEach(c=>{
    const key=c.customer+'|'+c.date+'|'+c.startTime;
    if(seen.indexOf(key)!==-1) return;
    seen.push(key);
    const when=c.startTime&&c.endTime ? `${formatTime12(c.startTime)}–${formatTime12(c.endTime)}` : 'time not set';
    lines.push(`• ${formatDateDisplay(c.date)}, ${c.customer} (${when})`);
  });
  const shown=lines.slice(0,4).join('\n');
  const more=lines.length>4 ? `\n…and ${lines.length-4} more` : '';
  return shown+more;
}
/* Shared override gate. Runs onOk() when clear; otherwise lays out the clash
   and lets the user book over it deliberately. */
function withConflictOverride(startDate, startTime, endDate, endTime, excludeDateId, onOk, repeat){
  const clashes=findScheduleConflicts(startDate, startTime, endDate, endTime, excludeDateId, repeat);
  if(!clashes.length){ onOk(false); return; }
  askYesNo(
    `This overlaps something already on the calendar:\n\n${describeConflicts(clashes)}\n\nSchedule it anyway (double-book)?`,
    (yes)=>{ if(yes) onOk(true); },
    {yes:'Double-book it', no:'Pick another time'}
  );
}
function isDateBooked(iso){
  const map=buildJobDaysMap(SCHED_EDIT_ID);
  return !!(map[iso] && map[iso].length);
}
function scheduleCalendarHTML(){
  const month=SCHED_CAL_MONTH;
  const y=month.getFullYear(), m=month.getMonth();
  const first=new Date(y,m,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthLabel=month.toLocaleDateString([], {month:'long', year:'numeric'});
  const todayIso=isoToday();
  const jobDays=buildJobDaysMap(SCHED_EDIT_ID);
  // Which days within the current start/repeat-until selection are actually
  // booked, per the chosen repeat pattern, the rest (e.g. the 6 of 7 days
  // between weekly occurrences) get hatched out below.
  const includedDays = (SCHED_START && SCHED_END && SCHED_REPEAT!=='none')
    ? expandRepeatDates(SCHED_START, SCHED_END, SCHED_REPEAT) : null;

  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="schedCalDay empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    // Normally past days are unselectable. When editing a date that already
    // started, its own days must stay reachable so the entry can be corrected
    // after the fact (e.g. fixing yesterday's arrival time).
    const isPast = iso < (SCHED_EDIT_ID ? minSchedDate() : todayIso);
    const isStart = iso===SCHED_START;
    const isEnd = SCHED_END && iso===SCHED_END;
    const inRange = SCHED_START && SCHED_END && iso>SCHED_START && iso<SCHED_END;
    // Days inside the range that the repeat pattern doesn't actually land
    // on (e.g. the other 6 days of the week for a weekly repeat) are
    // shown hatched so it's clear before saving that they're never booked.
    const isSkipped = inRange && includedDays && includedDays.indexOf(iso)===-1;
    const booked = jobDays[iso];
    const cls=['schedCalDay'];
    if(isPast) cls.push('past');
    if(booked) cls.push('hasJob');
    if(isStart) cls.push('selStart');
    if(isEnd) cls.push('selEnd');
    if(inRange) cls.push('inRange');
    if(isSkipped) cls.push('skipDay');
    let popup='';
    let clickAttr='';
    if(booked){
      popup=`<div class="schedDayPopup" onclick="event.stopPropagation()">
        ${booked.map(b=>`<div class="schedDayPopupRow"><b>${esc(b.customer)}</b>${esc(b.type)} \u2022 ${formatTime12(b.startTime)}${b.endTime && b.endTime!==b.startTime ? ' \u2013 '+formatTime12(b.endTime) : ''}</div>`).join('')}
      </div>`;
    }
    if(!isPast){
      // Booked ("has job") days need to both select the date (tap) and reveal
      // the info popup (press-and-hold), since a single tap can't do both on
      // a touch device. Non-booked days just select on tap as before.
      clickAttr = booked
        ? `onclick="schedDayClick('${iso}')" onpointerdown="schedDayPointerDown('${iso}', this)" onpointerup="schedDayPointerUp()" onpointerleave="schedDayPointerUp()" onpointercancel="schedDayPointerUp()"`
        : `onclick="pickSchedDay('${iso}')"`;
    }
    cells += `<div class="${cls.join(' ')}" ${clickAttr} title="${booked?'Already has a job that day. Tap to pick this day, or press and hold for details. You can still schedule here if your time doesn\u2019t conflict.':''}">${day}${popup}</div>`;
  }

  return `
    <div class="schedCalNav">
      <button onclick="changeSchedMonth(-1)">&larr;</button>
      <b>${monthLabel}</b>
      <button onclick="changeSchedMonth(1)">&rarr;</button>
    </div>
    <div class="schedCalGrid">
      <div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>
      ${cells}
    </div>
    <div class="small" style="margin-top:8px;">Shaded days already have a job scheduled. Hover on desktop (press and hold on mobile) to see what's booked, or just tap to pick that day. You can still schedule another job the same day as long as the times don't overlap. Click an open date to set the start date; click a later date to set the end date.</div>`;
}
/* Re-renders only the calendar column, leaving the form fields (and the
   rest of the page) untouched so typing/tapping in the date & time inputs
   doesn't lose focus, close native pickers mid-interaction, or reset the
   modal's scroll position back to the top. */
function refreshSchedCalendar(){
  const col=document.getElementById('schedCalCol');
  if(col) col.innerHTML=scheduleCalendarHTML();
}
function changeSchedMonth(delta){
  SCHED_CAL_MONTH=new Date(SCHED_CAL_MONTH.getFullYear(), SCHED_CAL_MONTH.getMonth()+delta, 1);
  refreshSchedCalendar();
}
/* Long-press support for "has job" calendar cells on touch devices: a plain
   tap selects the date (same as any open day), while a press-and-hold
   reveals the info popup showing what's already booked that day. Desktop
   still gets the popup on hover regardless. */
function schedDayPointerDown(iso, el){
  SCHED_LONGPRESS_FIRED=false;
  clearTimeout(SCHED_LONGPRESS_TIMER);
  SCHED_LONGPRESS_TIMER=setTimeout(()=>{
    SCHED_LONGPRESS_FIRED=true;
    if(el) el.classList.add('showInfo');
  }, 450);
}
function schedDayPointerUp(){
  clearTimeout(SCHED_LONGPRESS_TIMER);
}
function schedDayClick(iso){
  if(SCHED_LONGPRESS_FIRED){ SCHED_LONGPRESS_FIRED=false; return; }
  pickSchedDay(iso);
}
function pickSchedDay(iso){
  captureSchedFields();
  if(SCHED_REPEAT==='none'){
    // No repeat chosen, the calendar just picks a single occurrence day.
    SCHED_START=iso; SCHED_END=iso;
  } else if(!SCHED_START || (SCHED_START && SCHED_END) || iso<=SCHED_START){
    SCHED_START=iso; SCHED_END=null;
  } else {
    SCHED_END=iso;
  }
  const startEl=document.getElementById('schedStartDate');
  const endEl=document.getElementById('schedEndDate');
  if(startEl) startEl.value=SCHED_START||'';
  if(endEl) endEl.value=SCHED_END||'';
  refreshSchedCalendar();
}
function addPendingScheduleDate(){
  captureSchedFields();
  const startDate=document.getElementById('schedStartDate').value || SCHED_START;
  const startTime=document.getElementById('schedStartTime').value;
  const endTimeEl=document.getElementById('schedEndTime');
  const endTime=endTimeEl ? endTimeEl.value : '';
  const repeatEl=document.getElementById('schedRepeat');
  const repeat=(repeatEl ? repeatEl.value : SCHED_REPEAT) || 'none';
  let endDate;
  if(repeat==='none'){
    endDate=startDate;
  } else {
    const endDateEl=document.getElementById('schedEndDate');
    endDate=endDateEl ? endDateEl.value : (SCHED_END||'');
    if(!endDate){ toast('Pick a date to end the repeat.'); return; }
  }
  if(!startDate || !startTime || !endTime){ toast('Start date, start time, and end time are all required.'); return; }
  if(endDate<startDate){ toast('The repeat must end on or after the start date.'); return; }
  if(endTime<=startTime){ toast('End time must be after the start time.'); return; }
  // A clash no longer blocks the booking outright, it asks, and records the
  // decision on the entry so the double-booking stays visible afterwards.
  withConflictOverride(startDate, startTime, endDate, endTime, null, (overridden)=>{
    const entry={
      id:'sd'+Date.now()+Math.random().toString(36).slice(2,7),
      type:SCHED_TYPE,
      startDate, startTime,
      multiDay: endDate!==startDate,
      endDate, endTime,
      repeat,
      overridden: !!overridden
    };
    SCHED_PENDING.push(entry);
    // Keep the times so back-to-back visits at the same hour don't need retyping.
    SCHED_START=null; SCHED_END=null;
    renderScheduleWidget();
    toast(overridden
      ? 'Double-booked date added to the list below.'
      : 'Date added to the list below. Click "Add to Calendar" when you\'re done.');
  }, repeat);
}
function removePendingScheduleDate(i){
  captureSchedFields();
  SCHED_PENDING.splice(i,1);
  renderScheduleWidget();
}
function finalizeScheduleDates(){
  const wo=getWO(SCHED_WO_ID);
  if(!SCHED_PENDING.length) return;
  SCHED_PENDING.forEach(entry=>{
    entry.dayLogs=expandRepeatDates(entry.startDate, entry.endDate||entry.startDate, entry.repeat).map(date=>({date, checkIn:null, checkOut:null}));
  });
  wo.scheduleDates=(wo.scheduleDates||[]).concat(SCHED_PENDING);
  const dbl=SCHED_PENDING.filter(e=>e.overridden).length;
  addAdminLog(wo, `Added ${SCHED_PENDING.length} schedule date(s) and generated a calendar (.ics) download.`+
    (dbl?` ${dbl} of them double-booked over an existing appointment (override).`:''));
  saveDB(DB);
  downloadICS(wo, SCHED_PENDING);
  const doneId=SCHED_WO_ID;
  SCHED_PENDING=[]; SCHED_WO_ID=null;
  toast('Schedule dates saved. The .ics file downloaded. Open it to add to Apple Calendar.');
  renderWorkOrderModal(doneId);
  renderMain();
}

/* ---- .ics generation ---- */
function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function icsDateTime(dateIso, timeHHMM){
  const [y,mo,d]=dateIso.split('-');
  const [h,mi]=timeHHMM.split(':');
  return `${y}${mo}${d}T${h}${mi}00`;
}
function icsDateOnly(dateIso){
  return dateIso.replace(/-/g,'');
}
/* DTSTAMP is required to be UTC. It was previously being written as a local
   floating time, which some calendar clients reject or import at the wrong
   moment. */
function icsUtcStamp(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function buildICS(wo, entries){
  const name=(wo.customer.name||'Customer').trim();
  const phone=wo.customer.phone||'';
  const address=wo.customer.address||'';
  const notes=wo.jobDetails && wo.jobDetails.description ? wo.jobDetails.description : '';
  const stamp=icsUtcStamp();

  let events='';
  entries.forEach(e=>{
    const title=`${name} \u30fb ${phone} \u30fb ${formatArrivalWindow(e.startTime)}`;
    const dtStart=icsDateTime(e.startDate, e.startTime);
    // Every occurrence, including repeats, reuses the start date's own
    // end time, so DTEND never reaches past that same day.
    const dtEnd=icsDateTime(e.startDate, e.endTime);
    let rrule='';
    if(e.repeat && e.repeat!=='none'){
      // DTSTART here is a floating local time, so UNTIL must be floating too,
      // a trailing Z would make this an invalid mixed-form recurrence rule.
      // Each occurrence only spans the Start Time–End Time window on that
      // day (never the full 24 hours).
      const freq = e.repeat==='weekly' ? 'WEEKLY' : 'DAILY';
      rrule = `RRULE:FREQ=${freq};UNTIL=${icsDateOnly(e.endDate)}T235959\n`;
    }
    events += `BEGIN:VEVENT
UID:${e.id}@goodandhandy
DTSTAMP:${stamp}
SUMMARY:${icsEscape(title)}
LOCATION:${icsEscape(address)}
DTSTART:${dtStart}
DTEND:${dtEnd}
${rrule}DESCRIPTION:${icsEscape(notes)}
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:Job Reminder
TRIGGER:-PT2H
END:VALARM
END:VEVENT
`;
  });

  // CRLF line endings are what RFC 5545 requires; plain \n trips up stricter
  // importers (notably some Outlook/Exchange paths).
  return (`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Good & Handy//Portal//EN
CALSCALE:GREGORIAN
METHOD:PUBLISH
${events}END:VCALENDAR`).replace(/\r?\n/g,'\r\n');
}
function downloadICS(wo, entries){
  const ics=buildICS(wo, entries);
  const blob=new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const safeName=(wo.customer.name||'job').replace(/[^a-z0-9]+/gi,'_');
  a.href=url;
  a.download=`${safeName}_schedule.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function extractUnit(str){
  // Pulls a unit/suite/apt/building/# designator out of a freeform address
  // string (whether it's its own comma segment or jammed onto the street,
  // e.g. "123 Main St Apt 4B") so it can be re-attached right after the
  // street suffix on line 1, and doesn't confuse city/state/zip parsing.
  const re=/,?\s*\b(unit|ste|suite|apt|apartment|bldg|building)\.?\s*#?\s*([A-Za-z0-9-]+)\b|,?\s*#\s*([A-Za-z0-9-]+)\b/i;
  const m=str.match(re);
  if(!m) return {rest:str, unit:''};
  const rest=(str.slice(0,m.index)+str.slice(m.index+m[0].length)).replace(/,\s*,/g,',').replace(/,\s*$/,'').trim();
  let unit;
  if(m[1]){
    const wordMap={unit:'Unit',ste:'Ste',suite:'Suite',apt:'Apt',apartment:'Apt',bldg:'Bldg',building:'Bldg'};
    unit=(wordMap[m[1].toLowerCase()]||m[1])+' '+m[2];
  } else {
    unit='#'+m[3];
  }
  return {rest, unit};
}
function splitAddress(rawAddr){
  const trimmedRaw=(rawAddr||'').trim();
  if(!trimmedRaw) return {line1:'', line2:'', street:'', unit:'', city:'', state:'', zip:''};
  const {rest:addr, unit}=extractUnit(trimmedRaw);
  let parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
  const streetSuffixRe=/^(.*?\b(?:St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Ln|Lane|Blvd|Boulevard|Ct|Court|Way|Pl|Place|Ter|Terrace|Cir|Circle|Pkwy|Parkway|Hwy|Highway|Trail|Trl|Loop|Sq|Square)\.?)\s+(.+)$/i;
  // Some street names (common in San Diego and elsewhere in California) use a
  // Spanish street-type word as a PREFIX right after the house number,
  // e.g. "1234 Caminito Corriente", instead of a traditional English suffix
  // like "St" or "Ave" at the end. streetSuffixRe never finds a match on
  // those, so without this fallback the city stays stuck on the street line.
  // When it applies, treat the type word plus the next word as the full
  // street name and everything after that as the city.
  const streetPrefixWords=['Camino','Caminito','Calle','Callejon','Callejuela','Paseo','Via','Avenida','Corte','Punta','Sendero','Cresta','Bahia','Ladera','Loma','Vereda','Cerro','Portal','Rincon'];
  const streetPrefixRe=new RegExp('^(\\d+\\S*\\s+(?:'+streetPrefixWords.join('|')+')\\s+\\S+)\\s+(.+)$','i');
  // Tries the normal suffix match first, then falls back to the prefix-word
  // heuristic above; returns null if neither finds a street/city boundary.
  function matchStreetEnd(str){
    const sm=str.match(streetSuffixRe);
    if(sm) return {street:sm[1].trim(), rest:sm[2].trim()};
    const pm=str.match(streetPrefixRe);
    if(pm) return {street:pm[1].trim(), rest:pm[2].trim()};
    return null;
  }
  if(parts.length<=1){
    // No commas at all, peel a trailing "STATE ZIP" off the end, then split the
    // remainder on the street-type word (St/Ave/Rd/etc.) so the city still lands
    // on the same line as state/zip instead of staying stuck to the street.
    let rest=addr, stateZip='';
    const szMatch=rest.match(/\s+([A-Za-z]{2})\s+(\d{5}(?:-\d{4})?)\s*$/);
    if(szMatch){
      stateZip=szMatch[1].toUpperCase()+' '+szMatch[2];
      rest=rest.slice(0, szMatch.index).trim();
    }
    const sm=matchStreetEnd(rest);
    let street=rest, city='';
    if(sm){ street=sm.street; city=sm.rest; }
    const line2=[city, stateZip].filter(Boolean).join(', ');
    const szParts=stateZip ? stateZip.split(/\s+/) : [];
    return {
      line1: unit ? [street, unit].filter(Boolean).join(' ') : street,
      line2,
      street: street||'', unit: unit||'', city: city||'',
      state: szParts[0]||'', zip: szParts[1]||''
    };
  }
  // Comma-separated address (typed or from autocomplete). Drop a trailing country
  // segment, pull the zip and state off the end, then take the very next
  // segment after the street as the city, skipping any county in between,
  // so city always ends up paired with state/zip, never with the street.
  if(/^(united states|usa|us|united states of america)$/i.test(parts[parts.length-1])) parts.pop();
  let zip='', state='';
  if(parts.length && /^\d{5}(-\d{4})?$/.test(parts[parts.length-1])){
    zip=parts.pop();
  }
  if(parts.length>=2){
    const last=parts[parts.length-1];
    const combo=last.match(/^(.*?)\s+(\d{5}(?:-\d{4})?)$/);
    if(combo && !zip){ state=combo[1].trim(); zip=combo[2]; parts.pop(); }
    else { state=parts.pop(); }
  }
  let street=parts.length ? parts[0] : '';
  let city=parts.length>1 ? parts[1] : '';
  // If what looks like the "street" segment doesn't actually contain a street-type
  // word, the address was probably typed as "123 Main St City" with no comma
  // between street and city, try to split that single segment the same way.
  if(street && !city){
    const sm=matchStreetEnd(street);
    if(sm){ city=sm.rest; street=sm.street; }
  }
  const line2=[city, [state, zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const line1Base=street || addr;
  return {
    line1: unit ? [line1Base, unit].filter(Boolean).join(' ') : line1Base,
    line2,
    street: line1Base||'', unit: unit||'', city: city||'',
    state: state||'', zip: zip||''
  };
}

/* ---- Phone number formatting: always normalized to (XXX) XXX-XXXX ---- */
/* Renders a stored phone number as a tap-to-call link. The visible text keeps
   the formatted "(555) 123-4567" shape while the href carries digits only,
   which is what dialers expect; a 10-digit number gets +1 so it still dials
   correctly if the phone is roaming. Clicks and long-presses are kept from
   bubbling so tapping the number places a call rather than tripping the
   double-click/long-press "edit customer" handler on the surrounding card. */
function phoneLink(raw){
  const shown=(raw||'').trim();
  if(!shown) return '';
  const digits=shown.replace(/\D/g,'');
  if(!digits) return esc(shown);
  const href='tel:'+(digits.length===10 ? '+1'+digits : digits);
  return `<a class="telLink" href="${href}" title="Call ${esc(shown)}" aria-label="Call ${esc(shown)}"`
    + ` onclick="event.stopPropagation()" ondblclick="event.stopPropagation()"`
    + ` ontouchstart="event.stopPropagation()">${esc(shown)}</a>`;
}
/* Renders an address as a tap-to-navigate link, opening the device's default
   maps app (Apple Maps on iOS/macOS, Google Maps elsewhere) via directionsUrl.
   `text` lets a two-line address share one destination, so tapping either
   line goes to the same place. Event bubbling is stopped for the same reason
   as phoneLink: the surrounding card edits on double-click/long-press. */
function addressLink(fullAddress, text){
  const shown=(text!==undefined ? text : (fullAddress||'')).trim();
  if(!shown) return '';
  const full=(fullAddress||'').trim();
  if(!full) return esc(shown);
  return `<a class="mapLink" href="${directionsUrl(full)}" target="_blank" rel="noopener"`
    + ` title="Directions to ${esc(full)}" aria-label="Directions to ${esc(full)}"`
    + ` onclick="event.stopPropagation()" ondblclick="event.stopPropagation()"`
    + ` ontouchstart="event.stopPropagation()">${esc(shown)}</a>`;
}
/* Renders an email as a tap-to-compose link, opening a new message in the
   device's default mail app. */
function emailLink(raw){
  const shown=(raw||'').trim();
  if(!shown) return '';
  if(shown.indexOf('@')<0) return esc(shown);
  // The @ is legal literal in a mailto: and some mail clients handle a
  // percent-encoded one poorly, so it's restored after encoding.
  const href='mailto:'+encodeURIComponent(shown).replace(/%40/g,'@');
  return `<a class="mailLink" href="${href}"`
    + ` title="Email ${esc(shown)}" aria-label="Email ${esc(shown)}"`
    + ` onclick="event.stopPropagation()" ondblclick="event.stopPropagation()"`
    + ` ontouchstart="event.stopPropagation()">${esc(shown)}</a>`;
}
function formatPhoneNumber(raw){
  let d=(raw||'').replace(/\D/g,'');
  if(d.length===11 && d[0]==='1') d=d.slice(1);
  d=d.slice(0,10);
  if(!d.length) return '';
  if(d.length<4) return '('+d;
  if(d.length<7) return '('+d.slice(0,3)+') '+d.slice(3);
  return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
}
function onPhoneFieldInput(el){
  el.value=formatPhoneNumber(el.value);
}
/* ---- Address autocomplete (OpenStreetMap Nominatim) ---- */
let ADDR_DEBOUNCE_TIMER=null;
let ADDR_HIDE_TIMER=null;
function onAddressFieldInput(el){
  const key=el.id.replace('cf_','');
  const q=el.value.trim();
  clearTimeout(ADDR_DEBOUNCE_TIMER);
  if(q.length<4){ hideAddressSuggestions(); return; }
  ADDR_DEBOUNCE_TIMER=setTimeout(()=>fetchAddressSuggestions(q,key), 350);
}
function fetchAddressSuggestions(q,key){
  const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=5&q='+encodeURIComponent(q);
  fetch(url,{headers:{'Accept':'application/json'}})
    .then(r=>r.ok?r.json():[])
    .then(results=>renderAddressSuggestions(results||[],key))
    .catch(()=>hideAddressSuggestions());
}
function renderAddressSuggestions(results,key){
  const box=document.getElementById('addrSuggest_'+key);
  if(!box) return;
  if(!results.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML=results.map(r=>{
    const label=esc(r.display_name||'');
    return `<div class="addrSuggestItem" onmousedown="selectAddressSuggestion('${key}', this)" data-val="${label}">${label}</div>`;
  }).join('');
  box.style.display='block';
}
function selectAddressSuggestion(key, itemEl){
  const el=document.getElementById('cf_'+key);
  const val=itemEl.getAttribute('data-val');
  if(el && val!==null){ el.value=val; }
  hideAddressSuggestions();
}
function scheduleHideAddressSuggestions(){
  clearTimeout(ADDR_HIDE_TIMER);
  ADDR_HIDE_TIMER=setTimeout(hideAddressSuggestions,150);
}

function copyToClipboard(text, btn){
  const done=()=>{ if(btn){ const orig=btn.textContent; btn.textContent='✓'; setTimeout(()=>{btn.textContent=orig;},1000); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
/* navigator.clipboard is unavailable on non-HTTPS origins and in some
   in-app browsers, where the copy button previously did nothing at all. */
function fallbackCopy(text, done){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    done();
  }catch(e){ toast('Copy failed. Select the text manually.'); }
}
/* Copy targets are carried on a data- attribute and read back by a delegated
   listener, instead of being spliced into an inline onclick string literal,
   an apostrophe or quote in an item name used to break the handler outright. */
function copyLineRow(displayHTML, copyText){
  return `<div class="lineRow"><span class="lineText">${displayHTML}</span>`+
    `<button class="copyIcon" type="button" title="Copy" aria-label="Copy line" data-copy="${esc(copyText)}">⧉</button></div>`;
}
function priceLineRow(entry){
  const item = typeof entry==='string' ? entry : (entry.item||'');
  const price = typeof entry==='string' ? '' : (entry.price||'');
  const full = price ? (item+', '+price) : item;
  return copyLineRow(`${esc(item)}${price?`<span class="priceTag">${esc(price)}</span>`:''}`, full);
}
function plainLineRow(text){
  return copyLineRow(esc(text), String(text||''));

  } else if(code==='storage/bucket-not-found' || code==='storage/project-not-found' || code==='storage/object-not-found'){
    title='That storage bucket doesn\u2019t exist';
    body=`<p style="margin:6px 0;">Uploads are pointed at <b>${esc(bucket)}</b>, which Firebase doesn't recognise. Newer projects use <code>&lt;project-id&gt;.firebasestorage.app</code> while older ones use <code>&lt;project-id&gt;.appspot.com</code>.</p>

  } else {
    title='The upload was rejected by Firebase';
    body=`<p style="margin:6px 0;">Check <b>Build &rsaquo; Storage</b> is enabled in your Firebase console, and that its <b>Rules</b> allow writes. The exact error is shown below.</p>`;
  }

    <div style="font-weight:700;color:var(--redb);margin-bottom:4px;">${esc(title)}</div>
    ${body}
    <div class="small" style="margin-top:10px;color:var(--muted);word-break:break-word;">
      <b>File:</b> ${esc(LAST_DOC_ERROR.file||'')}${code?` &nbsp;<b>Code:</b> <code>${esc(code)}</code>`:''}<br>
      <b>Bucket:</b> <code>${esc(bucket)}</code><br>

function compressImageToBlob(file){
  // Downscales large photos to a reasonable max dimension and re-encodes as JPEG,
  // since phone camera photos are often 3-8MB and no reason to store them full-size.
  return new Promise((resolve)=>{
    if(!file.type.startsWith('image/') || file.type==='image/svg+xml'){ resolve(null); return; }
    const img=new Image();
    const reader=new FileReader();
    reader.onload=()=>{
      img.onload=()=>{
        const MAX_DIM=1600;
        let {width,height}=img;
        if(width>MAX_DIM || height>MAX_DIM){
          const scale=MAX_DIM/Math.max(width,height);
          width=Math.round(width*scale); height=Math.round(height*scale);
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        canvas.toBlob(blob=>resolve(blob), 'image/jpeg', 0.78);
      };
      img.onerror=()=>resolve(null);
      img.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
/* Details of the most recent failed upload, so the Docs tab can explain the
   cause instead of the user having to open the browser console. Cleared as
   soon as an upload succeeds. */
let LAST_DOC_ERROR=null;
const DOC_MAX_BYTES = 25*1024*1024; // 25MB per non-image file, generous now that it's real cloud storage
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve=>setTimeout(()=>resolve(null), ms))
  ]);
}
async function handleDocUpload(id, inputEl){
  const files=Array.from(inputEl.files||[]);
  if(!files.length) return;
  if(!syncStorage){ toast('Set up Multi-Device Sync first. Documents are stored in your Firebase project.'); inputEl.value=''; return; }
  const wo=getWO(id);
  const oversized=files.filter(f=>f.size>DOC_MAX_BYTES && !f.type.startsWith('image/'));
  if(oversized.length){
    toast(oversized.length===1
      ? `"${oversized[0].name}" is over the 25MB limit and was skipped.`
      : `${oversized.length} files were over the 25MB limit and were skipped.`);
  }
  const toProcess=files.filter(f=>f.type.startsWith('image/') || f.size<=DOC_MAX_BYTES);
  const statusEl=document.getElementById(`docUploadStatus_${wo.id}`);
  inputEl.disabled=true;
  let addedCount=0;
  const failed=[];
  try{
    for(const [i,file] of toProcess.entries()){
      // Files are now named automatically from the filename and uploaded
      // straight through. The old flow fired a blocking prompt() per file
      // before each upload, on a 10-photo batch that meant ten modal
      // interruptions, and a mis-tapped Cancel silently dropped the file.
      // Renaming is still one tap away on each row afterwards.
      const name=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim() || file.name;
      if(statusEl) statusEl.textContent=`Uploading "${name}"… (${i+1}/${toProcess.length})`;

      let blob=file;
      // HEIC/HEIF (common for iPhone camera photos) can't be decoded by <canvas> in most
      // browsers, which would otherwise hang compression forever, skip straight to raw upload.
      const isHeic=/heic|heif/i.test(file.type) || /\.(heic|heif)$/i.test(file.name);
      if(file.type.startsWith('image/') && !isHeic){
        try{
          const compressed = await withTimeout(compressImageToBlob(file), 8000);
          if(compressed) blob=compressed;
        }catch(e){ /* fall back to raw file below */ }
      }

      const docId='d'+Date.now()+Math.random().toString(36).slice(2,7);
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const storagePath=`docs/${wo.id}/${docId}_${safeName}`;
      try{
        const uploadTask = syncStorage.ref(storagePath).put(blob, {contentType: blob.type||file.type||undefined});
        const snapshot = await new Promise((resolve,reject)=>{
          const timer=setTimeout(()=>{
            reject(new Error('No response from Firebase after 30s. This is usually a CORS block, an ad-blocker/firewall blocking firebasestorage.googleapis.com, or the Storage bucket not fully finished provisioning yet.'));
          }, 30000);
          uploadTask.on('state_changed',
            (p)=>{ if(statusEl && p.totalBytes){ statusEl.textContent=`Uploading "${name}"… ${Math.round((p.bytesTransferred/p.totalBytes)*100)}%`; } },
            (err)=>{
              clearTimeout(timer);
              // Wrapping in a new Error dropped Firebase's .code, which is the
              // one field that identifies the cause, carry it across.
              const wrapped=new Error(`${err.code||'error'}: ${err.message||err}`);
              wrapped.code=err.code||'';
              reject(wrapped);
            },
            ()=>{ clearTimeout(timer); resolve(uploadTask.snapshot); }
          );
        });
        const url = await snapshot.ref.getDownloadURL();
        const ts=nowStamp();
        wo.docs.push({
          id: docId, name: name, type: file.type||'', size: blob.size,
          url, storagePath, uploadedBy: CURRENT_USER.displayName, date: ts.date, uploadedAt: Date.now()
        });
        DB.storageUsedBytes=(DB.storageUsedBytes||0)+blob.size;
        addedCount++;
      }catch(e){
        console.error(e);
        // The real Firebase error code (storage/unauthorized, storage/unknown,
        // …) is the only thing that identifies WHY an upload was rejected, and
        // it was previously visible only in the console. Keep it so the Docs
        // tab can name the cause and the fix.
        const rawMsg=(e && e.message) ? String(e.message) : String(e);
        // Some paths lose the code; it's still recoverable from the message.
        const codeMatch=rawMsg.match(/storage\/[a-z-]+/i);
        LAST_DOC_ERROR={
          code:(e && e.code) ? String(e.code) : (codeMatch ? codeMatch[0] : ''),
          msg:rawMsg,
          file:file.name
        };
        failed.push(file.name);
        if(statusEl) statusEl.textContent='';
      }
    }
  } finally {
    if(statusEl) statusEl.textContent='';
    inputEl.disabled=false;
  }
  if(addedCount){
    LAST_DOC_ERROR=null;
    await purgeStorageIfOverCap();
    saveDB(DB);
    renderWorkOrderModal(id);
    toast(addedCount>1 ? `${addedCount} documents uploaded. Tap Rename on any row to retitle it.` : 'Document uploaded. Tap Rename to retitle it.');
  }
  if(failed.length){
    toast(failed.length===1
      ? `Couldn't upload "${failed[0]}". See the details now shown in the Docs tab.`
      : `${failed.length} files failed to upload. See the details now shown in the Docs tab.`);
    renderWorkOrderModal(id);
  }
  inputEl.value='';
}
/* Safety net: if total Storage usage reaches the 5GB free-tier cap, automatically
   delete the oldest documents (across every work order) until back under it. */
async function purgeStorageIfOverCap(){
  if(!((DB.storageUsedBytes||0) >= STORAGE_CAP_BYTES)) return;
  let flat=[];
  DB.workOrders.forEach(wo=>(wo.docs||[]).forEach(d=>{ if(d.url) flat.push({wo, doc:d}); }));
  flat.sort((a,b)=>(a.doc.uploadedAt||0)-(b.doc.uploadedAt||0)); // oldest first
  const purgedNames=[];
  for(const {wo, doc} of flat){
    if((DB.storageUsedBytes||0) < STORAGE_CAP_BYTES) break;
    try{ await syncStorage.ref(doc.storagePath).delete(); }catch(e){ /* may already be gone, still clean up metadata */ }
    wo.docs=wo.docs.filter(d=>d.id!==doc.id);
    DB.storageUsedBytes=Math.max(0, (DB.storageUsedBytes||0)-(doc.size||0));
    wo.adminLog.unshift({text:`Auto-purged document "${doc.name}". 5GB storage cap reached.`, by:'System', date:nowStamp().date, time:nowStamp().time});
    purgedNames.push(doc.name);
  }
  if(purgedNames.length){
    toast(`Storage cap reached. Auto-purged ${purgedNames.length} oldest document(s) to stay under 5GB.`);
  }
}
function getDoc(wo, docId){ return (wo.docs||[]).find(d=>d.id===docId); }

async function downloadDoc(id, docId){
  const wo=getWO(id); const d=getDoc(wo, docId);

  if(d.url){
    try{
      const resp=await fetch(d.url);
      const blob=await resp.blob();
      const objUrl=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=objUrl; a.download=d.name||'document';
      document.body.appendChild(a); a.click(); a.remove();

      window.open(d.url, '_blank'); // fallback if fetch is blocked (CORS etc.)
    }
    return;
  }
  const a=document.createElement('a');
  a.href=d.dataUrl; a.download=d.name||'document';
  document.body.appendChild(a); a.click(); a.remove();
}
