/* Raised once per work order, the first time its customer details land on an
   existing customer. It is a warning, not a gate: the second job at the same
   address is usually legitimate, and the two records stay separate either
   way. Acknowledging it is recorded so nobody gets asked twice. */
function warnIfDuplicateCustomer(id){
  const wo=getWO(id);
  if(!wo || wo.dupWarned) return;
  const prior=priorJobsFor(wo);
  if(!prior.length) return;
  wo.dupWarned=true;
  saveDB(DB);
  const byPhone=prior.filter(x=>x.why==='phone').length;
  const how = byPhone ? 'the same phone number' : 'the same street address';
  const list=prior.slice(0,5).map(x=>'#'+woCode(x.wo)+'  '+(x.wo.customer.name||'Unnamed customer')+'  ('+stageLabelFor(x.wo)+')').join('\n');
  const more = prior.length>5 ? ('\nand '+(prior.length-5)+' more') : '';
  askYesNo(
    'This customer already has '+prior.length+' work order'+(prior.length>1?'s':'')+' on file, matched on '+how+':\n\n'+list+more+
    '\n\nNothing has been merged. This work order stays separate, and all of them are listed under Prior Jobs.',
    ()=>{},
    {yes:'Got it', no:'Close'}
  );
}
function copyToClipboard(text, btn){
  const done=()=>{ if(btn){ const orig=btn.textContent; btn.textContent='✓'; setTimeout(()=>{btn.textContent=orig;},1000); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
/* navigator.clipboard is unavailable on non-HTTPS origins and in some
   in-app browsers, where the copy button previously did nothing at all. */
function fallbackCopy(text, done){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    done();
  }catch(e){ toast('Copy failed. Select the text manually.'); }
}
/* Copy targets are carried on a data- attribute and read back by a delegated
   listener, instead of being spliced into an inline onclick string literal,

function copyLineRow(displayHTML, copyText){

}

  return copyLineRow(`${esc(item)}${price?`<span class="priceTag">${esc(price)}</span>`:''}`, full);

/* Pre-site scope block. Sits under the job description and above the labor
   lists, which is where the walkthrough wording used to end up back when it
   was pasted into the description itself. Older work orders were saved before
   scopeText existed, so their wording is rebuilt from the structured scope
   entries rather than showing nothing. */
function psScopeLines(p){
  if(!p) return [];
  if(p.scopeText && p.scopeText.trim()) return p.scopeText.split('\n').filter(l=>l.trim());
  return (p.scope||[]).map(r=>{
    const bits=[r.item];
    if(r.qty) bits.push(String(r.qty));
    if(r.ask) bits.push(r.ask);
    if(r.note) bits.push(r.note);
    return bits.filter(Boolean).join(', ');
  }).filter(l=>l.trim());
}

    ${p.transcript?`<details style="margin-top:6px"><summary class="small">Walkthrough notes</summary><div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(p.transcript)}</div></details>`:''}

   down; bounds are checked so a key held at either end does nothing. */
function moveJDItem(id, key, idx, dir){

/* ---- Drag to reorder ----
   Pointer events rather than HTML5 drag-and-drop, because dragstart/drop never
   fire for touch input and this list has to work on a phone. One pointer API
   covers mouse, touch and stylus.

   Nothing is moved in the DOM during the drag. The grabbed row is lifted and
   translated to follow the pointer, and the rows it passes slide out of the
   way by the same amount, so the gap opens where it will land. The order is
   committed to JD_EDIT once, on drop.

   The first version DID reorder the DOM live, and it broke: re-inserting the
   row detaches and re-attaches the grip inside it, which drops the pointer
   capture, so the browser stopped delivering move events after exactly one
   step. That is why it crawled one line per drag. Listeners now sit on the
   window and the row never leaves its slot, so neither can happen. */
let JD_DRAG=null;
function jdDragStart(ev, id){
  if(ev.button!==undefined && ev.button!==0) return;   // left button or touch
  const grip=ev.currentTarget;
  const row=grip.closest('.editRow');
  const container=row && row.closest('.jdRows');
  if(!row || !container) return;
  ev.preventDefault();
  const rows=[...container.querySelectorAll('.editRow')];
  const from=rows.indexOf(row);
  if(from<0) return;
  /* Geometry is measured once, before anything is transformed, and expressed
     in the container's own scroll coordinates.

     This deliberately does NOT use offsetTop. offsetTop is measured from the
     nearest positioned ancestor, which is not necessarily this list, so those
     numbers could be in a completely different coordinate space from the
     pointer maths below. That mismatch is what made a grabbed row leap across
     the panel. Rects taken against the container are self-consistent whatever
     the surrounding CSS does. */
  const cBox0=container.getBoundingClientRect();
  const geom=rows.map(r=>{
    const b=r.getBoundingClientRect();
    return {top: b.top - cBox0.top + container.scrollTop, h: b.height};
  });
  JD_DRAG={
    id, key:grip.dataset.jdKey, row, container, rows, geom, from, target:from,
    grabDy: ev.clientY - row.getBoundingClientRect().top,
    height: geom[from].h,
    pointerY: ev.clientY, moved:false, raf:0
  };
  row.classList.add('dragging');
  container.classList.add('jdDragging');
  window.addEventListener('pointermove', jdDragMove, {passive:false});
  window.addEventListener('pointerup', jdDragEnd);
  window.addEventListener('pointercancel', jdDragEnd);
  JD_DRAG.raf=requestAnimationFrame(jdDragTick);
}
function jdDragMove(ev){
  if(!JD_DRAG) return;
  ev.preventDefault();
  JD_DRAG.pointerY=ev.clientY;
  JD_DRAG.moved=true;
}
/* Driven by a frame loop rather than straight off the move event, so holding
   the pointer still inside the auto-scroll zone keeps scrolling instead of
   stalling until the next twitch. */
function jdDragTick(){
  if(!JD_DRAG) return;
  jdDragScroll();
  jdDragApply();
  JD_DRAG.raf=requestAnimationFrame(jdDragTick);
}
/* Only the sub-list scrolls. The modal body is deliberately left alone: it
   carries the description, the other sub-lists and the buttons, and scrolling
   all of that while you are placing one line moves the target out from under
   you. */
function jdDragScroll(){
  const d=JD_DRAG;
  const box=d.container.getBoundingClientRect();
  const zone=44;
  let dy=0;
  if(d.pointerY < box.top+zone) dy=-Math.max(3,(box.top+zone-d.pointerY)/2.5);
  else if(d.pointerY > box.bottom-zone) dy=Math.max(3,(d.pointerY-(box.bottom-zone))/2.5);
  if(dy) d.container.scrollTop+=dy;
}
function jdDragApply(){
  const d=JD_DRAG;
  const cBox=d.container.getBoundingClientRect();
  const lastSlot=d.geom[d.geom.length-1];
  const maxTop=lastSlot.top+lastSlot.h-d.height;
  /* Where the row's own top sits, in the container's coordinate space, with
     the grab offset preserved so the line does not jump under the cursor. */
  let top=d.pointerY - cBox.top + d.container.scrollTop - d.grabDy;
  top=Math.max(0, Math.min(top, maxTop));
  d.row.style.transform=`translateY(${top-d.geom[d.from].top}px)`;
  /* Which slot the dragged row's centre is sitting in. Testing containment
     (centre is inside slot i's span) rather than "centre is above slot i's
     midpoint": the midpoint test reported the next slot down the moment the
     drag began, because at rest the centre sits exactly on its own midpoint
     and the strict comparison fell through to the following row. */
  const centre=top+d.height/2;
  let target=d.geom.length-1;
  for(let i=0;i<d.geom.length;i++){
    if(centre < d.geom[i].top+d.geom[i].h){ target=i; break; }
  }
  d.target=target;
  d.rows.forEach((r,i)=>{
    if(r===d.row) return;
    let shift=0;
    if(target>d.from && i>d.from && i<=target) shift=-d.height;
    else if(target<d.from && i>=target && i<d.from) shift=d.height;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
function jdDragEnd(){
  const d=JD_DRAG;
  if(!d) return;
  cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove', jdDragMove);
  window.removeEventListener('pointerup', jdDragEnd);
  window.removeEventListener('pointercancel', jdDragEnd);
  d.rows.forEach(r=>{ r.style.transform=''; });
  d.row.classList.remove('dragging');
  d.container.classList.remove('jdDragging');
  const {id, key, from, target, moved}=d;
  JD_DRAG=null;
  if(!moved || target===from) return;     // a click on the grip, or dropped home
  const list=JD_EDIT[key];
  if(!list || from<0 || from>=list.length || target<0 || target>=list.length) return;
  const [item]=list.splice(from,1);
  list.splice(target,0,item);
  renderWorkOrderModal(id);
}

/* Collapsed state lives outside the DOM because renderWorkOrderModal() rebuilds

   section the user had just folded away. The toggle itself only touches the two
   elements it owns, so folding a section does not re-render the modal or throw
   away the caret position in whatever field is being typed in. */
function toggleJDSection(key){

/* Turns a Firebase Storage error code into a plain explanation and the actual
   fix. The generic "check your Storage rules" message named a likely cause but
   gave nothing to act on; the code is what distinguishes a rules rejection
   from a wrong bucket from a blocked network. */
function docUploadErrorHTML(){
  if(!LAST_DOC_ERROR) return '';
  const code=LAST_DOC_ERROR.code||'';
  const cfg=(typeof getSyncConfig==='function' ? getSyncConfig() : null) || {};
  const bucket=cfg.storageBucket||'(none set)';
  // This app signs in with its own PIN, never Firebase Auth, so request.auth
  // is always null. Firebase's DEFAULT Storage rules require request.auth
  // != null, which rejects every upload, by far the most common cause here,
  // and it explains why Firestore sync can work while uploads don't.
  const openRules=
`rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /{allPaths=**} {
      allow read, write: if true;
    }
  }
}`;
  let title, body;
  if(code==='storage/unauthorized' || code==='storage/unauthenticated' || /permission|unauthor/i.test(LAST_DOC_ERROR.msg||'')){

function copyStorageRules(btn){
  const el=document.getElementById('ghStorageRules');
  if(!el) return;
  const done=()=>{ const t=btn.textContent; btn.textContent='Copied'; setTimeout(()=>{btn.textContent=t;},1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.textContent).then(done).catch(()=>toast('Select the rules and copy manually.'));
  } else {
    // Older mobile browsers have no async clipboard, fall back to a selection.
    const r=document.createRange(); r.selectNodeContents(el);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);

  }
}

function compressImageToBlob(file){
  // Downscales large photos to a reasonable max dimension and re-encodes as JPEG,
  // since phone camera photos are often 3-8MB and no reason to store them full-size.
  return new Promise((resolve)=>{
    if(!file.type.startsWith('image/') || file.type==='image/svg+xml'){ resolve(null); return; }
    const img=new Image();
    const reader=new FileReader();
    reader.onload=()=>{
      img.onload=()=>{
        const MAX_DIM=1600;
        let {width,height}=img;
        if(width>MAX_DIM || height>MAX_DIM){
          const scale=MAX_DIM/Math.max(width,height);
          width=Math.round(width*scale); height=Math.round(height*scale);
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        canvas.toBlob(blob=>resolve(blob), 'image/jpeg', 0.78);
      };
      img.onerror=()=>resolve(null);
      img.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
/* Details of the most recent failed upload, so the Docs tab can explain the
   cause instead of the user having to open the browser console. Cleared as
   soon as an upload succeeds. */
let LAST_DOC_ERROR=null;
const DOC_MAX_BYTES = 25*1024*1024; // 25MB per non-image file, generous now that it's real cloud storage
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve=>setTimeout(()=>resolve(null), ms))
  ]);
}
async function handleDocUpload(id, inputEl){
  const files=Array.from(inputEl.files||[]);
  if(!files.length) return;
  if(!syncStorage){ toast('Set up Multi-Device Sync first. Documents are stored in your Firebase project.'); inputEl.value=''; return; }
  const wo=getWO(id);
  const oversized=files.filter(f=>f.size>DOC_MAX_BYTES && !f.type.startsWith('image/'));
  if(oversized.length){
    toast(oversized.length===1
      ? `"${oversized[0].name}" is over the 25MB limit and was skipped.`
      : `${oversized.length} files were over the 25MB limit and were skipped.`);
  }
  const toProcess=files.filter(f=>f.type.startsWith('image/') || f.size<=DOC_MAX_BYTES);
  const statusEl=document.getElementById(`docUploadStatus_${wo.id}`);
  inputEl.disabled=true;
  let addedCount=0;
  const failed=[];
  try{
    for(const [i,file] of toProcess.entries()){
      // Files are now named automatically from the filename and uploaded
      // straight through. The old flow fired a blocking prompt() per file
      // before each upload, on a 10-photo batch that meant ten modal
      // interruptions, and a mis-tapped Cancel silently dropped the file.
      // Renaming is still one tap away on each row afterwards.
      const name=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim() || file.name;
      if(statusEl) statusEl.textContent=`Uploading "${name}"… (${i+1}/${toProcess.length})`;

      let blob=file;
      // HEIC/HEIF (common for iPhone camera photos) can't be decoded by <canvas> in most
      // browsers, which would otherwise hang compression forever, skip straight to raw upload.
      const isHeic=/heic|heif/i.test(file.type) || /\.(heic|heif)$/i.test(file.name);
      if(file.type.startsWith('image/') && !isHeic){
        try{
          const compressed = await withTimeout(compressImageToBlob(file), 8000);
          if(compressed) blob=compressed;
        }catch(e){ /* fall back to raw file below */ }
      }

      const docId='d'+Date.now()+Math.random().toString(36).slice(2,7);
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const storagePath=`docs/${wo.id}/${docId}_${safeName}`;
      try{
        const uploadTask = syncStorage.ref(storagePath).put(blob, {contentType: blob.type||file.type||undefined});
        const snapshot = await new Promise((resolve,reject)=>{
          const timer=setTimeout(()=>{
            reject(new Error('No response from Firebase after 30s. This is usually a CORS block, an ad-blocker/firewall blocking firebasestorage.googleapis.com, or the Storage bucket not fully finished provisioning yet.'));
          }, 30000);
          uploadTask.on('state_changed',
            (p)=>{ if(statusEl && p.totalBytes){ statusEl.textContent=`Uploading "${name}"… ${Math.round((p.bytesTransferred/p.totalBytes)*100)}%`; } },
            (err)=>{
              clearTimeout(timer);
              // Wrapping in a new Error dropped Firebase's .code, which is the
              // one field that identifies the cause, carry it across.
              const wrapped=new Error(`${err.code||'error'}: ${err.message||err}`);
              wrapped.code=err.code||'';
              reject(wrapped);
            },
            ()=>{ clearTimeout(timer); resolve(uploadTask.snapshot); }
          );
        });
        const url = await snapshot.ref.getDownloadURL();
        const ts=nowStamp();
        wo.docs.push({
          id: docId, name: name, type: file.type||'', size: blob.size,
          url, storagePath, uploadedBy: CURRENT_USER.displayName, date: ts.date, uploadedAt: Date.now()
        });
        DB.storageUsedBytes=(DB.storageUsedBytes||0)+blob.size;
        addedCount++;
      }catch(e){
        console.error(e);
        // The real Firebase error code (storage/unauthorized, storage/unknown,
        // …) is the only thing that identifies WHY an upload was rejected, and
        // it was previously visible only in the console. Keep it so the Docs
        // tab can name the cause and the fix.
        const rawMsg=(e && e.message) ? String(e.message) : String(e);
        // Some paths lose the code; it's still recoverable from the message.
        const codeMatch=rawMsg.match(/storage\/[a-z-]+/i);
        LAST_DOC_ERROR={
          code:(e && e.code) ? String(e.code) : (codeMatch ? codeMatch[0] : ''),
          msg:rawMsg,
          file:file.name
        };
        failed.push(file.name);
        if(statusEl) statusEl.textContent='';
      }
    }
  } finally {
    if(statusEl) statusEl.textContent='';
    inputEl.disabled=false;
  }
  if(addedCount){
    LAST_DOC_ERROR=null;
    await purgeStorageIfOverCap();
    saveDB(DB);
    renderWorkOrderModal(id);
    toast(addedCount>1 ? `${addedCount} documents uploaded. Tap Rename on any row to retitle it.` : 'Document uploaded. Tap Rename to retitle it.');
  }
  if(failed.length){
    toast(failed.length===1
      ? `Couldn't upload "${failed[0]}". See the details now shown in the Docs tab.`
      : `${failed.length} files failed to upload. See the details now shown in the Docs tab.`);
    renderWorkOrderModal(id);
  }
  inputEl.value='';
}
/* Safety net: if total Storage usage reaches the 5GB free-tier cap, automatically
   delete the oldest documents (across every work order) until back under it. */
async function purgeStorageIfOverCap(){
  if(!((DB.storageUsedBytes||0) >= STORAGE_CAP_BYTES)) return;
  let flat=[];
  DB.workOrders.forEach(wo=>(wo.docs||[]).forEach(d=>{ if(d.url) flat.push({wo, doc:d}); }));
  flat.sort((a,b)=>(a.doc.uploadedAt||0)-(b.doc.uploadedAt||0)); // oldest first
  const purgedNames=[];
  for(const {wo, doc} of flat){
    if((DB.storageUsedBytes||0) < STORAGE_CAP_BYTES) break;
    try{ await syncStorage.ref(doc.storagePath).delete(); }catch(e){ /* may already be gone, still clean up metadata */ }
    wo.docs=wo.docs.filter(d=>d.id!==doc.id);
    DB.storageUsedBytes=Math.max(0, (DB.storageUsedBytes||0)-(doc.size||0));
    wo.adminLog.unshift({text:`Auto-purged document "${doc.name}". 5GB storage cap reached.`, by:'System', date:nowStamp().date, time:nowStamp().time});
    purgedNames.push(doc.name);
  }
  if(purgedNames.length){
    toast(`Storage cap reached. Auto-purged ${purgedNames.length} oldest document(s) to stay under 5GB.`);
  }
}
function getDoc(wo, docId){ return (wo.docs||[]).find(d=>d.id===docId); }
function viewDoc(id, docId){
  const wo=getWO(id); const d=getDoc(wo, docId);

    if(!win) toast('Your browser blocked the popup. Allow popups for this site to view files.');

    w.document.write(`<title>${esc(d.name)}</title><body style="margin:0;background:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${esc(d.dataUrl)}" style="max-width:100%;max-height:100vh;"></body>`);
  } else {

  }
}
async function downloadDoc(id, docId){
  const wo=getWO(id); const d=getDoc(wo, docId);
  if(!d) return;
  if(d.url){
    try{
      const resp=await fetch(d.url);
      const blob=await resp.blob();
      const objUrl=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=objUrl; a.download=d.name||'document';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(objUrl);
    }catch(e){
      window.open(d.url, '_blank'); // fallback if fetch is blocked (CORS etc.)
    }
    return;
  }
  const a=document.createElement('a');
  a.href=d.dataUrl; a.download=d.name||'document';
  document.body.appendChild(a); a.click(); a.remove();
}
function renameDoc(id, docId){

function deleteDoc(id, docId){
  const wo=getWO(id); const d=wo && getDoc(wo, docId);

}

/* ---- Note draft autosave ----
   Protects against losing a typed-but-not-submitted note if someone
   gets interrupted, navigates away, or the tab closes. Stored per
   work order, cleared once the note is actually submitted. */
function noteDraftKey(id){ return 'gh_note_draft_'+id; }
function noteDraftFor(id){
  try{ return localStorage.getItem(noteDraftKey(id)) || ''; }catch(e){ return ''; }
}
function saveNoteDraft(id, text){
  try{
    if(text){ localStorage.setItem(noteDraftKey(id), text); }
    else{ localStorage.removeItem(noteDraftKey(id)); }
  }catch(e){}
}
function clearNoteDraft(id){
  try{ localStorage.removeItem(noteDraftKey(id)); }catch(e){}
}

function submitNote(id){
  const wo=getWO(id);
  const type=document.getElementById('noteType').value;
  const text=document.getElementById('noteText').value.trim();
  const followUpEl=document.getElementById('noteFollowUp');
  let followUp = null;
  if(followUpEl && followUpEl.value.trim()){
    followUp = parseFlexibleDate(followUpEl.value.trim());
    if(!followUp){
      followUpEl.classList.add('dateInvalid');
      followUpEl.focus();
      toast('That follow-up date doesn\'t look right. Try MM/DD/YYYY.');
      return;
    }
  }
  if(type==='PRESITE'){
    // Launch the pre-site inspection tool instead of logging plain text
    openPresiteTool(id);
    return;
  }
  if(!text){
    const ta=document.getElementById('noteText');
    if(ta) ta.focus();
    toast('Enter some note text before adding it.');
    return;
  }
  addNote(wo, type, text, followUp);
  clearNoteDraft(id);
  let movedMsg=null;
  if(type==='SCHD PRESITE' && inPresiteIncompleteList(wo)){
    wo.presiteScheduled=true;
    movedMsg='Moved to Pre-Site Scheduled.';
  } else if(type==='SCHD' && inScheduleJobList(wo)){
    wo.jobScheduled=true;
    movedMsg='Job scheduled. Moved to In Progress.';
  } else if(type==='SURVEY' && inSurveysList(wo)){

/* These used the browser's native confirm(), which looks nothing like the
   rest of the app, can't be styled, and is suppressed outright in some
   in-app browsers (silently deleting nothing, or everything). They now use
   the same askYesNo dialog as every other confirmation in the portal. */
/* A PRESITE note is the receipt for a walkthrough, and the walkthrough is
   what filled in Job Details. Deleting the note without clearing that data
   left a job carrying priced line items nobody could trace back to anything,
   so the two are removed together and the prompt says so before it happens. */
function clearPresiteData(wo){
  const jd=wo.jobDetails||(wo.jobDetails={});
  delete jd.presite;
  jd.labor=[]; jd.materials=[]; jd.tools=[];
  jd.issues=[]; jd.exclusions=[]; jd.disclaimers=[];
}
function adminDeleteNote(woId, idx){
  const wo=getWO(woId);
  if(!wo || !wo.notes[idx]) return;
  const note=wo.notes[idx];
  const isPresite = note.type==='PRESITE';
  const othersRemain = isPresite && wo.notes.some((n,i)=>i!==idx && n.type==='PRESITE');
  let question='Delete this note? This cannot be undone.';
  if(isPresite){
    question =
      'Delete this pre-site note?\n\n'+
      'This also erases everything the walkthrough produced on this work order: the pre-site summary and scope, and the Labor, Materials, Required Tools, Potential Issues, Exclusions and Disclaimers lists.\n\n'+
      'The typed job description, photos, documents, schedule dates and all other notes are kept. The job stays at its current stage.\n\n'+
      (othersRemain ? 'Note: this job has more than one pre-site note. The pre-site data is cleared regardless of which one you delete.\n\n' : '')+
      'This cannot be undone.';
  }
  askYesNo(question, (yes)=>{
    if(!yes) return;
    const n=wo.notes[idx];
    wo.notes.splice(idx,1);
    addAdminLog(wo, `Deleted a ${n.type} note ("${n.text}")`);
    if(isPresite){
      clearPresiteData(wo);
      addAdminLog(wo, 'Cleared the pre-site record and all walkthrough-generated job detail lists');
    }
    if(WO_EDIT_NOTE_IDX===idx) WO_EDIT_NOTE_IDX=null;
    else if(WO_EDIT_NOTE_IDX!==null && WO_EDIT_NOTE_IDX>idx) WO_EDIT_NOTE_IDX--;
    saveDB(DB); renderWorkOrderModal(woId); renderTabCounts(); renderMain();
    toast(isPresite ? 'Pre-site note and walkthrough data deleted.' : 'Note deleted.');
  }, isPresite ? {yes:'Delete pre-site data', no:'Cancel'} : undefined);
}
function adminDeleteWorkOrder(id){
  const wo=getWO(id);
  const label=(wo && wo.customer.name) ? `"${wo.customer.name}"` : 'this work order';
  askYesNo(`Delete ${label} and everything on it? This cannot be undone.`, (yes)=>{
    if(!yes) return;
    DB.workOrders=DB.workOrders.filter(w=>w.id!==id);
    clearNoteDraft(id);
    saveDB(DB); closeModal(); renderTabCounts(); renderMain();
    toast('Work order deleted.');
  });
}

/* True when the OS/browser is set to reduce motion. Checked at call time
   rather than cached, because the setting can be changed while the app is
   open and the app is long-lived on a work phone. */
function reducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
/* Hands the outgoing modal to #modalGhost so its exit animation can play out
   after modalRoot has already been emptied. IDs are stripped on the way over:
   for the ~220ms the ghost is alive it would otherwise be a second element in
   the document answering to the same id as anything the next modal renders. */
function ghostOutModal(root){
  if(reducedMotion()) return;
  const ghost=document.getElementById('modalGhost');
  if(!ghost || !root.firstElementChild) return;
  ghost.innerHTML='';
  while(root.firstElementChild) ghost.appendChild(root.firstElementChild);
  ghost.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  [...ghost.children].forEach(el=>el.classList.add('closing'));
  const token=(ghost.dataset.token=String(Date.now()+Math.random()));
  setTimeout(()=>{ if(ghost.dataset.token===token) ghost.innerHTML=''; }, 260);
}
/* True while a modal is on screen. Read by the observer below to tell a fresh
   presentation from an in-place re-render. closeModal() clears it
   synchronously so a close-then-immediately-open still animates. */
var MODAL_PRESENTED=false;
(function watchModalRoot(){
  const root=document.getElementById('modalRoot');
  if(!root || !window.MutationObserver) return;
  new MutationObserver(()=>{
    const child=root.firstElementChild;
    if(!child){ MODAL_PRESENTED=false; return; }
    if(MODAL_PRESENTED) child.classList.add('noAnim');
    else MODAL_PRESENTED=true;
  }).observe(root, {childList:true});
})();
function closeModal(){
  const root=document.getElementById('modalRoot');
  MODAL_PRESENTED=false;
  ghostOutModal(root);
  root.innerHTML='';
  detachHeaderCustOutsideClickHandler();
  hideAddressSuggestions();
  OPEN_WO_ID=null;
  WO_JOB_EDIT=false; JD_EDIT=null; WO_EDIT_NOTE_IDX=null;
  WO_CUST_EDIT=false; WO_ADMIN_VIEW=false; WO_DOCS_VIEW=false;
  WO_LIST_OPEN={};
  PRESITE_STATE=null;
  SCHED_WO_ID=null; SCHED_EDIT_ID=null; SCHED_PENDING=[]; SCHED_START=null; SCHED_END=null; SCHED_STIME=''; SCHED_ETIME=''; SCHED_REPEAT='none';
}
/* Toasts used to be individually position:fixed at the same coordinates, so
   two in quick succession landed exactly on top of each other and only the
   last one was legible. They now stack in a shared container. */
function toastContainer(){
  let c=document.getElementById('toastStack');
  if(!c){
    c=document.createElement('div');
    c.id='toastStack';
    document.body.appendChild(c);
  }
  return c;
}
function toast(msg){
  const c=toastContainer();
  // Don't repeat an identical message that's already on screen.
  if([...c.children].some(el=>el.dataset.msg===msg)) return;
  const t=document.createElement('div');
  t.className='toastItem';
  t.dataset.msg=msg;
  t.textContent=msg;
  t.setAttribute('role','status');
  c.appendChild(t);
  setTimeout(()=>{
    t.style.opacity='0';
    t.style.transform='translateY(14px) scale(.96)';
    setTimeout(()=>t.remove(), 240);
  }, 3200);
}

/* ---------- Engine helpers ---------------------------------------------- */
let PS_UID=1;
function psVal(v,a){ return typeof v==='function' ? (v(a)||[]) : (v||[]); }
function psItem(id){ return PS_ITEMS[id]; }
function psAddToScope(itemId, source, parentUid){
  const def=psItem(itemId); if(!def) return null;
  const row={uid:PS_UID++, itemId, source:source||'picked', parentUid:parentUid||null,
    ans:{qty: def.qty? def.qty.def : null, ask: def.askOpts? null : null, note:''}};
  PRESITE_STATE.scope.push(row);
  return row;
}
function psInScope(itemId){ return PRESITE_STATE.scope.some(r=>r.itemId===itemId); }
function psDismissed(itemId){ return PRESITE_STATE.dismissed.some(d=>d.itemId===itemId); }
function psRemoveFromScope(uid){
  PRESITE_STATE.scope = PRESITE_STATE.scope.filter(r=>r.uid!==uid && r.parentUid!==uid);
}

/* Open dependency prompts: deps of things in scope that are neither already
   in scope nor explicitly waved off. This is the omission catcher. */
function psOpenPrompts(){
  const out=[];
  PRESITE_STATE.scope.forEach(row=>{
    const def=psItem(row.itemId);
    (def.deps||[]).forEach(depId=>{
      if(psInScope(depId) || psDismissed(depId)) return;
      if(out.some(o=>o.itemId===depId)) return;
      out.push({itemId:depId, parentUid:row.uid, parentLabel:def.label});
    });
  });
  return out;
}

/* Readiness: how much of this scope is still unknown. */
function psReadiness(){
  let high=0, low=0; const open=[];
  PRESITE_STATE.scope.forEach(row=>{
    const def=psItem(row.itemId);
    if(def.askOpts && (row.ans.ask===null || row.ans.ask===undefined)){
      (def.risk||def.riskQ)?high++:low++; open.push(def.label+': question unanswered');
    } else if(def.askOpts && /unsure|not sure|unknown|did not check|cannot tell|suspected/i.test(String(row.ans.ask))){
      if(def.risk==='high'){ high++; open.push(def.label+': '+row.ans.ask); } else { low++; open.push(def.label+': '+row.ans.ask); }
    }
    if(def.qty && (!row.ans.qty || Number(row.ans.qty)<=0)){ high++; open.push(def.label+': quantity missing'); }
  });
  const openPrompts=psOpenPrompts().length;
  let level='ready', msg='Scope looks complete. Safe to build a fixed price estimate.';
  if(high>0 || openPrompts>2){ level='caution'; msg='Some unknowns remain. Review them before quoting a fixed price.'; }
  if(high>=3){ level='risk'; msg='Too many unknowns for a firm fixed price. Consider time and materials, an allowance, or a paid diagnostic visit.'; }
  return {level, msg, high, low, open, openPrompts};
}

/* ---------- Compile everything the estimator needs ---------------------- */
function psCompile(){
  const rates=getRates();
  const labor=[], mats=[], tools=[], issues=[], disc=[], excl=[];
  const pushL=(rateKey,qty)=>{
    const r=rates[rateKey]; if(!r) return;
    const q=Math.max(0,Number(qty)||0); if(q<=0) return;
    const found=labor.find(x=>x.rateKey===rateKey);
    if(found){ found.qty=Number(found.qty)+q; found.price='$'+(found.qty*found.unit).toFixed(2); return; }
    labor.push({item:r.label, qty:q, unit:r.price, price:'$'+(q*r.price).toFixed(2), rateKey, per:r.unit});
  };
  const pushM=(name,qty,cost)=>{
    const q=Math.max(0,Number(qty)||0); if(q<=0) return;
    const found=mats.find(x=>x.item===name);
    if(found){ found.qty=Number(found.qty)+q; found.price='$'+(found.qty*found.unit).toFixed(2); return; }
    mats.push({item:name, qty:q, unit:Number(cost)||0, price:'$'+(q*(Number(cost)||0)).toFixed(2)});
  };
  const pushS=(arr,v)=>{ (v||[]).forEach(s=>{ if(s && !arr.includes(s)) arr.push(s); }); };

  PRESITE_STATE.scope.forEach(row=>{
    const def=psItem(row.itemId); const a={...row.ans, qty:Number(row.ans.qty)||0};
    psVal(def.labor,a).forEach(([k,q])=>pushL(k,q));
    psVal(def.mats,a).forEach(([n,q,c])=>pushM(n,q,c));
    pushS(tools, psVal(def.tools,a));
    pushS(issues, psVal(def.issues,a));
    pushS(disc, psVal(def.disc,a));
    pushS(excl, psVal(def.excl,a));
  });

  /* Year-of-build stack */
  const yr=YEAR_RULES[PRESITE_STATE.yearBuilt]||YEAR_RULES.unknown;
  pushS(issues, yr.issues); pushS(disc, yr.disclaimers);

  /* Always-on */
  pushS(tools, BASE_TOOLS);
  pushS(disc, BASE_DISCLAIMERS);
  pushS(excl, BASE_EXCLUSIONS);

  /* Things the inspector explicitly waved off become exclusions so the
     estimator sees them instead of never hearing about them. */
  PRESITE_STATE.dismissed.forEach(d=>{
    const l=psItem(d.itemId); if(!l) return;
    const line='Not included: '+l.label+'. Waved off at the walkthrough'+(d.parentLabel?' ('+d.parentLabel+')':'')+'.';
    if(!excl.includes(line)) excl.push(line);
  });

  /* Job setup and cleanup, once, if there is any real scope */
  if(labor.length){ pushL('mobilize',1); pushL('cleanup',1); }

  return {labor, materials:mats, tools, issues, disclaimers:disc, exclusions:excl};
}

function psTotals(lists){
  const laborTotal = lists.labor.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unit)||0),0);
  const matsRaw    = lists.materials.reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.unit)||0),0);
  const markup     = Number(PRESITE_STATE.markup)||20;
  const taxRate    = Number(PRESITE_STATE.taxRate)||0;
  /* Markup and tax are BOTH calculated off the raw material cost, then the
     three figures are added together. Tax is not charged on the markup. */
  const markupAmt  = matsRaw*(markup/100);
  const tax        = matsRaw*(taxRate/100);
  const matsBilled = matsRaw + markupAmt + tax;
  return {laborTotal, matsRaw, markup, markupAmt, taxRate, tax, matsBilled, grand: laborTotal+matsBilled};
}
function psMoney(n){ return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* One step back, worked out from where you are rather than from a history
   stack, so it stays right no matter how you arrived. The two cases that are
   easy to get wrong: the item list's previous screen is the category list, not
   the previous stage, since both live inside 'pick'; and coming out of the
   scope screen has to return to whichever capture mode you actually used,
   otherwise a voice walkthrough drops you into the tap-through picker. */
function psBack(){
  const S=PRESITE_STATE;
  if(S.stage==='scope')       S.stage = S.mode==='voice' ? 'voice' : 'pick';
  else if(S.stage==='pick'){
    if(S.jobType)             S.jobType=null;
    else if(S.mode==='voice') S.stage='voice';
    else                      S.stage='start';
  }
  else if(S.stage==='voice')  S.stage='start';
  else if(S.stage==='review') S.stage='scope';
  else                        S.stage='start';
  renderPresiteBody();
}

function psStartRec(){
  const S=PRESITE_STATE;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('This browser cannot access the microphone.'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    PS_CHUNKS=[];
    try{ PS_REC=new MediaRecorder(stream); }catch(e){ toast('Recording is not supported here.'); return; }
    PS_REC.ondataavailable=e=>{ if(e.data && e.data.size) PS_CHUNKS.push(e.data); };
    PS_REC.onstop=()=>{
      const blob=new Blob(PS_CHUNKS,{type:PS_REC.mimeType||'audio/webm'});
      PRESITE_STATE.audioURL=URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      renderPresiteBody();
    };
    PS_REC.start();
    S.recording=true;
    if(psSpeechSupported()){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      PS_SR=new SR(); PS_SR.continuous=true; PS_SR.interimResults=false; PS_SR.lang='en-US';
      PS_SR.onresult=e=>{
        let add='';
        for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) add+=e.results[i][0].transcript+' '; }
        if(add){
          PRESITE_STATE.transcript=(PRESITE_STATE.transcript+' '+add).trim();
          const ta=document.getElementById('psTrans'); if(ta) ta.value=PRESITE_STATE.transcript;
        }
      };
      PS_SR.onerror=()=>{};
      PS_SR.onend=()=>{ if(PRESITE_STATE.recording){ try{PS_SR.start();}catch(e){} } };
      try{ PS_SR.start(); }catch(e){}
    }
    renderPresiteBody();
  }).catch(()=>toast('Microphone permission was denied.'));
}
function psStopRec(){
  PRESITE_STATE.recording=false;
  try{ if(PS_SR){ PS_SR.onend=null; PS_SR.stop(); } }catch(e){}
  try{ if(PS_REC && PS_REC.state!=='inactive') PS_REC.stop(); }catch(e){}
  renderPresiteBody();
}
function psScanTranscript(){
  const t=(PRESITE_STATE.transcript||'').toLowerCase();
  if(!t.trim()){ toast('Nothing recorded or typed yet.'); return; }
  let hits=0;
  Object.keys(PS_KEYWORDS).forEach(id=>{
    if(psInScope(id)) return;
    if(PS_KEYWORDS[id].some(k=>t.includes(k))){ psAddToScope(id,'voice'); hits++; }
  });
  /* pull numbers out only as a starting quantity, never as scope */
  PRESITE_STATE.stage='scope';
  renderPresiteBody();
  toast(hits? hits+' item'+(hits===1?'':'s')+' suggested. Confirm, correct or remove each one.' : 'No items matched. Add them from the picker.');
}

/* ---------- Save back to the work order ---------------------------------- */
function psFinish(){
  const S=PRESITE_STATE, wo=getWO(S.woId), L=S.lists, T=psTotals(L), rd=psReadiness();
  const jd=wo.jobDetails;

  const scopeText = S.scope.map(r=>{
    const d=psItem(r.itemId);
    const bits=[d.label];
    if(d.qty && r.ans.qty) bits.push(r.ans.qty+' '+d.qty.unit);
    if(d.askOpts && r.ans.ask) bits.push(r.ans.ask);
    if(r.ans.note) bits.push(r.ans.note);
    return bits.join(', ');
  }).join('\n');

  /* The generated scope wording used to be written straight into
     jd.description, which meant finishing a walkthrough silently erased
     whatever the office had typed there. It lives on the presite record now
     and renders as its own section, so the two no longer compete. */

  jd.labor       = L.labor.filter(x=>x.item && x.item.trim());
  jd.materials   = L.materials.filter(x=>x.item && x.item.trim());
  jd.tools       = L.tools.filter(x=>String(x).trim());
  jd.issues      = L.issues.filter(x=>String(x).trim());
  jd.disclaimers = L.disclaimers.filter(x=>String(x).trim());
  jd.exclusions  = L.exclusions.filter(x=>String(x).trim());

  jd.presite = {
    capturedAt: new Date().toISOString(),
    mode: S.mode,
    yearBuilt: S.yearBuilt,
    jobType: S.jobType,
    transcript: S.transcript || '',
    scopeText: scopeText,
    scope: S.scope.map(r=>({item:psItem(r.itemId).label, itemId:r.itemId, ...r.ans, source:r.source})),
    wavedOff: S.dismissed.map(d=>({item:(psItem(d.itemId)||{}).label||d.itemId, from:d.parentLabel})),
    readiness: {level:rd.level, message:rd.msg, open:rd.open},
    totals: {
      labor: Math.round(T.laborTotal*100)/100,
      materialsCost: Math.round(T.matsRaw*100)/100,
      markupPct: T.markup,
      markupAmount: Math.round(T.markupAmt*100)/100,
      taxPct: T.taxRate,
      tax: Math.round(T.tax*100)/100,
      materialsBilled: Math.round(T.matsBilled*100)/100,
      grandTotal: Math.round(T.grand*100)/100
    }
  };

  const lines=[
    'Pre-site inspection complete.',
    'Labor '+psMoney(T.laborTotal)+', materials '+psMoney(T.matsBilled)+' (cost '+psMoney(T.matsRaw)+' plus '+T.markup+'% markup '+psMoney(T.markupAmt)+' plus tax '+psMoney(T.tax)+'). Total '+psMoney(T.grand)+'.',
    'Readiness: '+rd.level+'. '+rd.msg
  ];
  if(S.dismissed.length) lines.push('Waved off at walkthrough: '+S.dismissed.map(d=>(psItem(d.itemId)||{}).label||d.itemId).join('; ')+'.');
  addNote(wo,'PRESITE', lines.join(' '));

  saveDB(DB);
  PRESITE_STATE=null;
  closeModal();
  advanceStage(wo.id, w=>{ w.presiteDone=true; }, 'Pre-site saved. Job moved to Estimates.');
}

/* =========================================================================
   AUTOFILL: push pre-site job data into the estimate/invoice builder iframe.
   The builder app (separate site) must add a message listener that receives
   this payload and populates its own fields, while keeping every field
   editable (set .value, never disabled/readonly) until Generate is clicked.
========================================================================= */
/* Parse a price string like "$8–$15", "$120", "TBD", "included in job labor", "n/a"
   into a [low, high] numeric range. Non-numeric entries return null and are
   excluded from the materials total (their cost is unknown/non-billed). */
function parsePriceRange(str){
  if(!str) return null;
  // Only "$"-prefixed figures count. The old version grabbed every number in
  // the string, so "$14–$22 per 4x8 sheet" parsed as a $4–$22 range and
  // "$35–$65 per 50 ft" as $35–$65... or worse. Descriptive units are ignored.
  let nums = String(str).match(/\$\s*[\d,]+(?:\.\d+)?/g);
  if(nums && nums.length){
    nums = nums.map(n=>n.replace(/[$\s]/g,''));
  } else {
    // No currency symbol at all (e.g. "120" or "TBD"), fall back to a leading
    // bare number only, never numbers embedded in trailing unit text.
    const m = String(str).match(/^\s*([\d,]+(?:\.\d+)?)\s*(?:[-–to]+\s*([\d,]+(?:\.\d+)?))?/);
    if(!m) return null;
    nums = [m[1]]; if(m[2]) nums.push(m[2]);
  }
  const vals = nums.map(n=>parseFloat(n.replace(/,/g,''))).filter(v=>!isNaN(v));
  if(!vals.length) return null;
  return [Math.min(...vals), Math.max(...vals)];
}

/* California statewide base sales tax rate. Local district add-ons vary by
   jurisdiction and aren't accounted for here, this uses the base rate. */
const CA_SALES_TAX_RATE = 0.0725;

/* Sum every priced material into a single low/high range, then combine three
   pieces into one final number: the raw materials sum, a 20% markup
   (waste/overage/handling) on that sum, and CA sales tax calculated on the
   raw materials sum (before the markup is added). Returns one combined line
   item labeled "Materials" instead of the individual entries. */
function buildMaterialsLineItem(materials, presite){
  const fmt = n => '$' + n.toFixed(2).replace(/\.00$/,'');
  /* Pre-site v2 already computed this exactly: cost, then markup, then tax on
     the marked-up figure. Prefer it over re-deriving from price strings. */
  if(presite && presite.totals && presite.totals.materialsBilled!==undefined){
    /* materialsBilled already equals cost + markup + tax. */
    return [{ item:'Materials', price: fmt(Number(presite.totals.materialsBilled)||0) }];
  }
  /* Fallback for older work orders. Sum qty x unit where available, otherwise
     fall back to parsing the price string. */
  let lowSum=0, highSum=0, any=false;
  (materials||[]).forEach(m=>{
    if(m && m.qty!==undefined && m.unit!==undefined && !isNaN(Number(m.unit))){
      const v=(Number(m.qty)||0)*(Number(m.unit)||0);
      if(v>0){ any=true; lowSum+=v; highSum+=v; return; }
    }
    const range = parsePriceRange(m && m.price);
    if(range){ any=true; lowSum+=range[0]; highSum+=range[1]; }
  });
  if(!any) return [];
  /* Markup and tax are both taken off the raw cost, then added to it. */
  const lowFinal   = lowSum  * (1 + 0.2 + CA_SALES_TAX_RATE);
  const highFinal  = highSum * (1 + 0.2 + CA_SALES_TAX_RATE);
  const price = (Math.round(lowFinal*100)===Math.round(highFinal*100))
    ? fmt(lowFinal)
    : `${fmt(lowFinal)}\u2013${fmt(highFinal)}`;
  return [{ item:'Materials', price }];
}

/* Labor for the estimate builder.
   Every detail line goes over with hideDetails set, so the builder checks
   its "hide qty, unit price & subtotal" box and the customer sees the scope
   wording only. One visible summary line carrying the sum is appended last,
   so it lands immediately before the Materials line. */
function buildLaborLineItems(labor){
  const lines=(labor||[]).filter(l=>l && (l.item||'').trim());
  if(!lines.length) return [];
  const fmt = n => '$' + (Number(n)||0).toFixed(2);
  let total=0;
  const out=lines.map(l=>{
    const qty=Number(l.qty)||0, unit=Number(l.unit)||0;
    let sub=qty*unit;
    if(!sub){
      const r=parsePriceRange(l.price);
      if(r) sub=(r[0]+r[1])/2;
    }
    total+=sub;
    /* Detail lines carry the scope wording and the quantity, but no money.
       The builder sums every line it receives, so pricing the detail lines
       AND the summary line would double the labor total. The real per-line
       rates stay in the portal, which is where they get edited. */
    return {
      item: l.item,
      qty: qty||1,
      unitPrice: 0,
      price: fmt(0),
      subtotal: fmt(0),
      hideDetails: true,      // check "hide qty, unit price & subtotal"
      hideQty: true, hideUnitPrice: true, hideSubtotal: true,
      internalRate: unit,     // kept for reference, ignored by the builder
      internalSubtotal: sub
    };
  });
  out.push({
    item:'Labor',
    qty:1, unitPrice:total,
    price: fmt(total), subtotal: fmt(total),
    hideDetails:false,
    hideQty:false, hideUnitPrice:false, hideSubtotal:false,
    isSummary:true
  });
  return out;
}
function sendJobDataToBuilder(iframeEl, id, kind){
  const wo=getWO(id);
  if(!wo) return;
  const jd=wo.jobDetails||{};
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  const addr = splitAddress(wo.customer.address||'');
  const payload={
    source:'gh_portal',
    type:'presite_data',
    workOrderId:wo.id,
    date: dateStr,
    customer:{
      name:wo.customer.name,
      phone:wo.customer.phone,
      altPhone:wo.customer.altPhone||'',
      homeownerName:wo.customer.homeownerName||'',
      homeownerPhone:wo.customer.homeownerPhone||'',
      // The builder's Bill To block has its own email field. It was never
      // populated because the payload simply didn't carry one.
      email:wo.customer.email||'',
      // Full single-line address is still sent for any builder field that
      // wants it whole, but the parsed pieces are sent alongside it so the
      // builder can drop street / city / state / zip into separate inputs
      // instead of dumping everything onto line 1.
      address:wo.customer.address,
      addressLine1:addr.line1,
      addressLine2:addr.line2,
      street:addr.street,
      unit:addr.unit,
      city:addr.city,
      state:addr.state,
      zip:addr.zip
    },
    /* The builder's description field used to receive the walkthrough wording
       because the pre-site wrote it into jd.description. Now that the two are
       stored separately, send both, typed description first, so the generated
       document reads the same as it did before. */
    description: [jd.description||'', psScopeLines(jd.presite).join('\n')].filter(s=>s.trim()).join('\n\n'),
    labor: buildLaborLineItems(jd.labor),
    laborDetail: jd.labor||[],
    materials: buildMaterialsLineItem(jd.materials, jd.presite),
    issues: jd.issues||[],
    exclusions: jd.exclusions||[],
    disclaimers: jd.disclaimers||[],
    totals: (jd.presite && jd.presite.totals) || null
  };
  try{
    // Tell the builder to wipe any prior estimate before this work order's
    // data is generated over, then send the fresh data right behind it.
    iframeEl.contentWindow.postMessage({source:'gh_portal', type:'clear_estimate', workOrderId:wo.id}, '*');
    setTimeout(()=>{
      try{ iframeEl.contentWindow.postMessage(payload, '*'); }catch(e){}
      // The estimate/invoice builder is one unified app with tabs, tell it
      // which tab to land on so opening "Invoice" doesn't leave the visitor
      // sitting on the Estimate tab.
      if(kind==='invoice'){
        try{ iframeEl.contentWindow.postMessage({source:'gh_portal', type:'switch_tab', tab:'invoice', workOrderId:wo.id}, '*'); }catch(e){}
      }
    }, 50);
  }catch(e){ /* builder may not be ready yet; ignore */ }
}

function positionTabsBar(){

  if(window.innerWidth<=900){
    // On phones/tablets the tab bar lives in a fixed strip along the
    // bottom of the screen (see the <=900px media query), so it should
    // not also be pinned under the header.
    if(wrap) wrap.style.top='';
    return;
  }
  if(header && wrap){ wrap.style.top = header.offsetHeight + 'px'; }
}
window.addEventListener('load', positionTabsBar);
document.addEventListener('DOMContentLoaded', positionTabsBar);

/* ---- Accessibility settings menu (gear icon, upper right) ----
   Houses the text-size control and high-contrast toggle in one
   dropdown instead of separate always-visible buttons. */
function toggleSettingsMenu(menuId){
  const menu = document.getElementById(menuId);
  if(!menu) return;
  const isOpen = menu.classList.contains('open');
  document.querySelectorAll('.settingsMenu.open').forEach(m=>m.classList.remove('open'));
  document.querySelectorAll('.settingsBtn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(!isOpen){
    menu.classList.add('open');
    const btn = menu.previousElementSibling;
    if(btn) btn.setAttribute('aria-expanded','true');
  }
}
function closeSettingsMenus(){
  document.querySelectorAll('.settingsMenu.open').forEach(m=>m.classList.remove('open'));
  document.querySelectorAll('.settingsBtn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}

/* ---- Adjustable text size (mobile) ----
   Five steps, Small / Normal / Large / Extra Large / Extra Extra Large,
   covering the whole app at once: --mScale feeds the mobile stylesheet's
   base font size and --dScale the desktop one, both set together from a
   single stored setting. Defaults to the largest size for readability; the
   Aa button steps it down (and wraps back around) from there. Persisted so
   it's remembered next visit. */
var TEXT_SIZES = [15, 18, 21, 25, 29];
/* Matching desktop baselines. A phone is held close and needs a larger base
   than a monitor at arm's length, so the two ladders aren't the same numbers,
   but they step together, one index at a time, from a single stored setting. */
var TEXT_SIZES_DESKTOP = [14, 16, 18, 21, 24];
var TEXT_SIZE_NAMES = ['Small', 'Normal', 'Large', 'Extra Large', 'Extra Extra Large'];
var TEXT_SIZE_BTN_SCALE = [0.75, 0.9, 1.05, 1.2, 1.35];
var DEFAULT_TEXT_SIZE = TEXT_SIZES[TEXT_SIZES.length-1];
function applyTextSize(px){
  var idx = TEXT_SIZES.indexOf(px);
  if(idx<0) idx = 0;
  // --mScale drives the mobile stylesheet, --dScale the desktop one, so the
  // control resizes the whole app on every screen rather than phones only.
  document.documentElement.style.setProperty('--mScale', px + 'px');
  document.documentElement.style.setProperty('--dScale', TEXT_SIZES_DESKTOP[idx] + 'px');
  var name = TEXT_SIZE_NAMES[idx];
  ['textSizeBtn','loginTextSizeBtn'].forEach(function(id){
    var b = document.getElementById(id);
    if(b){
      b.style.fontSize = TEXT_SIZE_BTN_SCALE[idx] + 'em';
      b.title = 'Text size: ' + name + ' (tap to change)';
    }
  });
}
function cycleTextSize(){
  var current = parseInt(localStorage.getItem('gh_text_scale'), 10) || DEFAULT_TEXT_SIZE;
  var idx = TEXT_SIZES.indexOf(current);
  if(idx<0) idx = TEXT_SIZES.length-1;
  var next = TEXT_SIZES[(idx - 1 + TEXT_SIZES.length) % TEXT_SIZES.length];
  localStorage.setItem('gh_text_scale', next);
  applyTextSize(next);
}
applyTextSize(parseInt(localStorage.getItem('gh_text_scale'), 10) || DEFAULT_TEXT_SIZE);

/* ---- High contrast mode ----
   Toggled by the "High Contrast" button in the header (login screen
   and app screen). Adds/removes an "hc" class on <html>, which the
   stylesheet uses to override the color variables everything else
   already reads from. Persisted so it's remembered next visit. */
var HC_KEY = 'gh_high_contrast';
function applyHighContrast(on){
  document.documentElement.classList.toggle('hc', !!on);
  ['contrastBtn','loginContrastBtn'].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function toggleHighContrast(){
  var on = document.documentElement.classList.contains('hc');
  var next = !on;
  localStorage.setItem(HC_KEY, next ? '1' : '0');
  applyHighContrast(next);
}
applyHighContrast(localStorage.getItem(HC_KEY) === '1');

/* ---- Dark mode ----
   Manual only, by design: this is a work tool used in trucks, garages and
   customer kitchens, and a phone flipping the whole board to dark because
   the sun went down mid-job is worse than the user deciding once. Same
   mechanism as high contrast, a class on <html> that the stylesheet's
   variable overrides hang off, so nothing else in the app needs to know. */
var DARK_KEY = 'gh_dark_mode';
function applyDarkMode(on){
  document.documentElement.classList.toggle('dark', !!on);
  ['darkBtn','loginDarkBtn'].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  /* Keeps the phone's own status bar and browser chrome in step with the
     app, which is most of what makes a dark web app stop looking like a
     bright page in a dark frame. */
  var meta = document.querySelector('meta[name="theme-color"]');
  if(!meta){
    meta = document.createElement('meta');
    meta.setAttribute('name','theme-color');
    document.head.appendChild(meta);
  }
  meta.setAttribute('content', on ? '#101a2b' : '#0f2647');
}
function toggleDarkMode(){
  var on = document.documentElement.classList.contains('dark');
  localStorage.setItem(DARK_KEY, on ? '0' : '1');
  applyDarkMode(!on);
}
applyDarkMode(localStorage.getItem(DARK_KEY) === '1');

/* Browsers without HTMLInputElement.showPicker (Safari before 16, Firefox
   before 101) can't be driven programmatically, so they fall back to the
   native calendar-indicator hit area, which the stylesheet stretches to
   cover the whole button once this class is set. */
if(typeof HTMLInputElement==='undefined' || !('showPicker' in HTMLInputElement.prototype)){
  document.documentElement.classList.add('no-showpicker');
}

/* ---- Header elevation on scroll ----
   The top slab is flat until there is something underneath it, then it picks
   up a shadow, the way a native large-title bar does. Passive listener and a
   class toggle only, so it costs nothing on a long board. */
(function trackScrollElevation(){
  var apply = function(){
    document.body.classList.toggle('scrolled', window.scrollY > 4);
  };
  window.addEventListener('scroll', apply, {passive:true});
  window.addEventListener('resize', apply, {passive:true});
  apply();
})();
window.addEventListener('resize', positionTabsBar);
window.addEventListener('orientationchange', positionTabsBar);
/* The header can change height when the badge wraps, which is why this used to

/* Escape now closes whatever is on top: the yes/no confirm first, then any

/* =========================================================================
   DIALOG SEMANTICS + FOCUS TRAP
   Modals are built by writing HTML into #modalRoot / #confirmRoot from about
   forty different places. Rather than repeating the same three attributes in
   forty template strings (and missing one), an observer marks whatever gets
   rendered. Escape-to-close was already handled further up; this adds the
   parts a screen reader and a keyboard need: the dialog role, the modal flag,
   and Tab that cycles inside the dialog instead of wandering off into the
   board behind it.
========================================================================= */
const FOCUSABLE_SEL='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
let LAST_FOCUS_BEFORE_MODAL=null;

function markDialogs(root){
  root.querySelectorAll('.modal, .confirmCard').forEach(el=>{
    if(el.getAttribute('role')==='dialog') return;
    el.setAttribute('role','dialog');
    el.setAttribute('aria-modal','true');
    // Prefer the modal's own heading as its accessible name; fall back to a
    // generic one so it is never announced as just "dialog".
    const h=el.querySelector('h2,h3,h4');
    if(h){
      if(!h.id) h.id='dlgTitle_'+Math.random().toString(36).slice(2,8);
      el.setAttribute('aria-labelledby', h.id);
    } else {
      el.setAttribute('aria-label','Dialog');
    }
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','-1');
  });
}
function topmostDialog(){
  const roots=[document.getElementById('confirmRoot'), document.getElementById('modalRoot')];
  for(const r of roots){
    if(!r) continue;
    const d=r.querySelector('[role="dialog"]');
    if(d) return d;
  }
  return null;
}
['modalRoot','confirmRoot'].forEach(id=>{
  const root=document.getElementById(id);
  if(!root) return;
  new MutationObserver(()=>{
    const had=!!LAST_FOCUS_BEFORE_MODAL;
    markDialogs(root);
    const dlg=topmostDialog();
    if(dlg){
      if(!had && document.activeElement && document.activeElement!==document.body){
        LAST_FOCUS_BEFORE_MODAL=document.activeElement;
      }
      // Only move focus if it is not already inside the dialog, so a modal
      // that re-renders itself mid-edit does not yank the caret out of the
      // field being typed in.
      if(!dlg.contains(document.activeElement)){
        const first=dlg.querySelector(FOCUSABLE_SEL);
        (first||dlg).focus({preventScroll:true});
      }
    } else if(had){
      // Everything closed: hand focus back to whatever opened it.
      const back=LAST_FOCUS_BEFORE_MODAL;
      LAST_FOCUS_BEFORE_MODAL=null;
      if(back && document.contains(back)) { try{ back.focus({preventScroll:true}); }catch(e){} }
    }
  }).observe(root, {childList:true, subtree:true});
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Tab') return;
  const dlg=topmostDialog();
  if(!dlg) return;
  const items=[...dlg.querySelectorAll(FOCUSABLE_SEL)].filter(el=>el.offsetParent!==null || el===document.activeElement);
  if(!items.length){ e.preventDefault(); dlg.focus({preventScroll:true}); return; }
  const first=items[0], last=items[items.length-1];
  if(e.shiftKey && (document.activeElement===first || !dlg.contains(document.activeElement))){
    e.preventDefault(); last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault(); first.focus();
  }
});

/* =========================================================================
   SESSION RECOVERY

   Phones evict backgrounded tabs. When that happens the whole page restarts
   and everything held in memory is gone: which tab you were on, which work
   order was open, and any text typed into a field but not yet saved. This
   layer keeps a rolling copy of all of that in the browser's own storage and
   puts it back on the next load, before anything is painted, so a restart is
   invisible rather than a lost note.

   It stores nothing that isn't already on this device, and it never stores
   password fields.
========================================================================= */
const SR_KEY='gh_session_v1';
const SR_MAX_AGE=6*60*60*1000;   // older than this is stale, not a draft
let SR_RESTORING=false;
let SR_OPENER=null;              // {fn, args} for the modal currently on screen

function srScope(el){
  const root=document.getElementById('modalRoot');
  return (root && root.contains(el)) ? 'm' : 'a';
}
/* A stable name for a field. Ids are used where they exist; everything else
   gets a position path, which survives a re-render of the same markup. */
function srKey(el){
  if(el.id) return srScope(el)+':#'+el.id;
  const parts=[];
  let n=el;
  while(n && n.nodeType===1 && n!==document.body && parts.length<12){
    const p=n.parentNode;
    if(!p) break;
    const idx=Array.prototype.indexOf.call(p.children, n);
    parts.unshift(n.tagName+idx);
    if(p.id){ parts.unshift('#'+p.id); break; }
    n=p;
  }
  return srScope(el)+':'+parts.join('/');
}
function srFields(){
  return [...document.querySelectorAll('input, textarea, select')].filter(el=>{
    if(el.type==='password' || el.type==='file' || el.type==='hidden') return false;
    if(el.dataset && el.dataset.nodraft==='1') return false;
    if(el.autocomplete==='current-password' || el.autocomplete==='new-password') return false;
    return true;
  });
}
function srRead(){
  try{
    const raw=localStorage.getItem(SR_KEY);
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj || (Date.now()-(obj.at||0))>SR_MAX_AGE) return null;
    return obj;
  }catch(e){ return null; }
}
/* Blob URLs and live recorder flags do not survive a reload, so they are
   dropped rather than restored into a broken state. */
function srPresiteSnapshot(){
  if(!PRESITE_STATE) return null;
  try{
    const c=JSON.parse(JSON.stringify(PRESITE_STATE));
    c.audioURL=null;
    c.recording=false;
    return c;
  }catch(e){ return null; }
}
function srSave(){
  if(SR_RESTORING || !CURRENT_USER) return;
  const fields={};
  srFields().forEach(el=>{
    const k=srKey(el);
    if(el.type==='checkbox' || el.type==='radio') fields[k]=!!el.checked;
    else if(el.value!=='' && el.value!=null) fields[k]=el.value;
  });
  const data={
    at:Date.now(),
    user:CURRENT_USER.username,
    tab:ACTIVE_TAB,
    scroll:window.scrollY||0,
    fields,
    opener:SR_OPENER,
    state:{
      OPEN_WO_ID, WO_CUST_EDIT, WO_ADMIN_VIEW, WO_JOB_EDIT, JD_EDIT,
      WO_DOCS_VIEW, WO_EDIT_NOTE_IDX, WO_LIST_OPEN, DOC_TAG_FILTER,
      PRESITE_STATE:srPresiteSnapshot(), PS_UID,
      SCHED_WO_ID, SCHED_EDIT_ID, SCHED_TYPE, SCHED_START, SCHED_END,
      SCHED_STIME, SCHED_ETIME, SCHED_REPEAT, SCHED_PENDING
    }
  };
  try{
    const s=JSON.stringify(data);
    // Never let a runaway draft crowd out the actual portal data.
    if(s.length>400000) return;
    localStorage.setItem(SR_KEY, s);
  }catch(e){}
}
let SR_TIMER=null;
function srSaveSoon(){
  clearTimeout(SR_TIMER);
  SR_TIMER=setTimeout(srSave, 250);
}
function srClearModalPart(){
  SR_OPENER=null;
  const cur=srRead();
  if(!cur) return;
  Object.keys(cur.fields||{}).forEach(k=>{ if(k.charAt(0)==='m') delete cur.fields[k]; });
  cur.opener=null;
  cur.at=Date.now();
  try{ localStorage.setItem(SR_KEY, JSON.stringify(cur)); }catch(e){}
}
function srApplyFields(scope){
  const data=srRead();
  if(!data || !data.fields) return;
  SR_RESTORING=true;
  srFields().forEach(el=>{
    const k=srKey(el);
    if(scope && k.charAt(0)!==scope) return;
    if(!(k in data.fields)) return;
    const v=data.fields[k];
    if(el.type==='checkbox' || el.type==='radio'){
      if(el.checked===!!v) return;
      el.checked=!!v;
    } else {
      if(el.value===v) return;
      el.value=v;
    }
    // Fire the same events typing would, so previews and counters update.
    try{
      el.dispatchEvent(new Event('input', {bubbles:true}));
      el.dispatchEvent(new Event('change', {bubbles:true}));
    }catch(e){}
  });
  SR_RESTORING=false;
}
/* Puts the screen back exactly as it was. Runs inside enterApp, before the
   boot cover comes down, so none of this is visible as a flicker. */
function restoreSession(){
  const data=srRead();
  if(!data) return;
  if(!CURRENT_USER || data.user!==CURRENT_USER.username){
    try{ localStorage.removeItem(SR_KEY); }catch(e){}
    return;
  }
  SR_RESTORING=true;
  try{
    const st=data.state||{};
    WO_CUST_EDIT=!!st.WO_CUST_EDIT; WO_ADMIN_VIEW=!!st.WO_ADMIN_VIEW;
    WO_JOB_EDIT=!!st.WO_JOB_EDIT; JD_EDIT=st.JD_EDIT==null?null:st.JD_EDIT;
    WO_DOCS_VIEW=!!st.WO_DOCS_VIEW;
    WO_EDIT_NOTE_IDX=st.WO_EDIT_NOTE_IDX==null?null:st.WO_EDIT_NOTE_IDX;
    WO_LIST_OPEN=st.WO_LIST_OPEN||{};
    DOC_TAG_FILTER=st.DOC_TAG_FILTER||'all';
    SCHED_WO_ID=st.SCHED_WO_ID==null?null:st.SCHED_WO_ID;
    SCHED_EDIT_ID=st.SCHED_EDIT_ID==null?null:st.SCHED_EDIT_ID;
    SCHED_TYPE=st.SCHED_TYPE||'full';
    SCHED_START=st.SCHED_START==null?null:st.SCHED_START;
    SCHED_END=st.SCHED_END==null?null:st.SCHED_END;
    SCHED_STIME=st.SCHED_STIME||''; SCHED_ETIME=st.SCHED_ETIME||'';
    SCHED_REPEAT=st.SCHED_REPEAT||'none';
    SCHED_PENDING=Array.isArray(st.SCHED_PENDING)?st.SCHED_PENDING:[];
    PS_UID=st.PS_UID||1;

    // Re-open whatever was on screen. The pre-site tool and the work order
    // modal have their own renderers, which keep the finer state above; any
    // other modal is re-opened by replaying the call that opened it.
    if(st.PRESITE_STATE && getWO(st.PRESITE_STATE.woId)){
      PRESITE_STATE=st.PRESITE_STATE;
      psInjectCSS();
      renderPresiteModal();
    } else if(st.OPEN_WO_ID!=null && getWO(st.OPEN_WO_ID)){
      OPEN_WO_ID=st.OPEN_WO_ID;
      renderWorkOrderModal(st.OPEN_WO_ID);
    } else if(data.opener && typeof window[data.opener.fn]==='function'){
      window[data.opener.fn].apply(null, data.opener.args||[]);
    }
  }catch(e){
    console.warn('Session restore skipped:', e);
  }
  SR_RESTORING=false;

  srApplyFields(null);
  if(typeof data.scroll==='number'){
    setTimeout(()=>window.scrollTo({top:data.scroll, behavior:'auto'}), 0);
  }
}

/* Every function that opens a modal is wrapped so the app knows how to
   re-open it later. Only plain arguments are recorded; anything taking a
   callback (the yes/no prompts) is skipped, and confirmations are not worth
   restoring anyway. */
(function(){
  const SKIP=/^(openDataConnection|openSyncModal)$/;
  const plain=v=>v===null || ['string','number','boolean'].includes(typeof v);
  const modalOpen=()=>{
    const r=document.getElementById('modalRoot');
    return !!(r && r.innerHTML.trim()!=='');
  };
  Object.getOwnPropertyNames(window).forEach(name=>{
    if(!/^open[A-Z]/.test(name) || SKIP.test(name)) return;
    let fn;
    try{ fn=window[name]; }catch(e){ return; }
    if(typeof fn!=='function' || fn.__srWrapped) return;
    const wrapped=function(){
      const args=Array.prototype.slice.call(arguments);
      const out=fn.apply(this, args);
      try{
        if(modalOpen() && args.every(plain)){
          SR_OPENER={fn:name, args};
          srSaveSoon();
        }
      }catch(e){}
      return out;
    };
    wrapped.__srWrapped=true;
    try{ window[name]=wrapped; }catch(e){}
  });

  // Closing a modal deliberately means those drafts are finished with,
  // whether it was saved or cancelled.
  if(typeof window.closeModal==='function' && !window.closeModal.__srWrapped){
    const orig=window.closeModal;
    const wrapped=function(){
      const out=orig.apply(this, arguments);
      try{ srClearModalPart(); srSaveSoon(); }catch(e){}
      return out;
    };
    wrapped.__srWrapped=true;
    window.closeModal=wrapped;
  }

  // Signing out clears the lot; a shared phone should not hand the next
  // person someone else's half-written note.
  if(typeof window.logout==='function' && !window.logout.__srWrapped){
    const orig=window.logout;
    const wrapped=function(){
      try{ localStorage.removeItem(SR_KEY); }catch(e){}
      SR_OPENER=null;
      return orig.apply(this, arguments);
    };
    wrapped.__srWrapped=true;
    window.logout=wrapped;
  }
})();

/* Capture is delegated, so fields inside modals rendered later are covered
   without anything needing to opt in. */
document.addEventListener('input', srSaveSoon, true);
document.addEventListener('change', srSaveSoon, true);
window.addEventListener('scroll', srSaveSoon, {passive:true});
/* The last keystroke before the phone freezes the page is the one that
   matters most, so these write immediately rather than on the debounce. */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) srSave(); });
window.addEventListener('pagehide', srSave);
window.addEventListener('blur', srSave);
setInterval(srSave, 5000);


/* =========================================================================
   SHOW / HIDE PASSWORD

   Typing a password blind on a phone, outdoors, with gloves on, is how you
   end up locked out of your own portal. Every password field gets an eye
   button inside its right edge. Attached by observation rather than by hand
   so fields drawn later, inside the change-password dialog for instance,
   are covered without anything needing to opt in.
========================================================================= */
(function(){
  const CSS=`
.pwWrap{position:relative;display:block;}
.pwWrap > input{padding-right:46px !important;}
.pwEye{
  position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;margin:0;cursor:pointer;
  color:var(--muted);border-radius:var(--radius-sm);
  -webkit-tap-highlight-color:transparent;
}
.pwEye:hover,.pwEye:focus-visible{color:var(--navy);background:var(--line-soft);}
.pwEye:focus{outline:none;}
.pwEye:focus-visible{box-shadow:0 0 0 3px rgba(232,121,26,.16);}
.pwEye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
`;
  const st=document.createElement('style');
  st.textContent=CSS;
  document.head.appendChild(st);

  const EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5c2 0 3.7.6 5.1 1.5"/><path d="M21.2 9.3c.5.9.8 1.5.8 1.5s-.3.6-.8 1.5"/><path d="M19.5 14.2C17.9 16 15.4 17.5 12 17.5 5.6 17.5 2 12 2 12"/><circle cx="12" cy="12" r="3"/><path d="M3.5 3.5l17 17"/></svg>';

  function attach(input){
    if(!input || input.dataset.pwEye==='1') return;
    if(input.type!=='password') return;
    input.dataset.pwEye='1';
    // Passwords are never written to the session cache, shown or hidden.
    input.dataset.nodraft='1';

    const wrap=document.createElement('span');
    wrap.className='pwWrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    const btn=document.createElement('button');
    btn.type='button';
    btn.className='pwEye';
    btn.innerHTML=EYE;
    btn.title='Show password';
    btn.setAttribute('aria-label','Show password');
    btn.setAttribute('aria-pressed','false');
    // Keep the keyboard up and the caret where it was.
    btn.addEventListener('mousedown', e=>e.preventDefault());
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      const showing = input.type==='text';
      const pos = input.selectionStart;
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE : EYE_OFF;
      const label = showing ? 'Show password' : 'Hide password';
      btn.title=label;
      btn.setAttribute('aria-label',label);
      btn.setAttribute('aria-pressed', showing ? 'false' : 'true');
      try{ input.focus({preventScroll:true}); input.setSelectionRange(pos,pos); }catch(err){}
    });
    wrap.appendChild(btn);
  }

  function scan(){
    document.querySelectorAll('input[type="password"]').forEach(attach);
  }
  scan();
  // Modals are built by replacing innerHTML, so new password fields appear
  // long after load. The scan is coalesced to one pass per frame, because the
  // app re-renders lists constantly and this must not sit in that path.
  let queued=false;
  new MutationObserver(function(){
    if(queued) return;
    queued=true;
    requestAnimationFrame(function(){ queued=false; scan(); });
  }).observe(document.body, {childList:true, subtree:true});
})();

</script>
</body>
</html>
