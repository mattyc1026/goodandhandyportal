<style>
:root{
  /* Brand navy + orange are fixed by the logo; everything else is tuned around them. */
  --navy:#0f2647; --navy2:#1b3f73; --orange:#e8791a; --orange2:#ff9436;
  /* Cool drafting-paper ground rather than warm cream: it pushes the navy
     structure forward and makes the orange accent read as a real signal.
     --cream keeps its name so every existing surface picks this up for free. */
  --cream:#e9edf3; --paper:#ffffff; --ink:#141f33; --muted:#5f6e87;
  --line:#dbe2ec; --line-soft:#eaeef4;
  /* Status tints, solid rather than translucent, so stacked colours never
     muddy each other. Pitched to actually carry across the card, a pale
     wash disappears against white and the stage stops being readable at a
     glance. High-contrast mode pushes these further still. */
  --red:#ffd9d9; --redb:#c0392b; --red-bold:#ffb3b3;
  --yellow:#fff1c4; --yellowb:#a5710a; --yellow-bold:#ffe08a;
  --green:#d2f2df; --greenb:#1f8a55; --green-bold:#a8ecc4;
  --blue:#d8e6ff; --blueb:#1f5aa8; --blue-bold:#aecdfa;
  --grey:#e9edf2; --greyb:#5f6e87;
  --radius:12px; --radius-sm:8px; --radius-lg:18px;
  /* Layered shadows read as real elevation instead of a single grey blur. */
  --sh-1:0 1px 2px rgba(15,38,71,.06), 0 1px 3px rgba(15,38,71,.04);
  --sh-2:0 2px 4px rgba(15,38,71,.06), 0 6px 16px rgba(15,38,71,.08);
  --sh-3:0 8px 20px rgba(15,38,71,.10), 0 20px 48px rgba(15,38,71,.14);
  --sh-4:0 24px 70px rgba(6,17,35,.42);
  --f-display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-data:'DM Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  /* Base font size for the adjustable text-size control on wide screens.
     The mobile stylesheet uses --mScale for the same job; both are driven
     from one setting by applyTextSize(), so the control covers the whole
     app rather than only phones. */
  --dScale:16px;

  /* ---- MOTION SYSTEM ----
     One place to tune the whole app's feel. The curves are the ones iOS
     uses: --e-spring is the sheet-presentation curve (fast off the mark,
     long soft settle), --e-out is the standard decelerate, and --e-bounce
     overshoots slightly for things that should feel physical when tapped.
     Durations are named by role, not by number, so a global retune is a
     three-line edit rather than a search across the stylesheet. */
  --e-spring:cubic-bezier(.32,.72,0,1);
  --e-out:cubic-bezier(.22,1,.36,1);
  --e-bounce:cubic-bezier(.34,1.56,.64,1);
  --e-in:cubic-bezier(.4,0,1,1);
  --t-press:.14s; --t-fast:.2s; --t-med:.32s; --t-sheet:.42s;

  /* Live-on-site neon. Deliberately outside the status palette: the job
     progression greens (--green / --greenb) mean "this stage of the
     lifecycle", while this means "a human is physically on the job right
     now", so it must not read as another shade of the same thing. */
  --neon:#00ff7a; --neon-rail:#00e36c; --neon-rgb:0,255,122;

  /* ---- Surface depth ----
     Three named levels, so a panel never has to guess which grey it is.
     0 is the page itself, 1 is a card lifted off it, 2 is a well recessed
     back into a card. The rule the stylesheet follows below: a surface gets
     a fill OR a border, never both, because doing both is what makes nested
     panels turn to mud. */
  --s0:var(--cream);      /* page ground */
  --s1:var(--paper);      /* card on the page */
  --s2:var(--cream);      /* recessed panel inside a card */

  /* Blueprint grid behind the app. Kept at the very edge of visibility on
     purpose: it should register as paper texture, not as a drawing. */
  --grid-line:rgba(15,38,71,.030); --grid-size:56px;

  /* Icon stroke weight, one number for the whole set. */
  --ic-stroke:1.7;

  /* ---- Notice / wizard surfaces ----
     These used to be hard-coded hexes scattered through the markup (the warm
     #fff3e0 warning boxes, the pre-site wizard's white cards). A hard-coded
     light background does not follow the theme, so in dark mode those panels
     stayed pale while the text and buttons on them turned light, which is why
     the Docs tab buttons vanished. Everything reads these instead now. */
  --notice:#fff3e0; --notice-line:#f0c48a; --notice-ink:#5a3d15;
  --well:#f5f7fb;          /* recessed strip inside a card */
  --field-ro:#f2f4f8;      /* read-only input fill */
  --accent-b:#2f6fed;      /* wizard accent, distinct from the status palette */
  --accent-b-soft:#f2f6ff;
}

/* ---- DARK MODE ----
   Toggled by adding class "dark" to <html>, the same mechanism as high
   contrast, driven from the settings menu and persisted. Everything below is
   a variable override, so the entire app re-themes without a single
   component needing a dark-specific rule; the handful of exceptions after
   this block are places where the original hard-coded a colour (#fff text on
   a coloured pill, the header gradient) and so can't follow a variable.

   Note --navy inverts meaning here: in light mode it is the dark heading
   ink, in dark mode it is the light heading ink. Everything reading it as
   "heading colour" keeps working; the few places reading it as "dark
   background" are corrected underneath. */
html.dark{
  color-scheme:dark;            /* native date pickers, scrollbars, form UI */
  --navy:#dbe5f5; --navy2:#16233a;
  --orange:#ff9a45; --orange2:#ffb572;
  --cream:#0e1522; --paper:#161f30; --ink:#e7edf7; --muted:#94a3bb;
  --line:#2b3a54; --line-soft:#1f2c42;
  --red:#38202a; --redb:#ff8f7d; --red-bold:#4b2733;
  --yellow:#372f19; --yellowb:#f3c65c; --yellow-bold:#4a3f1e;
  --green:#12301f; --greenb:#4fd48a; --green-bold:#1a4229;
  --blue:#152840; --blueb:#82b6ff; --blue-bold:#1e3757;
  --grey:#1b2536; --greyb:#93a3ba;
  --grid-line:rgba(180,205,245,.035);
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.44), 0 8px 20px rgba(0,0,0,.34);
  --sh-3:0 10px 26px rgba(0,0,0,.5), 0 24px 56px rgba(0,0,0,.44);
  --sh-4:0 26px 80px rgba(0,0,0,.7);
  --notice:#3a2a12; --notice-line:#6b4c1d; --notice-ink:#f2d9b0;
  --well:#131c2c; --field-ro:#1c2637;
  --accent-b:#7aa8ff; --accent-b-soft:#1a2740;
}
/* ---- High Contrast mode ----
   Toggled by adding class "hc" to <html>. Overrides the same CSS
   variables everything else already reads, so the whole app (text,
   borders, status highlight colors) gets darker text and stronger
   borders/backgrounds without needing separate override rules per
   element. */
html.hc{
  /* Every hard-coded #fff/#000 in the high-contrast rules below reads these
     two instead. That is what lets dark mode keep its ground when high
     contrast is switched on: the pair simply swaps. */
  --hc-bg:#ffffff; --hc-fg:#000000;
  --navy:#000000; --navy2:#000000; --orange:#a83e00; --orange2:#c74600;
  --cream:#ffffff; --paper:#ffffff; --ink:#000000; --muted:#2b2b2b;
  --line:#000000; --line-soft:#000000;
  --red:#ffbfbf; --redb:#a30000; --red-bold:#ff8f8f;
  --yellow:#ffe89a; --yellowb:#6b5400; --yellow-bold:#ffcf3d;
  --green:#b3ecc8; --greenb:#0b5c34; --green-bold:#79e0a2;
  --blue:#bcd7ff; --blueb:#0a3a86; --blue-bold:#87b6f7;
  --grey:#e0e0e0; --greyb:#222222;
  /* High contrast trades the glow for a heavy, unambiguous green rail. */
  --neon:#005c2a; --neon-rail:#005c2a; --neon-rgb:0,92,42;
  --notice:#fff4d6; --notice-line:#6b5400; --notice-ink:#000000;
  --well:#ffffff; --field-ro:#ffffff; --accent-b:#0a3a86; --accent-b-soft:#dbe8ff;
  --sh-1:none; --sh-2:none; --sh-3:none; --sh-4:none;
}
/* ---- Dark + High Contrast ----
   High contrast used to be a light-only palette, so turning it on while in
   dark mode flipped the whole app back to white: the two classes set the same
   variables and this one came last. It now has a dark counterpart, which wins
   on specificity, so the pairing means "maximum contrast, still dark" rather
   than "dark mode off". Same job as the block above, black ground instead of
   white, with the status tints darkened and their accents lifted so text on
   them clears the same bar. */
html.dark.hc{
  color-scheme:dark;
  --hc-bg:#000000; --hc-fg:#ffffff;
  --navy:#ffffff; --navy2:#ffffff; --orange:#ffb066; --orange2:#ffc48c;
  --cream:#000000; --paper:#000000; --ink:#ffffff; --muted:#e8e8e8;
  --line:#ffffff; --line-soft:#ffffff;
  --red:#4a0d0d; --redb:#ff9a90; --red-bold:#6b1212;
  --yellow:#3d3000; --yellowb:#ffd54a; --yellow-bold:#584600;
  --green:#00331d; --greenb:#63f0a6; --green-bold:#004d2c;
  --blue:#001f4d; --blueb:#93bdff; --blue-bold:#002e70;
  --grey:#242424; --greyb:#e0e0e0;
  --neon:#5eff9f; --neon-rail:#5eff9f; --neon-rgb:94,255,159;
  --notice:#332600; --notice-line:#ffd54a; --notice-ink:#ffeab4;
  --well:#000000; --field-ro:#000000; --accent-b:#93bdff; --accent-b-soft:#001f4d;
  --sh-1:none; --sh-2:none; --sh-3:none; --sh-4:none;
}
html.hc body{background:var(--hc-bg);}
/* High contrast keeps the status spine, it just makes it heavier, along with
   the surrounding border. Setting only the individual sides leaves the left
   rail intact; a `border-width` shorthand here would flatten it. */
html.hc .woRow{border-top-width:2px;border-right-width:2px;border-bottom-width:2px;border-left-width:8px;}
html.hc .woRow.st-red-bold,html.hc .woRow.st-yellow-bold,html.hc .woRow.st-green-bold,html.hc .woRow.st-blue-bold{
  border-top-width:3px;border-right-width:3px;border-bottom-width:3px;border-left-width:12px;
}
html.hc .woSub,html.hc .woMeta,html.hc .woLastNote,html.hc .woNoteDate,html.hc .listHeader p,html.hc .small,html.hc .field label{color:var(--hc-fg) !important;}
html.hc .tag{border:1px solid var(--hc-fg);}
html.hc .field input,html.hc select,html.hc textarea{border:1.5px solid var(--hc-fg);}
html.hc a,html.hc .editLink,html.hc .adminViewLink{color:var(--orange);}
*{box-sizing:border-box;}
/* The blueprint grid from the login screen, carried through the whole app at
   a fraction of the strength. background-attachment:fixed keeps it still
   while the board scrolls, so it reads as the paper the app is printed on
   rather than as content. */
body{margin:0;font-family:var(--f-body);color:var(--ink);
  background-color:var(--cream);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:var(--grid-size) var(--grid-size);
  background-attachment:fixed;
  font-size:var(--dScale,16px);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em;}
h1,h2,h3{font-family:var(--f-display);margin:0 0 .3em;color:var(--navy);font-weight:400;letter-spacing:-.01em;}
button{cursor:pointer;font-family:inherit;font-size:inherit;}
/* Form controls don't inherit font-size from the page by default, so without
   this the text-size control would leave every input and button behind on
   desktop. Class-level em sizes still win over this, so relative sizing is
   preserved, this only supplies the scalable baseline. */
input,select,textarea{font-family:inherit;font-size:inherit;}
.hidden{display:none !important;}

/* ---- LOGIN ----
   Deep navy ground with a faint drafting-grid overlay and a warm glow behind
   the card, the workshop-blueprint idea the rest of the app is built on,
   stated once, at full strength, where there's room for it. */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:28px 16px;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(232,121,26,.20), transparent 60%),
    linear-gradient(165deg,#122c52 0%,var(--navy) 45%,#0a1b33 100%);
}
#loginScreen::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(85% 70% at 50% 40%, #000 30%, transparent 100%);
  mask-image:radial-gradient(85% 70% at 50% 40%, #000 30%, transparent 100%);
}
html.hc #loginScreen{background:var(--hc-bg);}
html.hc #loginScreen::before{display:none;}
.loginCard{
  background:var(--paper);width:392px;max-width:100%;border-radius:var(--radius-lg);
  padding:38px 34px 32px;box-shadow:var(--sh-4);position:relative;z-index:1;
  border:1px solid rgba(255,255,255,.6);
}
html.hc .loginCard{border:2px solid var(--hc-fg);}
.loginCard h1{font-size:1.7em;text-align:center;}
.loginCard .tag{
  text-align:center;color:var(--orange);font-weight:700;letter-spacing:.18em;
  font-size:.68em;text-transform:uppercase;margin-bottom:24px;
}
.field{margin-bottom:15px;}
.field label{
  display:block;font-size:.7em;color:var(--muted);margin-bottom:6px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
}
.field input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  font-size:1em;font-family:inherit;background:var(--paper);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{
  outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(232,121,26,.16);
}
.btn{
  background:var(--orange);color:#fff;border:none;padding:13px 22px;
  border-radius:var(--radius-sm);font-weight:700;font-size:1em;min-height:44px;
  font-family:inherit;letter-spacing:.01em;
  box-shadow:0 1px 2px rgba(15,38,71,.12);
  transition:background .15s,transform .1s,box-shadow .15s;
}
.btn:hover{background:var(--orange2);box-shadow:0 4px 12px rgba(232,121,26,.32);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:transparent;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;}
.btn.secondary:hover{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:var(--sh-1);}
.btn.danger{background:var(--redb);}
.btn.danger:hover{background:#a52f22;box-shadow:0 4px 12px rgba(192,57,43,.3);}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
.btnRow{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;}
.switchLine{text-align:center;margin-top:18px;font-size:.85em;color:var(--muted);}
.switchLine a{color:var(--orange);cursor:pointer;font-weight:600;text-decoration:none;}
.switchLine a:hover{text-decoration:underline;}
.errMsg{color:var(--redb);font-size:.82em;margin-top:-6px;margin-bottom:10px;min-height:1em;font-weight:500;}

/* ---- APP SHELL ---- */
#appScreen{min-height:100vh;}
header.top{
  background:linear-gradient(180deg,#14315b,var(--navy));
  color:#fff;padding:13px 26px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, var(--sh-2);
  position:sticky;top:0;z-index:50;
}
html.hc header.top{background:#000;color:#fff;}
.globalSearchBar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:11px 26px;display:flex;gap:10px;align-items:center;
}
.globalSearchBar input{
  flex:1;max-width:480px;padding:10px 14px;border-radius:var(--radius-sm);
  border:1.5px solid var(--line);font-size:.92em;font-family:inherit;
  box-sizing:border-box;background:var(--cream);color:var(--ink);
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.globalSearchBar input:focus{
  outline:none;background:var(--paper);border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(232,121,26,.14);
}
.globalSearchBar button{white-space:nowrap;flex:0 0 auto;}
header.top .brand{font-family:var(--f-display);font-size:1.35em;}
header.top .brand span{color:var(--orange);}
.userBadge{display:flex;align-items:center;gap:12px;font-size:.85em;}
.adminPill{
  background:var(--orange);color:#fff;font-size:.66em;padding:3px 9px;border-radius:20px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.logoutBtn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:#fff;
  padding:7px 14px;border-radius:var(--radius-sm);font-size:.82em;font-weight:600;
  font-family:inherit;transition:background .15s,border-color .15s;
}
.logoutBtn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);}
.settingsWrap{position:relative;}
.settingsBtn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;min-height:34px;padding:0;border-radius:50%;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;
  font-size:1.15em;line-height:1;transition:background .15s;
}
.settingsBtn:hover{background:rgba(255,255,255,.18);}
/* Inline SVG gear instead of the U+2699 character. The character has both a
   plain and an emoji presentation, so the icon changed appearance depending on
   the device and font. This renders identically everywhere and inherits the
   button's color, including in high-contrast mode. */
.gearIcon{
  width:19px;height:19px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linejoin:round;stroke-linecap:round;
  pointer-events:none;
}
.settingsMenu{
  display:none;position:absolute;top:calc(100% + 10px);right:0;
  background:var(--paper);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--sh-3);
  padding:8px;min-width:200px;z-index:200;
}
.settingsMenu.open{display:block;}
.settingsRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 8px;}
.settingsRow:not(:last-child){border-bottom:1px solid var(--line-soft);}
.settingsRow span{font-size:.85em;font-weight:600;color:var(--ink);}
.textSizeBtn{
  min-width:40px;min-height:34px;padding:0 10px;
  border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--cream);color:var(--navy);font-weight:700;font-family:inherit;
}
.textSizeBtn:hover{border-color:var(--navy);}
.hcToggleBtn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;min-height:34px;padding:0;border-radius:50%;
  border:1.5px solid var(--line);background:transparent;
}
.hcToggleBtn[aria-pressed="true"]{border-color:var(--navy);border-width:2px;}

.tabsBarWrap{position:sticky;top:0;z-index:49;}
.tabsToggleBtn{display:none;}
nav.tabs{display:flex;background:var(--navy2);padding:0 20px;gap:2px;overflow-x:auto;}
nav.tabs button{
  background:transparent;border:none;color:rgba(255,255,255,.62);
  padding:14px 20px;font-size:.9em;font-weight:600;font-family:inherit;
  border-bottom:3px solid transparent;white-space:nowrap;
  transition:color .15s,background .15s,border-color .15s;
}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06);}
nav.tabs button.active{color:#fff;border-bottom-color:var(--orange);background:rgba(255,255,255,.08);}
nav.tabs button .count{
  background:rgba(255,255,255,.16);border-radius:20px;padding:2px 8px;margin-left:7px;
  font-size:.8em;font-family:var(--f-data);font-weight:500;
}
nav.tabs button.active .count{background:var(--orange);color:#fff;}

main{padding:26px 30px;max-width:1300px;margin:0 auto;}
.listHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.listHeader h2{font-size:1.5em;}
.listHeader p{color:var(--muted);font-size:.85em;margin:0;line-height:1.5;}
.sortWrap{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.sortWrap label{font-size:.72em;color:var(--muted);font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;}
.sortWrap select{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;
  font-size:.85em;font-family:inherit;background:var(--paper);color:var(--navy);font-weight:600;
}
.sortWrap select:hover{border-color:var(--navy);}

/* ---- WORK ORDER ROW: the status spine ----
   The colour system is a PROGRESSION through the job lifecycle, not a severity
   scale. Jobs advance red > yellow > green > blue, and within each colour the
   BOLD state means "this stage still needs doing" while the TRANSPARENT state
   means "it's been actioned and is now in flight":

     red-bold     pre-site inspection needed      red     pre-site scheduled
     yellow-bold  estimate needs building         yellow  estimate pending approval
     green-bold   job needs scheduling            green   scheduled / in progress
     blue-bold    invoice needs building          blue    invoiced, survey pending
     grey         closed, in job history

   Each row is a white card with a solid rail down its left edge carrying the
   stage colour, and a tint that fades out over a fixed distance from the rail.
   Bold states get a thicker rail, a deeper tint and a full coloured border, so
   "waiting on me" reads at a glance against "waiting on someone else", without
   washing the whole card in colour and drowning the text. */
.woRow{
  background:var(--paper);border:1px solid var(--line);
  border-left:5px solid var(--line);border-radius:var(--radius);
  padding:15px 18px;margin-bottom:10px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}
.woRow:hover{box-shadow:var(--sh-2);transform:translateY(-2px);}
/* Stage colours here are the spine and border only. The tint across the card
   is handled by the stage meter further down, which sizes the wash by how far
   along the job is rather than giving every stage the same width. */
.woRow.st-red{border-left-color:var(--redb);}
.woRow.st-red-bold{border-color:var(--redb);border-left-color:var(--redb);border-left-width:8px;}
.woRow.st-yellow{border-left-color:var(--yellowb);}
.woRow.st-yellow-bold{border-color:var(--yellowb);border-left-color:var(--yellowb);border-left-width:8px;}
.woRow.st-green{border-left-color:var(--greenb);}
.woRow.st-green-bold{border-color:var(--greenb);border-left-color:var(--greenb);border-left-width:8px;}
.woRow.st-blue{border-left-color:var(--blueb);}
.woRow.st-blue-bold{border-color:var(--blueb);border-left-color:var(--blueb);border-left-width:8px;}
.woRow.st-grey{border-left-color:var(--greyb);}
/* The bold tints are saturated enough that the default muted grey loses
   contrast against them, darken the supporting text on those rows so a
   job that still needs action stays the most readable one on the board. */
.woRow.st-red-bold .woSub, .woRow.st-red-bold .woMeta, .woRow.st-red-bold .woLastNote, .woRow.st-red-bold .woNoteDate,
.woRow.st-yellow-bold .woSub, .woRow.st-yellow-bold .woMeta, .woRow.st-yellow-bold .woLastNote, .woRow.st-yellow-bold .woNoteDate,
.woRow.st-green-bold .woSub, .woRow.st-green-bold .woMeta, .woRow.st-green-bold .woLastNote, .woRow.st-green-bold .woNoteDate,
.woRow.st-blue-bold .woSub, .woRow.st-blue-bold .woMeta, .woRow.st-blue-bold .woLastNote, .woRow.st-blue-bold .woNoteDate{
  color:var(--ink);
}
/* The follow-up badge needs a solid ground so it stays legible on the tint. */
.woRow.st-red-bold .followupBadge, .woRow.st-yellow-bold .followupBadge,
.woRow.st-green-bold .followupBadge, .woRow.st-blue-bold .followupBadge{
  background:rgba(255,255,255,.85);
}
.woRow .woMain{display:flex;flex-direction:column;gap:3px;}
.woRow .woName{font-weight:700;color:var(--navy);font-size:1.02em;letter-spacing:-.01em;}
.woRow .woSub{font-size:.8em;color:var(--muted);}
.woRow .woMeta{display:flex;align-items:center;gap:16px;font-size:.78em;color:var(--muted);row-gap:10px;flex-wrap:wrap;}
/* Status pills follow the same bold/transparent logic as the row spine:
   a SOLID pill is a stage still waiting on you, an OUTLINED pill is a stage
   already actioned and now in flight. Same hue, so the pill and the rail
   always agree about where the job sits. */
.tag{
  padding:3px 11px;border-radius:20px;font-size:.7em;font-weight:700;
  letter-spacing:.07em;white-space:nowrap;text-transform:uppercase;
  border:1.5px solid transparent;
}
/* needs doing, solid */
.tag.pending{background:var(--redb);color:#fff;}
.tag.build-est{background:var(--yellowb);color:#fff;}
.tag.go{background:var(--greenb);color:#fff;}
.tag.build-inv{background:var(--blueb);color:#fff;}
/* in flight, outlined */
.tag.sched{background:var(--red);color:var(--redb);border-color:var(--redb);}
.tag.awaiting-approval{background:var(--yellow);color:var(--yellowb);border-color:var(--yellowb);}
.tag.in-prog{background:var(--green);color:var(--greenb);border-color:var(--greenb);}
.tag.survey{background:var(--blue);color:var(--blueb);border-color:var(--blueb);}
/* closed */
.tag.hist{background:var(--grey);color:var(--greyb);border-color:var(--line);}
html.hc .tag.pending,html.hc .tag.build-est,html.hc .tag.go,html.hc .tag.build-inv{color:var(--hc-bg);}
.emptyState{
  text-align:center;padding:64px 24px;color:var(--muted);
  background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);
}
.subListHeader{
  margin:26px 2px 12px;font-size:.76em;color:var(--navy);display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding-bottom:8px;
  text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-family:var(--f-body);
}
.subListHeader .count{
  background:var(--navy);color:#fff;border-radius:999px;font-size:.9em;padding:2px 9px;
  font-family:var(--f-data);font-weight:500;letter-spacing:0;
}
input[type="checkbox"]{width:19px;height:19px;cursor:pointer;accent-color:var(--orange);}
.jcCheck{
  display:flex;align-items:center;gap:10px;font-size:.88em;background:var(--cream);
  padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;min-height:40px;
  box-sizing:border-box;border:1px solid transparent;transition:border-color .15s,background .15s;
}
.jcCheck:hover{border-color:var(--line);background:var(--paper);}
.estDecisionRow{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap;}
.docsTab{background:var(--paper);}
.docsTab h4{margin-top:0;}
/* The upload control was a raw, unstyled browser file input. Given it as a
   drop target and a real button it reads as part of the app and gives a much
   larger tap area on a phone. */
.docsTab input[type="file"]{
  display:block;width:100%;padding:14px;border:1.5px dashed var(--orange);
  border-radius:var(--radius);background:rgba(232,121,26,.04);
  font-size:.88em;color:var(--muted);cursor:pointer;box-sizing:border-box;
}
.docsTab input[type="file"]:hover{background:rgba(232,121,26,.09);}
.docsTab input[type="file"]::file-selector-button{
  background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:9px 16px;margin-right:12px;font-family:inherit;font-weight:700;
  font-size:.95em;cursor:pointer;min-height:38px;
}
.docsTab input[type="file"]::file-selector-button:hover{background:var(--orange2);}
.docsTab input[type="file"]:disabled{opacity:.55;cursor:progress;border-style:solid;}
html.hc .docsTab input[type="file"]{border-color:var(--hc-fg);background:var(--hc-bg);color:var(--hc-fg);}
html.hc .docsTab input[type="file"]::file-selector-button{background:var(--hc-fg);color:var(--hc-bg);}
.docRow{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:var(--cream);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:12px;flex-wrap:wrap;
}
.docInfo{display:flex;flex-direction:column;gap:2px;min-width:0;}
.docName{font-weight:600;color:var(--navy);word-break:break-word;}
.docActions{display:flex;gap:12px;flex-wrap:wrap;}
.docActions .btn{padding:9px 16px;font-size:.88em;min-height:40px;}
.newWoBtn{
  width:100%;border:1.5px dashed var(--orange);background:var(--paper);
  color:var(--orange);border-radius:var(--radius);padding:17px;font-weight:700;
  font-size:.95em;margin-bottom:18px;font-family:inherit;letter-spacing:.01em;
  transition:background .15s,border-color .15s;
}
.newWoBtn:hover{background:rgba(232,121,26,.07);border-color:var(--orange2);}

/* ---- MODAL ---- */
.overlay{
  position:fixed;inset:0;background:rgba(10,24,45,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;z-index:100;
}
.modal{
  background:var(--paper);border-radius:var(--radius-lg);width:100%;max-width:1100px;
  box-shadow:var(--sh-4);animation:pop .16s cubic-bezier(.2,.8,.3,1);overflow-x:hidden;
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
.modalHead{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:20px 24px;border-bottom:1px solid var(--line);gap:14px;
}
.modalHead h2{margin:0;font-size:1.3em;}
/* align-items:start is what keeps the two columns reading as a block anchored
   at the top left. Without it every cell stretches to its row height and the
   taller display-serif name appears to float in the middle of row one, which
   is what made the columns look vertically centred against each other. */
.modalHeadCust{display:block;cursor:pointer;}
/* Only the name/phone and address/email cells live in the grid. The homeowner
   row sits outside it, so its width can never feed back into how wide the
   first column is drawn. */
.mhCols{
  display:flex;flex-wrap:wrap;align-items:flex-start;
  column-gap:clamp(28px, 2vw, 56px);row-gap:10px;
}
/* Each column is its own box. A grid cell could be squeezed narrower than its
   own text, and the overflow then painted straight across the gap, which is
   what made the address look glued to the name in a desktop-width window.
   These shrink to a floor and then wrap the address block underneath instead. */
.mhCols > .mhColA,.mhCols > .mhColB{
  display:flex;flex-direction:column;gap:3px;
  min-width:0;flex:0 1 auto;max-width:100%;
}
.mhCols > .mhColA{flex-basis:auto;}
.modalHeadCust .mhName,
.modalHeadCust .mhAddr1,.modalHeadCust .mhAddr2,
.modalHeadCust .mhEmail{overflow-wrap:anywhere;}
/* Every cell is placed explicitly rather than left to auto-placement. The two
   columns read down as name/phone/alt and address1/address2/email, so the
   markup can keep the address lines adjacent to each other. Auto-placement
   forced the DOM to alternate columns, which meant dragging to select the
   address swept up the phone number sitting between the two lines. */
.modalHeadCust .mhHomeowner{
  margin-top:11px;padding-top:9px;border-top:1px solid var(--line);
  font-size:.86em;color:var(--ink);
}
.modalHeadCust.editing{display:flex;flex-direction:column;gap:6px;width:360px;max-width:100%;cursor:default;}
.modalHeadCust.editing .kv{margin-bottom:0;}
/* A tight line-height pulls the name up to the top of its cell. At the default
   the serif's line box adds several pixels of lead above the caps, which read
   as the name sitting lower than the address beside it. */
.modalHeadCust .mhName{font-family:var(--f-display);font-size:1.45em;line-height:1.15;color:var(--navy);font-weight:400;letter-spacing:-.01em;}
/* These used to bottom-align inside their row, which pushed the first address
   line down away from the name it sits beside. They align to the top of the
   row like everything else now. */
.modalHeadCust .mhAddr1,.modalHeadCust .mhAddr2{font-size:.88em;color:var(--muted);}
/* Tap-to-call numbers. Marked with the accent and a dotted underline so it's
   discoverable that they're actionable, without turning every phone number
   into a loud button. The negative margin keeps the enlarged tap target from
   shifting the surrounding layout. */
.telLink{
  color:var(--orange);text-decoration:none;font-weight:500;
  border-bottom:1px dotted rgba(232,121,26,.55);
  padding:2px 1px;margin:-2px -1px;border-radius:3px;
  transition:color .12s,background .12s;
}
.telLink:hover{color:var(--orange2);background:rgba(232,121,26,.09);border-bottom-color:var(--orange2);}
.telLink:active{background:rgba(232,121,26,.18);}
html.hc .telLink{color:var(--orange);border-bottom:2px solid var(--orange);font-weight:700;}
@media (max-width:900px){
  /* Bigger, easier target on the device where calling actually happens. */
  .telLink{display:inline-block;padding:6px 4px;margin:-6px -4px;}
}
.modalHeadCust .mhPrimary,.modalHeadCust .mhAlt{font-size:.92em;color:var(--ink);font-family:var(--f-data);font-size:.86em;}
.modalHeadCust .mhEmail{font-size:.88em;color:var(--muted);}
.modalHeadCust .mhHomeownerTag{

/* Job Details edit mode: each sub-list gets a header that doubles as a
   collapse control, so a long labor list can be folded away while working on
   materials. The chevron reuses the same --chev mask as the work order rows
   rather than a text glyph, so it keeps its weight in any font. */
.jdToggle{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 10px;padding:0;
  background:none;border:none;color:inherit;font-family:inherit;text-align:left;cursor:pointer;}
.jdToggle h5{margin:0;flex:1;}
.jdToggle .jdChev{width:10px;height:10px;flex:none;background-color:var(--navy);
  -webkit-mask:var(--chev) center/contain no-repeat;mask:var(--chev) center/contain no-repeat;
  transform:rotate(90deg);transition:transform .18s ease;}
.jdToggle.collapsed .jdChev{transform:rotate(0deg);}
.jdToggle.collapsed{margin-bottom:0;}
.jdToggle .jdCount{flex:none;font-size:.72em;font-weight:700;color:var(--navy);opacity:.55;}
.jdToggle:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:4px;}
@media (prefers-reduced-motion: reduce){
  .jdToggle .jdChev{transition:none;}
}
.editRow{display:flex;gap:6px;margin-bottom:6px;align-items:stretch;}
/* min-width:0 lets the text fields give way to the grip and delete button.
   Without it a flex item refuses to shrink below its content width and the
   row overflows on a phone instead of the inputs narrowing. */
.editRow input{flex:1;min-width:0;padding:8px 10px;border-radius:6px;border:1.5px solid var(--line);font-family:inherit;background:var(--paper);color:var(--ink);}
/* Scoped to .jdDel rather than every button in the row: the drag grip is a
   button too, and must not inherit the destructive red. */
.editRow .jdDel{background:var(--redb);color:#fff;border:none;border-radius:6px;padding:0 12px;font-family:inherit;font-weight:700;flex:none;cursor:pointer;}
/* Drag handle. Deliberately faint: it sits on every row, so at full strength
   it would turn a list of content into a column of controls. It comes up on
   hover and whenever a drag is in progress.
   touch-action:none is load-bearing on a phone. Without it the browser claims
   the vertical gesture for scrolling and the drag never gets any move events. */
.editRow .jdGrip{
  flex:none;width:24px;align-self:stretch;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:6px;
  color:var(--muted);opacity:.4;font-size:1.1em;line-height:1;
  font-family:inherit;cursor:grab;touch-action:none;
  transition:opacity .12s,background .12s;
}
.editRow .jdGrip:hover{opacity:.95;background:var(--cream);}
.editRow .jdGrip:focus-visible{opacity:1;outline:2px solid var(--orange);outline-offset:1px;}
.editRow .jdGrip:active{cursor:grabbing;}
.jdRows.jdDragging .jdGrip{opacity:.8;}
/* Each sub-list is its own scroll area once it outgrows the cap. That is what
   lets a drag scroll the list and nothing else: without it the nearest
   scrollable ancestor is the whole modal body, and reaching for a slot further
   down would drag the description and the other sub-lists past you too.
   overscroll-behavior stops a flick at either end leaking into the panel. */
.jdRows{position:relative;max-height:min(52vh,430px);overflow-y:auto;overscroll-behavior:contain;}
.jdRows.jdDragging{cursor:grabbing;-webkit-user-select:none;user-select:none;}
/* While a drag is live the other rows are scenery. Without this they light up
   their own grips as the pointer sweeps past, which reads as the row having
   jumped to whichever line is under the cursor. */
.jdRows.jdDragging .editRow:not(.dragging) .jdGrip{pointer-events:none;}
.jdRows.jdDragging .editRow:not(.dragging) .jdGrip:hover{opacity:.4;background:transparent;}
/* Rows slide aside rather than jumping, so the gap visibly opens where the
   line will land. The dragged row is exempt: it tracks the pointer directly
   and any easing would make it lag behind the cursor. */
.jdRows.jdDragging .editRow{transition:transform .16s var(--e-out);}
/* The row being dragged lifts off the list so it is obviously the thing under
   your finger, and stops swallowing pointer events aimed at the rows beneath. */
.editRow.dragging{
  background:var(--paper);border-radius:8px;box-shadow:var(--sh-3);
  position:relative;z-index:5;cursor:grabbing;transition:none;
  will-change:transform;
}
.editRow.dragging input,.editRow.dragging .jdDel{pointer-events:none;}
@media (prefers-reduced-motion: reduce){
  .jdRows.jdDragging .editRow{transition:none;}
}
@media (max-width:900px){
  .editRow .jdGrip{width:34px;min-height:40px;opacity:.55;}
}
@media (prefers-reduced-motion: reduce){
  .editRow .jdGrip{transition:none;}
}
